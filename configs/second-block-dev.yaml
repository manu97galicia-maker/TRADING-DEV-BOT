# Five-buy trial: first-block activity, second produced block. Enable only on the droplet.
enabled: false
strategy_id: dev-second-block
entry_rule: first_block_activity_only
entry_timing: second_produced_block
require_dev_initial_buy: true
balance_fraction: 0.80
# Inclusive entry budget: lower of this USD cap and the balance fraction.
max_entry_budget_usd: 30.0
# Trial counts accepted and unresolved buys in the durable wallet ledger.
trial_id: first-block-3-buyers-350-usd-20261104
max_trial_buys: 5
# No ROI batch gate; the five-buy trial cap is independent.
batch_gate_enabled: false
require_first_block_activity: true
min_first_block_volume_usd: 350
min_distinct_first_block_buyers: 3
buy_priority_fee_cap_usd: 0.07
sell_priority_fee_cap_usd: 0.03
# Leave time for relay before the next slot; inclusion is audited after confirmation.
max_slot_age_seconds: 0.20
third_block_retry_on_sharp_rise: false
reject_sharp_price_rise: false
exit:
  kind: second-block-capital-recovery
  initial_gain: 0.35
  later_step_gain: 0.40
  later_sales: 3
  # At +35%, target the initial investment plus 12% nominal profit.
  first_sale_mode: recover_capital_plus_profit
  recovery_profit_fraction: 0.12
  first_sale_original_fraction: null
  # Requested 22% stop; "12" refers to recovered profit.
  stop_loss_fraction: 0.22
