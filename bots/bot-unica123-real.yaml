# UNICA123 REAL - prueba controlada. No arrancar sin revisar saldo y wallet.
#
# Sustituye a DEFINITIVA, ELITE y RAPIDA, que hacian lo mismo con umbrales de
# creador distintos y se pisaban entre ellas comprando la misma moneda.
#
# LA ENTRADA SALE DE UNA MEDIDA, no de una corazonada. El 20-ago se cruzaron
# 1.016 monedas (lectura del bot en los 5 primeros segundos) con su maximo
# real segun pump.fun:
#
#   base de la muestra ................  8,1% llegan a 6K   3,1% a 12K
#   6+ carteras, 8-15 SOL, MC <=2.800 .. 20,0% llegan a 6K   7,5% a 12K
#
#   Eso es 2,48 veces mejor que no filtrar.
#
# LO QUE SEPARA ES CUANTA GENTE DISTINTA COMPRA, no cuanto dinero entra:
#
#   0-5 carteras   5,8% llegan a 6K
#   5-8            8,3%
#   8-12          12,2%
#   12-20         15,0%
#
# Y MAS SOL NO ES MEJOR. De 8 a 15 SOL en cinco segundos rinde un 10,8%; por
# encima de 15 baja al 9,1% y solo el 1,8% llega a 12K. Eso ya no es demanda,
# es bundle. Por eso hay techo de volumen y no solo suelo.
#
# EL 18% DE LA CURVA NO ERA LA SENAL: pasarlo en 5 segundos da 9,3% frente al
# 6,7% de no pasarlo. Existe, pero es ruido al lado de lo de arriba.
#
# =============================================================================
#  VOL4K  ·  recien nacidas  ·  volumen  ·  dev que migra 10%+  ·  0,35 SOL
#  Salida 55% al +40% · 20% al +100% · 10% al x3 · 15% moonbag · SIN STOP
# =============================================================================
#
# Pedida por Manu el 15-ago como UNICA estrategia activa. Junta tres cosas que
# hasta ahora iban por separado: que la moneda acabe de nacer, que ya se este
# moviendo dinero de verdad en ella, y que el creador tenga historial.

name: "UNICA123 REAL - curva 93% con presion y anti-rug"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

# ENCENDIDO EL 13-oct, pedido: se eligio C123 frente a la de la curva al 96%
# que venia corriendo. Solo puede haber UNO encendido: los dos comparten la
# misma wallet y se reparten las mismas plazas, asi que con los dos a la vez
# ningun resultado del dia se podria atribuir a ninguno.
# APAGADA EL 4-nov, pedido: "Solo quiero la de comprar bloque 2 con dev
# migrado 1%". Venia de true. `paper_trade` se deja como estaba (en real):
# volver a encenderla es solo poner esto en true. Con enabled en false el
# arranque de "todas" (`python -m bot_runner`, arranca.sh, pump-bot) la salta.
enabled: false
separate_process: false
platform: "pump_fun"

trade:
  # === VUELTA ATRAS DEL 16-oct, pedido: "No compra pon la anterior
  # configuracion". Se restaura la ENTRADA tal y como estaba cuando el bot si
  # compraba (commit 8fb4dd5, "pillando buenas subidas"). Lo que se apaga son
  # MIS filtros, no los suyos: la banda de dolares, el volumen, la presion y
  # el umbral del 80% los introduje yo esta noche y el bot dejo de comprar.
  # El tamano (60%), el suelo de compra y la reserva se CONSERVAN porque son
  # ordenes suyas posteriores y no son lo que impedia comprar. ===
  # Compra normal de 0,10 SOL. El techo absoluto impide superar 0,20 SOL por
  # operacion aunque otra ruta proponga un importe superior.
  # YA NO MANDA. Desde el 15-oct el importe lo decide `fraccion_saldo`,
  # que va ANTES que esta clave. Se deja escrito como respaldo: con
  # `fraccion_saldo: 0` volveria a mandar este 0,10.
  buy_amount: 0.10
  # 60% DEL SALDO LIBRE POR OPERACION (15-oct, pedido): "Y pon 60% sol
  # balance por operaciones maximo 3 simultaneamente".
  #
  # SUSTITUYE A LA ESCALERA 33/40/50 de hace un rato, que a su vez habia
  # sustituido al 25% de la manana. Tercer tamano de hoy: 25% -> escalera
  # 33/40/50 -> 60% plano. Queda dicho para que no parezca que la escalera
  # se perdio por descuido: la pidio Manu y la ha cambiado Manu.
  # `fracciones_saldo` se BORRA (no se pone a 0: un 0 ahi tambien se
  # descarta, pero dejar la clave escrita invita a creer que sigue mandando).
  #
  # SE APLICA AL SALDO QUE QUEDA (`fraccion_base: libre`), asi que las
  # compras menguan solas. Con 1 SOL:
  #
  #   compra 1: 25% de 0,985 = 0,24625  -> quedan 0,739
  #   compra 2: 25% de 0,739 = 0,18469  -> quedan 0,554
  #   compra 3: 25% de 0,554 = 0,13852  -> quedan 0,416
  #   --------------------------------------------------
  #   desplegado 0,56945 (57,8% del libre)
  #
  # DOS CONSECUENCIAS QUE HAY QUE SABER, y no son opiniones:
  #
  # 1. CON EL 25% (18-oct) LAS POSICIONES SALEN CASI IGUALES. La primera es
  #    1,78 veces la tercera (0,24625 contra 0,13852). Con el 60% era 6,4
  #    veces, apostando fuerte a la primera. Esto reparte.
  #
  # 2. SE DESPLIEGA EL 93% DEL SALDO, contra el 80% de la escalera. Queda
  #    muy poco fuera. El gas de las ventas lo cubre `min_reserve_sol`
  #    (0,015, intocable), asi que eso no peligra, pero no queda colchon
  #    para una cuarta oportunidad.
  # 25% EL 18-oct, pedido: "25% sol balance por operacion". Venia del 60%.
  #
  # Con 3 plazas y 1 SOL libre, las compras salen 0,246 / 0,185 / 0,138 SOL
  # (cada una el 25% de lo que queda), y se despliega el 58% del saldo libre
  # en vez del 94% que desplegaba el 60%. Mas tiros y mas pequenos.
  # 20% EL 23-oct, pedido: "20% de sol total balance por operacion".
  # Venia del 25%.
  fraccion_saldo: 0.20
  # SOBRE QUE SE CALCULAN ESOS PORCENTAJES, que es la mitad de la decision:
  #
  #   libre    el SOL gastable: saldo - reserva - lo ya comprometido.
  #            Mengua con cada compra, asi que las compras salen cada vez
  #            mas pequenas y el tamano se frena SOLO.
  #   cartera  saldo MAS lo que ya valen las monedas. No baja al comprar,
  #            asi que salen IGUALES y cuatro del 25% comprometen el 100%.
  #
  # SE ELIGE `libre` porque se pidio "del sol balance" --el SOL que hay--
  # y porque se acaba de quitar el tope de posiciones: sin tope y con base
  # `cartera`, cuatro compras dejarian la cartera entera dentro. Con
  # `libre` el propio tamano hace de freno.
  fraccion_base: libre
  # QUITADO EL 15-oct. Pedido "25% del sol balance por compra" y repetido
  # ("25% sol por oper") al ver que no se aplicaba.
  #
  # ESTE TOPE LO RECORTABA EN SILENCIO. Con 0,20 SOL, el 25% dejaba de
  # mandar en cuanto el saldo libre pasaba de 0,81 SOL: a partir de ahi se
  # compraba 0,20 fijo pasara lo que pasara. Con 2 SOL el 25% serian 0,49
  # y se compraban 0,20; con 5 SOL serian 1,24 y se compraban 0,20.
  #
  # Es la misma familia que el `hard_cap` recortando la comision o los dos
  # cupos de compras: un numero puesto y otro que lo anula sin decirlo.
  #
  # 0 = sin tope (el codigo hace `if _tope > 0 and _importe > _tope`).
  # Quien frena ahora es el propio 25%, que mengua con cada compra porque
  # la base es el saldo LIBRE.
  # TOPE ACEPTADO A SABIENDAS (31-oct). Lo puso Codex y Manu decidio
  # quedarse con su configuracion entera. Queda escrito lo que hace:
  #
  #     tope_compra_sol 0,20  ·  fraccion_saldo 0,20
  #     -> a partir de 1,00 SOL de saldo libre el porcentaje DEJA DE MANDAR
  #        y cada compra se queda plana en 0,20 SOL
  #
  # ES EL MISMO FALLO DEL 15-oct, que costo pedirlo dos veces para verlo: se
  # pidio el 25% del saldo y este tope seguia en 0,20, asi que por encima de
  # 0,81 SOL se compraban 0,20 fijos. No fallaba nada ni lo decia el log.
  # Hoy no es un descuido: es una decision, y por eso se acepta.
  tope_compra_sol: 0.20
  nombre_estrategia: "unica123-real"
  escala_por_sol_ganado: 0
  # 0 EL 13-oct, pedido: "maximo de compras simultaneas son dos pero no que
  # solo dos". ERA EL SEGUNDO CUPO ESCONDIDO, y el mas traicionero de los
  # dos: cuenta las compras reales DESDE QUE ARRANCA EL PROCESO y, con
  # `reiniciar_tanda` sin poner (= False), es un tope DE POR VIDA. Dos
  # compras y el bot no vuelve a comprar hasta que se reinicie.
  #
  # LOS TRES MANDOS QUE SE CONFUNDIAN POR EL NOMBRE:
  #   curva_96.max_compras -> cupo total de la fuente        (ya a 0)
  #   trade.max_real_buys  -> cupo total del proceso         (este)
  #   trade.max_posiciones -> cuantas A LA VEZ               (sigue en 2)
  #
  # Queda UN solo mando para lo pedido: `max_posiciones: 2`.
  max_real_buys: 0
  buy_amount_dev_top: 0.20
  dev_top_min_rate: 0.20
  mayhem_buy_amount: 0.10

  # 4 EL 15-oct, pedido: "pon maximo de operaciones abiertas simultaneas 4".
  # Estuvo sin tope (0 = 40) unas horas esa misma tarde.
  #
  # POR QUE VUELVE UN TOPE, y de donde sale el 4. El take profit tardaba en
  # ejecutarse y una de las dos causas era el NODO: cada posicion abierta
  # consulta su precio cada `price_check_interval` (1 s) y el nodo da para
  #     max_rps (20) x intervalo (1) / 2 = 10 posiciones
  # Por encima de ahi las consultas se encolan y lo que se retrasa es ver
  # que toco el objetivo. Con 40 plazas cada posicion se miraba cada 4 s.
  # Con 4 se mira cada 1 s, que es el minimo que permite el intervalo.
  #
  # LA OTRA CAUSA SIGUE EN PIE Y NO SE TOCA: la venta del take profit paga
  # la comision normal (0,00102 SOL) y no la reforzada (0,00509) que desde
  # hoy lleva el stop. Se ofrecio subirla y no se pidio.
  # 3 EL 15-oct, pedido: "maximo 3 operaciones simultaneas". Fue 4 unas
  # horas antes. Sigue por debajo de las 10 que el nodo puede vigilar
  # (max_rps 20 x intervalo 1 s / 2), asi que cada posicion se mira cada
  # segundo y el take profit no se retrasa por ahi.
  # 2 EL 16-oct, pedido: "maximo dos posiciones simultaneas". Venia de 3.
  #
  # VUELVE A 3 EL 18-oct, elegido por Manu ("subir las plazas otra vez")
  # cuando el bot no compraba. ESTO DESHACE LA ORDEN DEL 16-oct de dos
  # plazas, y queda escrito aqui para que se sepa: si manana se quiere
  # volver a dos, es cambiar este numero.
  #
  # 3 y no mas porque es el valor que el ya habia pedido el 15-oct ("maximo
  # 3 simultaneamente"); el techo del nodo esta en 4 (max_rps 8 x
  # price_check_interval 1 / 2), asi que 3 deja margen.
  #
  # LO QUE ESTO NO ARREGLA. Si en el droplet quedan 3 o mas marcadores
  # `open_position*.json` de posiciones viejas, al arrancar ocupan las tres
  # plazas y el bot sigue sin comprar: subir el numero solo da hueco si hay
  # menos posiciones retomadas que plazas.
  #
  # Y OJO CON EL SALDO: la tercera compra es el 9,6% del saldo libre
  # (0,6 x 0,4 x 0,4), asi que con `compra_minima_sol: 0.075` hacen falta
  # unos 0,80 SOL libres para que la tercera plaza llegue a usarse.
  # 4 EL 23-oct, pedido: "maximo 4 abiertas en simultaneo". Venia de 3.
  #
  # OJO CON EL NODO: `max_rps 8 x price_check_interval 1 / 2` da 4 posiciones
  # vigilables. Con 4 plazas se va al limite exacto; una quinta y el take
  # profit empezaria a reaccionar tarde sin que nada avisara.
  max_posiciones: 4
  mayhem_max_perdidas: 0

  # Slippage alto en la compra: en una moneda que se esta moviendo, un margen
  # corto hace que la transaccion REVIENTE y pagues la comision sin moneda.
  buy_slippage: 0.12
  sell_slippage: 0.25
  # SUELO ANCHO SOLO PARA LAS VENTAS QUE PROTEGEN (15-oct, mismo pedido).
  # Estaba sin poner, asi que el stop salia con el 25% de siempre. El
  # codigo lo explica en `_slippage_para`: "el suelo estrecho hacia que un
  # stop loss NO SE EJECUTARA justo en la moneda que se estaba desplomando".
  # En un desplome el precio se mueve mas que eso entre que se decide y
  # aterriza, y entonces la venta se cae y te quedas dentro.
  # 0,5 es el que ya usaba la otra configuracion. Solo aplica al stop.
  sell_slippage_proteccion: 0.5

  exit_strategy: "tp_sl"
  # =================================================================
  #  ASEGURAR EL CAPITAL Y DEJAR CORRER (15-oct, pedido)
  # =================================================================
  #
  # PALABRAS DE MANU: "Optimiza el resultado poniendo un take profit en el
  # que asegures el capital inicial y dejes correr beneficios".
  #
  # AL TOCAR +30% SE VENDE EL 80%: eso devuelve TODO el capital puesto,
  # comisiones incluidas. A partir de ese instante la operacion NO PUEDE
  # acabar en perdida. El 20% que queda corre sin techo.
  #
  # LA CUENTA, con las comisiones de verdad de esta config (prioridad de
  # compra 0,00119 SOL, de venta 0,00102 SOL, y el 1% de pump.fun por lado).
  # Vendiendo el 80% a +30% se recupera lo puesto a partir de 0,1125 SOL de
  # compra; por eso `compra_minima_sol` esta en 0,113. Con el 60% plano y
  # 1,5 SOL de saldo las compras son 0,891 / 0,355 / 0,140, y las tres
  # aseguran:
  #
  #     compra    cuesta entrar   cobra el 80% a +30%   sobra
  #     0,891 SOL   0,90110           0,91636         +0,01526
  #     0,355 SOL   0,35974           0,36449         +0,00475
  #     0,140 SOL   0,14259           0,14313         +0,00054
  #
  # SE ELIGIO VENDER 80% Y NO 79% porque las comisiones son FIJAS y pesan
  # mas en la compra pequena: el 79% valia para la compra grande y se
  # quedaba 0,4% corto en la pequena.
  #
  # (Este bloque hablaba antes de "los tres peldanos de fracciones_saldo",
  # que era la escalera 33/40/50. Manu la cambio por el 60% plano el mismo
  # dia; la cuenta no cambia --es relativa al tamano de cada compra-- pero
  # el ejemplo si, y un ejemplo con numeros que ya no salen es un comentario
  # que miente.)
  #
  # POR QUE +30% Y NO MAS ARRIBA. Cuanto mas alto el peldano, mas corredor
  # queda (a +50% harian falta vender 68,5% y quedaria 31,5%), pero menos
  # probable es tocarlo. Se prioriza ASEGURAR, que es lo pedido: +30% cae a
  # 44.620 $ de market cap, o sea al 38% del recorrido que queda hasta
  # migrar desde el 88%. Hay sitio de sobra.
  #
  # LOS TRES RESULTADOS POSIBLES:
  #     el corredor llega a migrar .... +39,9%
  #     el corredor se va a CERO ...... +4,0%   (capital intacto)
  #     nunca llega al +30% .......... -25%     (el stop)
  #
  # QUITADO EL TP2 (+70% vendiendo el 100%), y hay dos razones:
  #
  # 1. ERA INALCANZABLE. Al 91% de curva quedaban +57,5% hasta migrar, y el
  #    TP2 pedia +70%. NO SE PODIA TOCAR dentro de la curva. Es exactamente
  #    la trampa que `tests/test_la_curva_llega_al_primer_tp.py` documenta
  #    del 23-sep, y en la que esta config habia vuelto a caer. Con el TP2
  #    mudo, las unicas salidas reales eran el trinquete, el stop o el tope
  #    de tiempo.
  # 2. VENDIA EL 100%, o sea que mataba al corredor. Es incompatible con
  #    "dejar correr beneficios".
  #
  # DATO MEDIDO QUE DICE LO CONTRARIO, Y POR QUE NO APLICA. Mas abajo en
  # este mismo fichero hay una medicion del 20-ago: "vender el 100% da
  # +0,228, el 80% da +0,161", o sea que EL MOONBAG RESTABA. Se midio
  # ENTRANDO EN 2.800 $ (recien nacida; nacen en 2.097 $), no al 88% de
  # curva. Una moneda que ya recorrio el 88% es una superviviente, no una
  # recien nacida: son poblaciones distintas y el numero no se puede
  # trasladar. Dicho de otro modo: esa medicion no descarta esto, pero
  # TAMPOCO HAY NADA QUE LO RESPALDE con entrada tardia. Es terreno sin
  # medir y Manu lo sabe.
  # TP DEL 16-oct, pedido: "tp 40% recuperar, luego dejar correr hasta x4".
  # Antes era +30% vendiendo el 80%.
  #
  # +40% VENDIENDO EL 75%, EL 23-oct, pedido: "to 40% recoged iniciales".
  #
  # EL 75% NO ES UN NUMERO LIBRE: es lo que hace falta para que el TP1 SOLO
  # devuelva el capital. 0,75 x 1,40 x 0,99 = 1,0395 contra 1,01 que cuesta
  # entrar. Vender menos y seguir llamandolo "recoge iniciales" seria mentira.
  #
  # ============================================================
  # AVISO: ENTRANDO AL 93%, TODO DEPENDE DE QUE MIGRE
  # ============================================================
  # Al 93% de curva solo quedan +43,6% hasta la migracion. Las cuentas:
  #
  #     TP1 +40%   exige llegar al 99,55% de curva (42.060 $)
  #                la migracion esta en 43.142 $, o sea a 0,45 puntos
  #     TP2 x2,35  SOLO despues de migrar
  #     TP3 x3,36  SOLO despues de migrar
  #
  # O sea que el primer peldano se come el 92% del recorrido que queda, y
  # practicamente coincide con la migracion. Dentro de la curva, las salidas
  # reales son el stop (-32%) y el reloj.
  #
  # NO ES UN FALLO: es la consecuencia aritmetica de entrar tan arriba, y el
  # bot sabe vender despues de migrar. Pero el 100% de la ganancia depende
  # de que la moneda LLEGUE a migrar.
  #
  # LO QUE SE COBRA SI TODO VA BIEN, con los tamanos que da el 25%:
  #
  #     compra     cuesta      TP1      resto     total      sobra
  #     0,19700   0,20016   0,10430   0,11600   0,22030   +0,02014
  #     0,15760   0,16036   0,08324   0,09260   0,17583   +0,01547
  #     0,12608   0,12853   0,06638   0,07387   0,14026   +0,01173
  #     0,10086   0,10306   0,05290   0,05889   0,11180   +0,00874
  #     0,04000   0,04159   0,02037   0,02274   0,04311   +0,00152
  #
  # TABLA RECALCULADA EL 31-oct CON LOS NUMEROS DE CODEX. La columna "resto"
  # ya no es el remanente saliendo por un suelo subido --`margen_stop_tras_tp`
  # esta en 0-- sino saliendo A LA ENTRADA. Por eso el sobrante cae tanto:
  # antes eran +0,056 en la compra grande y ahora son +0,020.
  take_profit_percentage: 0.35
  take_profit_sell_percentage: 0.40
  # x4 = +300%. VENDE LO QUE QUEDE (el `sell` es sobre la posicion original y
  # el codigo hace `min(original * sell, restante)`, asi que 1.0 se lleva el
  # remanente y cierra).
  #
  # EL x4 NO CABE EN LA CURVA, y hay que saberlo: entrando al 91% quedan
  # +57,5% hasta migrar. El +40% si cabe (es el 70% de ese recorrido), pero
  # el x4 exige que la moneda MIGRE y siga subiendo ya en PumpSwap. O sea que
  # el tp2 es un billete de loteria pagado con dinero que ya no es tuyo --
  # que es exactamente lo que se pidio.
  #
  # OJO CON EL RELOJ: `max_hold_time` esta en 3600 (1 hora) y, al no quedar
  # moonbag despues del tp2, al cumplirse vende lo que haya. Asi que el x4
  # tiene UNA HORA para ocurrir. Si se quiere dar mas margen, el numero a
  # subir es `max_hold_time`. No se toca sin pedirlo.
  # TP2 AL +110%, EL 18-oct, pedido: "luego el restante un 40% relativo a la
  # subida anterior". Venia de 3.0 (x4).
  #
  # LA CUENTA: "relativo a la subida anterior" significa encadenar, no sumar.
  #     TP1 = entrada x 1,50
  #     TP2 = TP1 x 1,40 = entrada x 1,50 x 1,40 = entrada x 2,10 = +110%
  # Si fuera +40% desde la entrada seria 1,40, mas BAJO que el TP1, y
  # `build_tiers` lo pondria antes: el peldano se dispararia a la vez que el
  # primero. Por eso va encadenado.
  #
  # Y AHORA SI SE PUEDE COBRAR. Con la banda 2-5k los dos peldanos caen
  # dentro de la curva con mucho margen (la migracion esta en ~43.100 $):
  #     entrando en 2.936 -> TP1 4.404  TP2  6.166
  #     entrando en 5.000 -> TP1 7.500  TP2 10.500
  # Antes, con la entrada en 15-22k, el x4 pedia 60.000-88.000 y EXIGIA que
  # la moneda migrase. Eso ya no hace falta.
  # ESCALERA DEL 29-oct, pedido: "luego vas soltando el profit que sobra
  # cada 35% respecto de la subida anterior" (opcion A, elegida por Manu).
  #
  # CADA PELDANO ES EL ANTERIOR x 1,35, encadenado desde el TP1:
  #
  #     TP1  x1,40  (+40%)      vende 75,0%  -> queda 25,0%  recupera capital
  #     TP2  x1,89  (+89%)      vende  4,6%  -> queda 20,4%
  #     TP3  x2,55  (+155,2%)   vende  4,6%  -> queda 15,8%
  #     TP4  x3,44  (+244,5%)   vende  4,6%  -> queda 11,2%
  #     TP5  x4,65  (+365,0%)   vende  4,6%  -> queda  6,6%
  #     TP6  x6,28  (+527,8%)   vende  4,6%  -> queda  2,0%
  #     ---- el 2% NO SE VENDE NUNCA: el hold pedido el 23-oct ----
  #
  # EL 4,6% SALE DE LA RESTA: tras el TP1 quedaba el 25%, se reservan 2
  # puntos para el hold y los 23 restantes se reparten entre los cinco
  # peldanos de la cadena.
  #
  # ESTO DESHACE DOS COSAS PEDIDAS EL 23-oct, y queda escrito:
  #   1. los peldanos x2,35 y x3,36. No encajaban en una cadena del 35%:
  #      de x1,40 a x2,35 hay un x1,68 y de x2,35 a x3,36 un x1,43.
  #   2. el peldano del 4% a 400k de market cap (x13,31). El bot admite
  #      SIETE peldanos como mucho (TP1 mas tp2..tp6) y la cadena los ocupa
  #      todos. Si se quiere recuperar, hay que quitar uno de la cadena.
  #
  # SIETE ES EL TOPE DEL CODIGO, no una decision: `bot_runner.py` lee de
  # `tp2_gain` a `tp6_gain` y nada mas. Un `tp7_gain` en este fichero se
  # quedaria escrito y mudo.
  tp2_gain: 0.73
  tp2_sell: 0.50
  #
  # Medido sobre la muestra del 20-ago (40 monedas del grupo filtrado, y
  # comprobado tambien en grupos de 156 y 283 con filtros mas flojos):
  #
  #     vende todo a x1,50 ... +0,145 por cada 1 SOL
  #     vende todo a x1,75 ... +0,228     <- el mejor en las tres muestras
  #     vende todo a x2,00 ... +0,177
  #     la escalera anterior . +0,159
  #
  # NO ES UN PICO DE SUERTE. Los vecinos (1,70 / 1,80 / 1,85) dan entre +0,196
  # y +0,228: es una meseta. Remuestreando 1.000 veces sale positivo el 100%
  # de las veces, con el 90% de los casos entre +0,102 y +0,333.
  #
  # Se descartaron x3 y x4, que en la media salian mejor (+0,216 y +0,236) pero
  # PIERDEN dinero en la primera mitad de la muestra: todo su resultado venia
  # de una sola moneda que hizo x14,4.
  #
  # Y EL MOONBAG RESTABA: vender el 100% da +0,228, el 80% da +0,161 y el 50%
  # da +0,059. Lo que queda dentro casi nunca sigue subiendo -- vuelve al
  # precio de compra y sale por el suelo del trinquete.
  mc_take_profit_tiers:
    - {target_mc: 200000, sell: 0.07}
    - {target_mc: 600000, sell: 0.015}
    - {target_mc: 900000, sell: 0.015}

  # Stop defensivo para que la prueba no herede el antiguo suelo del 80%.
  # 30% EL 15-oct, pedido: "pon stop loss 30%". Baja desde el 32%.
  # 25% EL 15-oct, pedido: "pon stop loss solo 25%". Baja desde el 30% de
  # esta misma tarde. Tercer valor hoy: 32 -> 30 -> 25.
  # STOP AL 60% EL 18-oct, pedido: "stop loss 60%". Venia del 25%.
  #
  # OJO, Y ESTO NO SE TOCA SIN QUE MANU LO DIGA: con la banda de entrada en
  # 2-5k este stop NO PUEDE SALTAR NUNCA. La curva no baja del nacimiento
  # (2.936 $ con SOL a 105): si todo el mundo vende, el precio vuelve ahi y
  # no mas abajo. Asi que la caida maxima posible es:
  #     entrando en 5.000 $ -> como mucho -41,3%
  #     entrando en 4.000 $ -> como mucho -26,6%
  #     entrando en 2.936 $ -> como mucho   -0,0%
  # Ninguna llega al -60%. Lo unico que protege de un volcado en esta banda
  # es el anti-rug (ratio 1,6 en 4 s con 3 SOL minimos), que SI salta.
  # 32% EL 23-oct, pedido: "sl 32%". Venia del 60%.
  #
  # Y AHORA SI PUEDE SALTAR, al reves que el 60% con la banda 2-5k: desde el
  # 93% de curva la moneda puede caer mucho mas del 32% antes de tocar el
  # suelo de la curva, asi que este stop es real.
  stop_loss_percentage: 0.30
  # EXPLICITO EL 15-oct, y no es cosmetica. El codigo hace
  # `float(trailing_stop_percentage or stop_loss_percentage or 0)`, asi que
  # el 0 NO apagaba el trailing: caia al stop_loss y ya valia 0,25. Funcionaba
  # por un respaldo, no porque nadie lo hubiera decidido. Ahora que el
  # corredor del 20% depende de el, se escribe el numero: si manana alguien
  # cambia el stop, el trailing no se mueve detras sin avisar.
  #
  # QUE HACE: mide desde el PICO visto, no desde la entrada, y solo se arma
  # cuando el pico pasa de entrada x1,2. Es lo que protege al corredor.
  trailing_stop_percentage: 0.25

  # EL TRINQUETE SIGUE PUESTO, pero baja de +12% a +5% (15-oct).
  #
  # NO SE QUITA, porque fue una orden de Manu ("si toca tp1 vamos a subir
  # stop loss a precio de compra +12% asegurando asi ganancias"). Su
  # INTENCION --asegurar-- ahora la cumple el propio peldano, que devuelve
  # el capital en efectivo; el trinquete pasa a proteger solo al corredor.
  #
  # POR QUE +5% Y NO +12%. Simulado sobre cinco recorridos con las funciones
  # de verdad (`build_tiers`, `tiers_due`, `stepped_stop_price`):
  #
  #   margen    corre tras respirar -20%   se derrumba tras el TP
  #   +0%              +41,1%                     +20,3%
  #   +5%              +41,1%                     +25,5%   <- el mejor
  #   +8%              +41,1%                     +25,5%
  #   +12% (antes)     +26,6%                     +25,5%
  #
  # El +12% cortaba al corredor en cuanto la moneda respiraba por debajo de
  # ese nivel, y eso costaba 14,5 puntos. La proteccion extra solo ganaba 4.
  # La asimetria decide: 14,5 contra 4.
  #
  # SENSIBILIDAD (hasta donde puede respirar sin que la corten):
  #   con +12% la moneda no puede bajar de +12% ni un instante
  #   con +5%  aguanta hasta +5%
  # Por debajo de +5% la saca el trailing del 25% desde el pico, que para
  # entonces ya esta armado.
  stop_a_entrada_tras_tp: true
  # MARGEN DEL 15% EL 18-oct, pedido: "si salta tp 1 el sl se mueve de precio
  # al de compra 15%" y "(Tp 1) ahi seria el nuevo sl etc". Venia del 5%.
  #
  # LAS DOS FRASES SON EL MISMO MANDO, no dos cosas distintas: este margen
  # hace que tras cada peldano el suelo suba AL ESCALON ANTERIOR + el margen.
  #     tras el TP1 -> suelo en la entrada + 15%
  #     tras el TP2 -> suelo en el nivel del TP1 + 15%
  # El "etc" ya esta cubierto por el mecanismo; no hace falta encender
  # `stop_al_tp_tras_tp` y se deja como estaba.
  #
  # ESTE 15% ES LO QUE CUMPLE LA ORDEN DEL 16-oct de asegurar el capital.
  # El TP1 por si solo NO lo recupera: vender el 50% a +50% embolsa 0,75 del
  # capital, no 1,00. Es el stop subido el que lo cierra:
  #     0,750 embolsado + 0,575 del resto al stop = 1,325  ->  +32,5%
  #     garantizado en cuanto toca el TP1.
  #
  # EL COSTE FRENTE A LA CONFIGURACION ANTERIOR, dicho claro: el TP del 40%
  # vendiendo el 75% embolsaba 1,05 EN EFECTIVO al instante. Esta embolsa
  # 0,75 y deja 0,575 dependiendo de que el stop llegue a ejecutarse. Garantiza
  # mas (+32,5% contra +5%) pero tiene mas colgando de una venta futura.
  # 10% EL 23-oct, pedido: "si salto el tp1 el nuevo sl se mueve a precio
  # inicial +10%". Venia del 15%.
  #
  # Este mando sube el suelo AL ESCALON ANTERIOR + el margen, asi que tras el
  # TP1 el suelo queda en la entrada +10%, que es lo pedido.
  margen_stop_tras_tp: 0
  stop_al_tp_tras_tp: false
  stop_al_tp_anterior: false

  # APAGADO EL 15-oct, pedido: "no si venden de repente". Estaba en 2,0,
  # o sea: si en 4 segundos se vendian 3+ SOL y las ventas doblaban a las
  # compras, salia corriendo sin esperar al precio.
  #
  # LO QUE SE PIERDE, y conviene tenerlo escrito. Lo explica el propio
  # trader donde vive este freno: "el stop-loss reacciona al PRECIO, que
  # es la consecuencia; para cuando el precio ha caido un 35% el volcado
  # ya ha pasado y solo queda lo que nadie quiso. Esto mira la CAUSA
  # --quien esta vendiendo ahora mismo-- y sale antes de que el precio
  # termine de desplomarse."
  #
  # O sea que en un rug ya no hay salida temprana: se espera al -25% de un
  # precio que para entonces esta en caida libre, y lo que se cobre puede
  # ser bastante peor que ese -25%. Es el escenario de FUCKETHAN (-91,9%),
  # que fue justo con los frenos anti-rug apagados.
  #
  # Se deshace poniendo 2.0 otra vez. `anti_rug_seg` y `anti_rug_min_sol`
  # se quedan escritos y sin efecto mientras esto sea 0.
  #
  # ENCENDIDO A 1.6 EL 15-oct, pedido. Estuvo en 0 (apagado) desde esta
  # misma tarde, cuando Manu pidio "no si venden de repente".
  #
  # POR QUE SE VUELVE A ENCENDER, y lo pidio el sabiendo lo que cuesta: la
  # entrada se ha ido del 91% al 77% de curva, o sea 14 puntos mas de curva
  # por recorrer con la moneda dentro. Ese tramo es justo donde un dev puede
  # tirarla, y este es el unico freno que mira eso. Apagarlo era defendible
  # entrando al 91% --quedaba poca curva-- y deja de serlo al 77%.
  #
  # 1.6 es el valor de `bot-paper-mayhem-dev40k.yaml`, la unica config del
  # repo calibrada para entrada temprana. QUE HACE: en una ventana de 4
  # segundos, si se venden mas de 3 SOL Y las ventas superan en 1,6x a las
  # compras, sale corriendo con la comision de venta protegida.
  #
  # LO QUE PUEDE COSTAR: sacarte de una moneda que solo estaba respirando.
  # Es exactamente el motivo por el que Manu lo apago. Si vuelve a molestar,
  # se sube a 2.5 (mas permisivo) antes de apagarlo del todo.
  # 1.6 OTRA VEZ EL 16-oct. NO LO PIDIO MANU en este mensaje: lo exige bajar
  # la entrada a 15k.
  #
  # Al 91% quedaban 9 puntos de curva con la moneda dentro; al 75,4% quedan
  # 25. Casi el triple de tiempo en el tramo donde un dev puede tirarla, y
  # este es el unico freno que mira eso. Manu ya eligio 1.6 el 15-oct para
  # exactamente esta situacion (cuando se bajo al 77%), asi que se aplica el
  # mismo criterio suyo, no uno mio.
  #
  # Apagarlo entrando tan abajo es el caso FUCKETHAN (-91,9%). Hay un test
  # que lo exige: `test_el_antirug_acompana_a_lo_temprano_que_se_entre` se
  # pone rojo si el umbral baja del 85% con esto en 0.
  #
  # QUE HACE: en 4 s, si se venden mas de 3 SOL Y las ventas superan en 1,6x
  # a las compras, sale corriendo. Si molesta sacando de monedas que solo
  # respiraban, se sube a 2.5 antes de apagarlo.
  anti_rug_ratio: 1.6
  anti_rug_seg: 4
  anti_rug_min_sol: 3

  # LAS DOS CONDICIONES DE SALIDA QUE PEDISTE, y son distintas:
  #
  # 1) PARADA POR DEBAJO DE LA COMPRA a los 2 minutos -> fuera. Mira el PRECIO,
  #    una sola vez, al cumplirse el plazo.
  venta_muerta_seg: 120
  # MAS DE UN MINUTO POR DEBAJO DE LA COMPRA -> FUERA ENTERA, moonbag
  # incluido. El suelo estructural son 2.097 $ y se entra en 2.800: una
  # moneda que al minuto sigue por debajo de lo pagado no ha encontrado
  # comprador, y lo unico que queda por delante es la caida al suelo. El
  # stop del 80% esta demasiado abajo para sacarla; esto si.
  venta_bajo_entrada_seg: 60
  venta_muerta_gain: 0.0
  # 2) SIN VOLUMEN 2 minutos seguidos -> fuera. Mira el VOLUMEN, de forma
  #    continua. Da igual que el precio siga alto: si nadie negocia, ese precio
  #    no lo va a pagar nadie. Es la leccion de las 63 monedas que quedaron
  #    atrapadas con "valor" en pantalla y cero SOL detras.
  #    (Opcion nueva, anadida al motor el 15-ago.)
  venta_sin_volumen_seg: 120

  max_hold_time: 3600
  price_check_interval: 1
  extreme_fast_mode: false
  # 0,015 SOL EL 15-oct, pedido: "minimo 0.015 sol de reservar". Venia de
  # 0,03. Es el colchon que NUNCA se gasta: paga las comisiones de
  # prioridad de las VENTAS. Bajarlo libera 0,015 SOL para comprar, y a
  # cambio deja menos margen para que una venta de emergencia pase.
  # Con la comision de venta protectora a 42.424.243 ulam y 120.000 CU,
  # una venta cuesta 42.424.243 * 120.000 / 1e15 = 0,0051 SOL, asi que
  # 0,015 da para unas tres ventas protegidas seguidas.
  # SUELO DE COMPRA, 0,113 SOL (15-oct). NO LO PIDIO MANU: hace falta para
  # que el 60% que SI pidio no rompa en silencio lo que pidio antes
  # ("asegures el capital inicial").
  #
  # EL PROBLEMA. El TP vende el 80% a +30% y eso devuelve el capital, pero
  # las comisiones de prioridad son FIJAS (0,00119 al comprar, 0,00102 al
  # vender) mas el 1% de pump.fun por lado. Por debajo de cierto tamano la
  # venta ya no cubre la compra. Con el 60% plano, la tercera compra sale
  # tan pequena que cae ahi:
  #
  #     saldo    3a compra   asegura el capital?
  #     1,0 SOL    0,0920    NO, falta 0,00040
  #     0,5 SOL    0,0440    NO, falta 0,00134
  #     0,3 SOL    0,0248    NO, falta 0,00172   (y la 2a tambien)
  #
  # EL SUELO EXACTO son 0,1125 SOL, resuelto de
  # `0,80 x c x 1,30 x 0,99 - 0,00102 >= c x 1,01 + 0,00119`. Se redondea
  # al alza a 0,113.
  #
  # QUE HACE EL CODIGO POR DEBAJO (universal_trader.py:5121): no compra mas
  # pequeno, SALTA la moneda y lo escribe en el log ("saldrian X SOL y el
  # minimo que compensa es Y"). Es preferible no abrir una posicion que
  # abrirla condenada a no poder asegurar el capital.
  #
  # CONSECUENCIA PRACTICA: con el 60%, las TRES posiciones solo caben desde
  # 1,218 SOL de saldo. Por debajo abre 2 y salta la tercera diciendolo.
  #     0,3 SOL -> 1 posicion
  #     0,5 a 1,2 SOL -> 2 posiciones
  #     1,5 SOL o mas -> 3 posiciones
  # `max_posiciones: 3` es un MAXIMO, no una cuota, asi que esto no lo
  # incumple. Pero si se quieren 3 de verdad, hace falta saldo.
  # 0,075 EL 16-oct. Baja desde 0,113 porque EL SUELO DEPENDE DEL TP y el TP
  # cambio: con +30% vendiendo 80% hacian falta 0,1125 SOL para recuperar el
  # capital; con +40% vendiendo 75% bastan 0,0747. Se redondea al alza.
  #
  # No es aflojar un freno: es recalcularlo. Si se dejara en 0,113 estaria
  # saltando compras de entre 0,075 y 0,113 SOL que SI recuperan el capital,
  # o sea perdiendo posiciones validas por un numero de otra configuracion.
  #
  # Sale de resolver `0,75 x c x 1,40 x 0,99 - 0,00102 >= c x 1,01 + 0,00119`.
  #
  # BAJADO A 0.04 EL 19-oct, pedido: "elimina el minimo de compra pon 0.04
  # sol". Venia de 0,075.
  #
  # EL 0,075 LO PUSO UN TP QUE YA NO EXISTE. Aquella cuenta era del TP de
  # +40% vendiendo el 75%, que devolvia el capital el solo. Con el TP de hoy
  # (+50% vendiendo la mitad) el capital lo devuelven DOS ventas: el TP1 mas
  # el resto saliendo por el suelo subido a la compra +15%. Esa cuenta es:
  #
  #     c x 1,3117 - 2 x 0,00102  >=  c x 1,01 + 0,00119
  #     -> el minimo real son 0,01068 SOL
  #
  # Asi que 0,04 sigue devolviendo el capital con holgura:
  #
  #     compra 0,040  cuesta 0,04159  cobra 0,05043  sobra +0,00885
  #
  # Y NO SE BAJA MAS: con 0,010 la cuenta ya sale NEGATIVA (-0,00020),
  # porque las comisiones de prioridad son fijas y se comen la operacion
  # pequena. Por debajo de ~0,011 el bot estaria comprando para perder.
  #
  # LO QUE ESTO DESBLOQUEA: la primera compra es el 25% del saldo libre, asi
  # que con el suelo en 0,075 hacian falta 0,30 SOL libres para que el bot
  # comprara algo. Con 0,04 bastan 0,16.
  compra_minima_sol: 0.04

  min_reserve_sol: 0.015

  # UN SOLO RUG Y FUERA. Por defecto son 2; con 1, al creador que te la
  # juega una vez no se le vuelve a comprar nunca (queda anotado en
  # blocked_devs_bot-sniper-definitiva.json).
  rugs_para_bloquear: 1

# OBLIGATORIO: Token-2022 no cabe en las 59.700 unidades por defecto y la VENTA
# falla con "Program failed to complete", dejando la posicion atrapada.
compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  # UN 5% POR ENCIMA DE LO QUE PAGAN ELLOS. En la captura de Manu la tarifa de
  # prioridad es 0,085 $; un 5% mas son 0,08925 $, que a 75,18 $/SOL son
  # 0,0011871 SOL. Con 140.000 unidades de computo eso sale a 8.480.000
  # microlamports por unidad.
  #
  # OJO: esto es la parte de PRIORIDAD, la que se puja. La comision base de red
  # (los 0,075 $ de la captura) no se elige, la pone la red.
  #
  # Si SOL cambia mucho de precio, este numero deja de valer 0,089 $ y hay que
  # rehacerlo.
  fixed_amount: 8_480_000
  # COMISION RAPIDA SOLO PARA LAS VENTAS QUE PROTEGEN (15-oct, pedido:
  # "asegurate q el take profit y stop loss saltan de inmediato").
  #
  # ESTABA A 0, o sea apagada: el stop loss pagaba lo mismo que cualquier
  # venta --0,00102 SOL-- y el stop salta justo cuando todo el mundo esta
  # vendiendo y pagando por salir. Con la comision baja, tu venta se queda
  # en la cola mientras el precio sigue cayendo.
  #
  # El valor es el que ya usaba la otra configuracion: 42.424.243 x 120.000
  # CU = 0,00509 SOL por venta protectora (~0,76 $), contra los 0,00102
  # (~0,15 $) de antes. Cinco veces mas, pero SOLO cuando salta un stop.
  #
  # NO SE SUBE LA DE TODAS LAS VENTAS a proposito: una posicion se compra
  # una vez y se vende varias, asi que se pagaria en cada peldano. Y un
  # take profit SI puede esperar una vuelta; un stop no.
  fixed_amount_venta_proteccion: 42_424_243
  extra_percentage: 0.0
  # SUBIDO EL 15-oct CON LA LINEA DE ARRIBA, y no es un cambio aparte: el
  # trader recorta la comision protectora a este tope
  # (`universal_trader.py:775`, "se recorta"). Con el tope pegado a
  # `fixed_amount`, la comision de 42.424.243 se habria quedado ESCRITA Y
  # MUDA -- el fallo de familia de este repo. 75.000.000 es el que ya
  # llevaba la otra configuracion y deja holgura sin permitir una errata.
  hard_cap: 75_000_000

retries:
  # DOS INTENTOS, no tres. Cada intento que aterriza y falla paga su comision;
  # el tercero casi nunca salva la operacion y si suma coste.
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  max_token_age: 90

  # 30 SEGUNDOS DE VENTANA, no 3. Esto es lo que hace posible el filtro de
  # volumen: el bot ve la moneda al nacer y se queda VIGILANDOLA hasta 30 s,
  # comprando en el instante exacto en que el volumen cumple. Con la ventana en
  # 3 s no daria tiempo a que se negociara nada y el filtro no dispararia
  # nunca. No retrasa la compra: si cumple en el segundo 1, compra en el 1.
  # 30 SEGUNDOS, no 3. Con filtros de volumen y de operaciones el bot NO
  # espera a ciegas: se queda vigilando la moneda y compra en el instante
  # exacto en que cumple las dos condiciones. Con la ventana en 3 s no daria
  # tiempo a que se negociara nada y no compraria nunca.
  max_buy_age: 60

  match_string: null
  bro_address: null
  # BANEO AUTOMATICO ACTIVADO. En false, el bot mantiene su propia lista: al
  # creador que te rugea `rugs_para_bloquear` veces no se le vuelve a comprar
  # nunca (queda en blocked_devs_bot-sniper-definitiva.json). En true esa lista
  # se ignoraba, que es como estaba heredado.
  # TRUE EL 15-oct, pedido: "quita la lista de devs". Se salta las DOS
  # listas que bloqueaban a un creador (`universal_trader.py:3675`):
  #   - la BLACKLIST MANUAL, devs vetados a mano uno por uno
  #   - el AUTO-BANEO, devs que acumularon malos resultados
  #
  # LO QUE CUESTA: un dev que ya te hizo perder dinero vuelve a ser
  # comprable. Era la ultima puerta que miraba QUIEN hizo la moneda; a
  # partir de aqui solo se mira el 96% de curva.
  #
  # (El filtro de reputacion en vivo, que mira la tasa de migracion del
  # creador, sigue decidiendo por su cuenta: esto no lo toca.)
  ignorar_listas_de_devs: true

  # FILTRO DEL CREADOR: APAGADO, y a proposito.
  #
  # Era el unico de los filtros que no tenia una medida detras. Los otros tres
  # --carteras, volumen, market cap-- salen de cruzar 1.016 monedas con su
  # maximo real. Este venia de intuicion, y los datos dicen lo contrario:
  #
  #   el 85,2% de las monedas con arranque limpio las lanza alguien con CERO
  #   migraciones, asi que exigir historial deja fuera casi todo el flujo
  #
  #   y los creadores que REPITEN rinden peor: 13,3% llegan a x1,75 frente al
  #   16,4% de los que solo aparecen una vez
  #
  # El 20-ago a las 11:31 tumbo a TradeFi, que cumplia todo lo demas --6
  # carteras, 9,2 SOL, MC 2.605 $-- solo porque era la primera moneda de su
  # creador y por tanto no podia tener historial. Con ELITE al 25% llego a
  # tumbar el 98% de lo que le llegaba: 3 compras en toda su vida.
  #
  # Lo que protege aqui es la ESTRUCTURA (el techo de entrada a 2.800 $, con el
  # suelo estructural en 2.097), no la reputacion del que lanza.
  pumpfun_dev:
    enabled: false

  # VOLUMEN MINIMO 20 SOL (15-oct, pedido: "un poco mas de volumen").
  # Estaba en 0, o sea apagado.
  #
  # DE DONDE SALE EL 20, que no es a ojo. Estos son los SOL REALES que hay
  # dentro de la curva en cada punto (sale de k/vt - 30, la matematica de la
  # propia curva):
  #
  #     70% de curva ... 32,2 SOL dentro
  #     77% de curva ... 39,6 SOL dentro   <- aqui el bot empieza a mirar
  #     MC $18.000 ..... 44,3 SOL dentro   <- suelo de la banda
  #     MC $23.000 ..... 54,0 SOL dentro   <- techo de la banda
  #
  # Para llegar a donde el bot mira, una moneda ya ha movido ~40 SOL netos.
  # Un filtro por debajo de eso no filtra nada. Se pone 20, la mitad, a
  # proposito: es "un poco", no un muro.
  #
  # PERO OJO, Y ESTO ES LO QUE DE VERDAD HACE: el bot solo recuerda 300
  # SEGUNDOS por moneda (`_VIDA` en volumen.py, y `configurar_memoria` no se
  # llama en este camino). Asi que esto NO mide el volumen de toda la vida de
  # la moneda: mide el de los ultimos 5 minutos. En la practica es un filtro
  # de VELOCIDAD -- pasa la que subio rapido, no la que lleva media hora
  # arrastrandose. Que es seguramente lo que se quiere, pero conviene saber
  # que se esta pidiendo eso y no otra cosa.
  #
  # SI NO LLEGA, ESPERA. No descarta: hace `sleep` y sigue mirando dentro de
  # los 60s de `max_buy_age` (universal_trader.py:4242 y alrededores), igual
  # que la banda de market cap.
  #
  # EL RIESGO, dicho antes de que pase: este repo ya tiene el caso de un
  # filtro calibrado para una entrada y dejado puesto al cambiarla
  # (`min_compradores` en 30 con la entrada bajada al 71%), y el bot dejo de
  # comprar DURANTE DIAS sin que nadie supiera por que. Si tras poner esto
  # las compras se secan, el comando `porque` ensena el embudo y dice cuantas
  # se caen por volumen. Se apaga volviendo a 0.
  # BAJADO A 8 EL 15-oct. El 20 era un error de calculo mio y Manu reporto
  # "no compra" con el puesto.
  #
  # QUE CALCULE MAL. Razone sobre los ~40 SOL que hay DENTRO de la curva al
  # 77% y puse la mitad. Pero `min_volumen_sol` no mide los SOL de la curva:
  # mide el volumen que EL BOT RECUERDA, y solo guarda 300 SEGUNDOS por
  # moneda. Una moneda que tardo media hora en llegar al 80% tiene casi todo
  # ese volumen OLVIDADO, asi que ve mucho menos de 40 y se cae por un filtro
  # calibrado contra un numero que no es el que se compara.
  #
  # El 8 es coherente con lo que si mide: actividad de los ultimos 5 minutos.
  # Sigue tirando la moneda muerta --cruzar de 80% a la banda son ~0,9 SOL,
  # asi que 8 pide bastante mas que el minimo-- sin exigir una historia que
  # el bot no tiene.
  #
  # Si aun asi no compra, el siguiente numero a soltar es este (a 3, o a 0).
  #
  # ENCENDIDO A 8 EL 18-oct, pedido: "volumen decente comprador". Estaba en 0
  # desde la vuelta atras del 16-oct.
  #
  # POR QUE 8 Y NO 20. Mi primer impulso hoy fue 20, razonando que una moneda
  # en la banda tiene 38 SOL netos dentro de la curva. Pero eso ya se probo
  # el 15-oct y Manu reporto "no compra" con el 20 puesto: este filtro NO
  # mide el SOL de la curva, mide el que el bot RECUERDA, y solo guarda 300
  # segundos por moneda. Una moneda que tardo media hora en subir tiene casi
  # todo ese volumen olvidado. El 8 es el numero que ya se calibro contra lo
  # que de verdad mide, y se respeta.
  # RECALIBRADO A 2 EL 18-oct. Tampoco se pidio: el 8 se puso hace una hora
  # para la banda 15-22k, donde la moneda tiene 38-52 SOL DENTRO de la curva.
  # En la banda 2-5k tiene entre 0 y 9,2 SOL. Pedirle 8 SOL de volumen seria
  # pedirle casi toda su vida entera, y el bot no compraria -- la misma clase
  # de error que el 20 del 15-oct, solo que al reves.
  #
  # El 2 es el 22% de los 9,2 SOL que caben en la banda: pide actividad de
  # verdad sin exigir lo que no puede tener.
  # ENCENDIDO OTRA VEZ A 8 EL 19-oct, pedido: "simplemente que compre en ese
  # rango de precios con cierto volumen y presion compradora". Estuvo unas
  # horas en 0 ("solo market cap y presion").
  #
  # POR QUE 8, Y POR QUE NO MAS. Este mando NO mide el SOL que hay dentro de
  # la curva: mide el volumen que el bot RECUERDA, y `volumen.py` solo guarda
  # 300 segundos por moneda (`_VIDA = 300`). Ponerle 20 razonando sobre los
  # SOL de la curva ya seco las compras el 15-oct.
  #
  # Al 88% una moneda tiene 55,8 SOL dentro, asi que 8 SOL de movimiento en
  # los ultimos 5 minutos es el 14% de eso: pide actividad reciente de verdad
  # sin exigir una historia que el bot no guarda.
  #
  # SI SE SECAN LAS COMPRAS, ESTE ES EL PRIMERO QUE HAY QUE SOLTAR: a 3, y
  # luego a 0. Y se nota en `porque`, en el punto 3 del embudo.
  # APAGADO EL 23-oct, pedido: "UNICAMENTE requisitos de sol que cruce
  # el 93% de la bonding curve". El 93% es ahora el unico filtro.
  min_volumen_sol: 0

  # SIN FRANJA HORARIA: opera las 24 horas. El {inicio:18, fin:4} venia
  # heredado de cuando esta estrategia se llamaba NOCHE, y estaba descartando
  # todo fuera de esa banda sin que nadie lo hubiera pedido para esta version.
  horario: {}

  allow_mayhem: false
  # SOLO MAYHEM EL 18-oct, pedido: "pon solo modo mayhem". Venia de false.
  #
  # `require_mayhem` implica `allow_mayhem` en el codigo
  # (universal_trader.py:828), asi que no hay que encender las dos.
  #
  # EL DATO QUE NO DA, y hay que saberlo: el 50% de acierto sobre 30.000 $ de
  # `ANALISIS_MAYHEM_DEV40K.md` NO es de las monedas mayhem. Es de 20
  # creadores seleccionados con 3+ lanzamientos mayhem y mediana de pico
  # >=40.000 $, de 250 filas. Esto filtra "que sea mayhem", no ese 50%. Para
  # eso hace falta ademas la lista `top_devs_mayhem40k.json`, que esta en el
  # repo y NO se ha encendido porque no se pidio.
  #
  # DONDE SE DESCARTA, que importa para el nodo: el no-mayhem se rechaza en
  # platform_aware.py:258, en el momento de comprar, DESPUES del bucle de
  # espera. Una moneda normal que pase volumen y presion se queda 60 s
  # consultando la curva y se tira al final.
  # APAGADO EL 19-oct, pedido: "no mayhem". Estuvo encendido un dia.
  # DESHACE la orden de ayer ("pon solo modo mayhem"), y queda dicho aqui.
  require_mayhem: false
  marry_mode: false
  yolo_mode: false            # Un unico ciclo y termina.
  paper_trade: false          # REAL: requiere revision manual antes de arrancar.

  # Sin techo de market cap por peticion expresa.
  #
  # AVISO IMPORTANTE, y prefiero decirtelo antes de que veas el log vacio:
  # este techo y el filtro de volumen tiran el uno contra el otro. El volumen
  # EMPUJA el market cap -- son la misma magnitud en la curva de pump.fun --,
  # asi que una moneda que ya ha negociado 53 SOL dificilmente sigue por debajo
  # de 2.800 $. Es una combinacion muy estrecha: espera pocas compras, o
  # ninguna. Si a las pocas horas no ha disparado, el numero a soltar es este
  # (o el volumen), no el filtro del dev.
  # =================================================================
  #  LA BANDA DE ENTRADA, EN DOLARES (15-oct, pedido)
  # =================================================================
  #
  # PALABRAS DE MANU: "este bien esta pillando buenas subidas pero entra
  # entorno a los 27k a ver si consigues lo mismo pero entrando entorno
  # 18/22k".
  #
  # ESTOS DOS NUMEROS SON AHORA LOS QUE MANDAN sobre la entrada. El umbral de
  # curva (77%) solo decide cuando se EMPIEZA A MIRAR la moneda; quien dice
  # si se compra es esta banda.
  #
  # POR QUE EN DOLARES Y NO EN % DE CURVA. El objetivo de Manu esta en
  # dolares, y un % de curva es fijo mientras el precio de SOL se mueve. El
  # 82% daba 18-21k con SOL a 104-118 y daria 24-27k con SOL a 150: el mismo
  # ajuste, el mismo resultado distinto. Por eso este parametro se habia
  # movido ONCE veces. El codigo calcula
  # `_mc = precio * supply * _SOL_USD` con el precio de SOL EN VIVO
  # (universal_trader.py:4256), asi que la banda se mantiene sola.
  #
  # COMO SE COMPORTA (universal_trader.py:4276 y :4337):
  #   MC por debajo de 18.000 -> ESPERA (sleep + continue) a que suba
  #   MC entre 18.000 y 22.000 -> compra
  #   MC por encima de 22.000 -> descarta, y lo dice en el log
  #                              ("se paso de la banda")
  #   si pasan los 60s de `max_buy_age` sin entrar en banda -> descarta
  #                              ("no cumplio en 60s")
  #
  # LAS PUERTAS TRASERAS ESTAN CERRADAS, comprobado: `entrada_alternativa`
  # no esta en este fichero (asi que `entrada_alt_max_mc` es 0) y
  # `dev_mediana` tampoco. Sin ellas, el techo de 22.000 es duro de verdad.
  # Si alguien anade cualquiera de las dos, el techo deja de ser un techo.
  #
  # EFECTO SECUNDARIO QUE HAY QUE SABER. Poner `min_entry_mc` ABRE el bloque
  # del `max_buy_age`, que estaba cerrado: la puerta es
  # `max_buy_age > 0 and (min_volumen_sol>0 or min_entry_mc>0 or min_buys>0
  # or min_first_block_buys>0 or min_ops>0 or min_titulares>0 or
  # second_wave.enabled)`. Dos consecuencias:
  #   1. El bot ya no compra en el instante de cruzar el umbral: entra en un
  #      bucle de hasta 60s esperando que se cumpla la banda.
  #   2. El chequeo de PRESION COMPRADORA vive en ese mismo bloque. Sigue
  #      mudo porque `min_presion_ratio` esta en 0, pero a partir de ahora
  #      ponerlo SI tendria efecto. Antes no: era el fallo diagnosticado hoy.
  # TECHO A 23.000 EL 15-oct, pedido: "Sigue entrando en 28k quiero entre 18
  # y 23". Venia de 22.000, puesto hace un rato.
  # BANDA 15.000-22.000 $ EL 16-oct, pedido: "habiamos quedado en comprar
  # maximo en entre 15k-22k". Estaba apagada (0) desde la vuelta atras de
  # ayer.
  #
  # POR QUE VUELVE, con un caso concreto: Manu enseno una compra hecha en
  # 30.600 $ de market cap, muy por encima de lo acordado. UN % DE CURVA NO
  # PUEDE GARANTIZAR UN TECHO EN DOLARES, porque el MC de un mismo punto de
  # la curva sube y baja con el precio de SOL:
  #
  #     el 75,4% de curva son 142,7 SOL de market cap
  #     con SOL a $105 -> $14.980
  #     con SOL a $214 -> $30.531
  #
  # `max_entry_mc` SI lo garantiza: el codigo calcula
  # `_mc = precio * supply * _SOL_USD` con el precio de SOL EN VIVO
  # (universal_trader.py:4256), asi que 22.000 son 22.000 hoy y manana.
  # Esto solo es el freno que impide repetir la compra de 30.600.
  # BANDA 2.000-5.000 EL 18-oct, pedido: "entra entorno 2/5k mc". Venia de
  # 15.000-22.000.
  #
  # DONDE CAE ESO EN LA CURVA (con SOL a 105 $):
  #     2.000 $ -> curva -28,6%   NO EXISTE: por debajo del nacimiento
  #     2.936 $ -> curva    0%    aqui NACE una moneda de pump.fun
  #     5.000 $ -> curva  31,6%   (9,2 SOL dentro de la curva)
  #
  # El suelo de 2.000 NO FILTRA NADA porque ninguna moneda cotiza ahi. La
  # banda real es "del nacimiento a 5.000". Se deja el 2.000 porque es lo
  # pedido y no estorba.
  # BANDA 22.000-28.000 EL 19-oct. El 89% pedido son 25.075 $, y esta banda
  # lo rodea: del 86% al 92% de curva.
  #
  # POR QUE HAY BANDA Y NO SOLO EL % DE CURVA. Un % de curva NO garantiza un
  # techo en dolares, porque el MC del mismo punto se mueve con el precio de
  # SOL. Es lo que dejo entrar la compra de 30.600 $ del 16-oct. El techo en
  # dolares si lo garantiza: el codigo compara contra el precio de SOL EN
  # VIVO (universal_trader.py:4276 y 4513).
  # APAGADO EL 23-oct, pedido: "UNICAMENTE requisitos de sol que cruce
  # el 93% de la bonding curve". El 93% es ahora el unico filtro.
  min_entry_mc: 0
  # SUBIDO A 42.000 EL 19-oct, pedido: "afloja el punto 3 mucho", con el
  # embudo delante: 28 de los descartes eran "se paso de la banda".
  #
  # EL PORQUE, con la cuenta: la ventana de curva va del 88% al 99,5%, o sea
  # de 24.026 $ a 41.945 $. El techo en 28.000 $ es el 91,5% de curva, asi
  # que de esa ventana solo se compraba del 88% al 91,5% y TODO lo detectado
  # por encima se tiraba. 42.000 cubre la ventana entera.
  #
  # El techo en dolares sigue existiendo y sigue sirviendo para lo que se
  # puso: si SOL se dispara, un mismo punto de curva vale mas dolares y este
  # freno lo corta. Lo que ya no hace es recortar la propia estrategia.
  # APAGADO EL 23-oct, pedido: "UNICAMENTE requisitos de sol que cruce
  # el 93% de la bonding curve". El 93% es ahora el unico filtro.
  max_entry_mc: 0
  max_entry_mc_dev_top: 0
  min_curve_sol: 0
  # SIN TECHO DE VOLUMEN, y esto corrige una medida anterior.
  #
  # Se habia puesto un techo de 15 SOL porque sobre TODAS las monedas mas
  # volumen rendia peor (9,1% frente a 10,8%): mucho SOL de golpe suele ser
  # bundle. Pero esa medida no estaba condicionada.
  #
  # Cuando ya se exigen 6 carteras distintas Y market cap por debajo de 2.800,
  # el volumen alto deja de ser bundle: 20 SOL repartidos entre seis
  # compradores con el precio aun por debajo de 2.800 es demanda real que
  # todavia no ha movido el market cap.
  #
  #   con techo de 15 ... 40 casos, 45,0% aciertan, rinde +0,2280, 1,94 ops/h
  #   sin techo ......... 71 casos, 43,7% aciertan, rinde +0,2168, 3,20 ops/h
  #   el tramo que se tiraba (>15 SOL): 31 casos y el 41,9% llegaba al +75%
  #
  # Se pierden 1,3 puntos de acierto y se gana un 65% de operaciones: el SOL
  # por hora sube un 69%. Aguanta las dos mitades de la muestra (+0,186 y
  # +0,247) y sale positivo el 100% de 1.000 remuestreos.
  #
  # OJO: bajar a 5 carteras SI diluye de verdad (34,7% de aciertos, +0,1411).
  # El techo de volumen sobraba; el suelo de carteras no.
  max_volumen_sol: 0
  # ACELERACION, ENCENDIDA EL 18-oct: la otra mitad de "operaciones
  # frecuentes". Las 20 operaciones dicen que ha pasado mucho en 5 minutos;
  # esto dice que esta pasando AHORA, y tira la moneda que cruzo a la banda y
  # se quedo muerta.
  #
  # 1 SOL EN 10 SEGUNDOS, y el numero sale de la curva: cruzar del 80% hasta
  # la banda son ~0,9 SOL. Pedir 1 SOL en 10 s es pedir ese mismo ritmo de
  # subida, no mas. Deliberadamente suave: el que filtra de verdad es
  # `min_ops`.
  # RECALIBRADO A 0.3 EL 18-oct. El 1 SOL en 10 s salia de lo que cuesta
  # cruzar del 80% de curva a la banda vieja. En la banda nueva la moneda
  # entera son 9,2 SOL, asi que 1 SOL en 10 s era pedir el 11% de todo su
  # recorrido cada diez segundos.
  # APAGADO EL 19-oct, pedido: "pon solo filtro market cap y presion".
  # Se queda escrito el valor de ayer por si hay que volver.
  # Venia de 0.3 (18-oct).
  min_vol_ventana_sol: 0
  vol_ventana_seg: 10
  # Sin minimo de compras: la condicion de arranque es el volumen. Estuvo en 4
  # y era el mayor cuello del embudo -- de 38 monedas descartadas, solo 1 llego
  # a tener 3 compradores en 30 s.
  # 4 TRANSACCIONES PREVIAS antes de entrar. Cuenta operaciones de la moneda,
  # compras y ventas, no compradores distintos: es "que haya pasado algo ya".
  # 1 EL 16-oct, y NO ES UN FILTRO: es la LLAVE que hace que la presion
  # compradora funcione.
  #
  # EL CHEQUEO DE PRESION vive dentro del bloque del `max_buy_age`, y la
  # puerta de ese bloque es:
  #     if max_buy_age > 0 and (min_volumen_sol>0 or min_entry_mc>0 or
  #        min_buys>0 or min_first_block_buys>0 or min_ops>0 or
  #        min_titulares>0 or second_wave.enabled)
  # `min_presion_ratio` NO ESTA en esa lista, asi que no abre la puerta por
  # si solo. Con todos los demas a 0 --que es como quedo al volver atras--
  # poner la presion no haria absolutamente nada. Ya paso el 15-oct.
  #
  # POR QUE `min_ops: 1` Y NO OTRO. Es el abridor que menos filtra: exige UNA
  # transaccion. Al 75% de curva una moneda lleva decenas, asi que no descarta
  # nada; solo enciende el bloque. Cualquier otro abridor (volumen, titulares,
  # compras) SI filtraria, y lo pedido fue que no descarte demasiado.
  # 20 EL 18-oct, pedido: "que haya muchas operaciones frecuentes". Venia de
  # 1, que no filtraba nada: era solo la llave del bloque.
  #
  # POR QUE 20, y sale del numero de al lado para no inventarlo: `operaciones`
  # cuenta cada transaccion de los mismos 300 s que mide el volumen. Con
  # `min_volumen_sol: 8` y una compra media de 0,4 SOL, 8 SOL son unas 20
  # operaciones. Los dos mandos aprietan parecido en vez de pelearse.
  #
  # "FRECUENTES" lo pone la ventana: son 20 operaciones en los ultimos 5
  # minutos, no en toda la vida de la moneda.
  #
  # ES EL FILTRO QUE MAS PUEDE SECAR LAS COMPRAS de los tres nuevos, porque
  # una moneda que subio despacio llega a la banda con pocas operaciones
  # RECIENTES aunque tenga cientos en total. Es el primero que hay que soltar
  # si se seca (a 10, luego a 5).
  # RECALIBRADO A 10 EL 18-oct, por lo mismo y manteniendo la coherencia con
  # el mando de al lado: con 2 SOL y una compra media de 0,2 SOL (en una
  # moneda recien nacida las compras son mas pequenas que al 80% de curva)
  # salen unas 10 operaciones. "Muchas operaciones" sigue en pie: son 10 en
  # los ultimos 5 minutos de una moneda que acaba de nacer.
  # APAGADO EL 19-oct, pedido: "pon solo filtro market cap y presion".
  # Se queda escrito el valor de ayer por si hay que volver.
  # Venia de 10 (18-oct).
  #
  # Y NO DEJA MUDA LA PRESION, comprobado en universal_trader.py:4012: la
  # puerta del bloque es `max_buy_age > 0 and (min_volumen_sol>0 or
  # min_entry_mc>0 or ...)`. `min_entry_mc` esta en 2.000, asi que la
  # abre el solo y el chequeo de presion sigue corriendo.
  min_ops: 0
  # MAS COMPRA QUE VENTA. El ratio mide cuanto SOL entra frente al que sale en
  # los ultimos  segundos: 1.0 exige que entre mas del que sale.
  # El volumen solo dice que hay movimiento; esto dice hacia donde va, y evita
  # entrar justo cuando el dinero se esta yendo.
  # Las 3 ultimas operaciones tienen que ser COMPRAS: nadie ha vendido aun.
  # LAS DOS ULTIMAS SON COMPRAS, EL 18-oct, pedido: "ultimas dos operaciones
  # o tx son compras". Venia de 0 (apagado).
  #
  # NO ES LO MISMO QUE LA PRESION: el ratio mira cuanto SOL entra frente al
  # que sale en una ventana; esto mira el ORDEN de las ultimas operaciones.
  # Una moneda puede tener ratio 1,5 y haber recibido la ultima venta hace
  # medio segundo.
  #
  # ESTE ESPERA, NO DESCARTA (universal_trader.py:4159): si las dos ultimas no
  # son compras, vuelve a mirar dentro de 0,15 s hasta agotar `max_buy_age`.
  # Basta con que lleguen dos compras seguidas en esos 60 s.
  # APAGADO EL 19-oct, pedido: "pon solo filtro market cap y presion".
  # Se queda escrito el valor de ayer por si hay que volver.
  # Venia de 2, pedido AYER ("ultimas dos tx son compras"). ESTO
  # DESHACE AQUELLA ORDEN: no es presion, es un filtro aparte --el ratio
  # mira cuanto SOL entra frente al que sale, esto mira el ORDEN de las
  # ultimas operaciones.
  ultimas_tx_compra: 0
  # PRESION 1.2 (15-oct, pedido: "ligeramente mayor presion compradora").
  # Estaba en 0, apagado.
  #
  # QUE EXIGE: que en los ultimos 3 segundos entre un 20% mas de SOL del que
  # sale. Es deliberadamente suave -- el valor por defecto del codigo es 2.0
  # (el doble), y lo pedido fue "ligeramente".
  #
  # HASTA HOY ESTE NUMERO ERA MUDO, y es importante entenderlo: el chequeo
  # vive dentro del bloque del `max_buy_age`, cuya puerta pide que ADEMAS
  # este encendido alguno de `min_volumen_sol`, `min_entry_mc`, `min_buys`,
  # `min_first_block_buys`, `min_ops`, `min_titulares` o `second_wave`.
  # `min_presion_ratio` NO abre esa puerta por si solo. Como todos estaban a
  # cero, ponerlo no habria hecho absolutamente nada. Ahora la puerta esta
  # abierta (por `min_entry_mc: 18000` y por el volumen de arriba), asi que
  # este numero por fin cuenta.
  #
  # SIN DATOS NO ES CAIDA. Si en esos 3 segundos no hubo ninguna operacion,
  # el codigo lo trata como "pasa" (universal_trader.py, `_pc <= 0 and
  # _pv <= 0 -> _ok_presion = True`). Esta medido: el 10-ago las 6 monedas
  # que cruzaron el volumen pedido lo hicieron con la ventana vacia y se
  # descartaron las seis. Por eso este filtro no puede vetar todo por falta
  # de dato.
  #
  # LO QUE DICE LA MEDICION DEL PROPIO REPO, y va en contra de este filtro:
  # en `presion_source.py` hay 27.241 monedas medidas y la conclusion fue que
  # el RATIO de presion "no saco ventaja suficiente para aparecer en la
  # lista"; lo que si predijo pumps fue el NUMERO DE COMPRADORES DISTINTOS
  # (del 14,4% al 27,4% con 3 o mas). O sea: `min_titulares` o `min_buys`
  # tienen mas respaldo que esto. Se pone igual porque es lo pedido, y queda
  # dicho para que la alternativa este sobre la mesa.
  # PRESION 1.5 EL 16-oct, pedido: "presion compradora potente que facil se
  # dispare pero no descarte demasiado". Son dos cosas que tiran en contra, y
  # lo que las concilia NO es el numero sino el BUCLE.
  #
  # EXIGE que en los ultimos 3 segundos entre un 50% mas de SOL del que sale.
  # Eso es "potente": el defecto del codigo es 2.0, y el 15-oct se probo 1.2,
  # que era flojo.
  #
  # POR QUE NO DESCARTA, aunque 1.5 suene exigente: el bloque reintenta cada
  # `_paso` = 0,15 s durante `max_buy_age` = 60 s, o sea unas 400 VECES. La
  # presion solo tiene que cumplirse UNA VEZ en ese minuto. No pide que la
  # moneda este fuerte todo el rato, solo que lo este un instante.
  #
  # Y SIN DATOS NO ES CAIDA: si en esos 3 segundos no hubo ninguna operacion,
  # el codigo lo trata como "pasa" (`_pc <= 0 and _pv <= 0 -> _ok_presion =
  # True`). Medido el 10-ago: 6 monedas cruzaron el volumen con la ventana
  # vacia y se descartaron las seis; por eso se arreglo. Las ventanas quietas
  # no vetan.
  #
  # SI AUN ASI SE SECAN LAS COMPRAS, el orden para aflojar es: 1.5 -> 1.3 ->
  # 1.0 -> 0. Y `porque` dice cuantas se caen por aqui antes de tocar nada.
  # AFLOJADA A 1.1 EL 19-oct, pedido: "afloja el punto 3 mucho". Venia de
  # 1,5. Los 46 descartes de "no cumplio en Ns" son monedas que agotaron los
  # 60 s sin llegar a la presion pedida.
  #
  # 1,1 sigue exigiendo que entre MAS SOL del que sale (un 10% mas), que es
  # lo que separa "sube" de "se esta yendo la gente". Por debajo de 1,0 el
  # filtro deja de significar nada.
  # APAGADO EL 23-oct, pedido: "UNICAMENTE requisitos de sol que cruce
  # el 93% de la bonding curve". El 93% es ahora el unico filtro.
  min_presion_ratio: 0
  presion_seg: 3.0
  min_buys: 0
  min_titulares: 0
  redes_originales: false
  min_holders_gmgn: 0
  senal_gmgn: []

  # DOS MINUTOS, no 24 horas. El bloqueo de un dia estaba tumbando el 64% de
  # todo el flujo (461 de 721 monedas): con tickers comunes, un nombre bloquea
  # al siguiente durante un dia entero. Dos minutos es lo que pediste y hace lo
  # que hacia falta: cortar al que relanza la misma moneda seguida.
  no_repeat_name_min: 0
  max_holder_pct: 0.0
  max_dev_hold_pct: 0.0
  # Al menos cinco cuentas con tokens fuera de la curva.
  min_holders: 5
  holder_bypass_ratio: 0

  buy_on_dex_paid:
    enabled: false

  # CALLS DE TELEGRAM (31-oct): Wagbocooks y LegendsAlphas. Cada call usa
  # el 15% del SOL libre en ese instante; la curva conserva su 20%. El tope
  # duro global de 0,20 SOL y las cuatro plazas simultaneas siguen mandando.
  # `signal_buy_amount: 0` evita que un importe fijo pise el porcentaje.
  # La deduplicacion persistente y la reserva atomica por mint impiden que la
  # misma moneda se compre dos veces, incluso si ambos canales la publican a
  # la vez o si el proceso se reinicia.
  telegram_calls:
    enabled: true
    channels:
      - "Wagbocooks"
      - "LegendsAlphas"
    suffixes:
      - "pump"
    # Reutiliza la sesion Telethon ya autenticada en el droplet. Cambiar este
    # nombre crearia una sesion vacia y el servicio no podria pedir el codigo
    # interactivo de Telegram durante el arranque.
    session_name: "moontok_watcher"
    balance_fraction: 0.15
    normal_buy_amount: 0
    nitro_buy_amount: 0
    promoted_buy_amount: 0

  # UNICA FUENTE DE ENTRADA: una curva de pump.fun alcanza el 93%. Al existir
  # una fuente de adquisicion activa, el
  # listener normal de monedas nuevas no abre operaciones por su cuenta.
  curva_96:
    enabled: true
    # 96% EL 15-oct, pedido. Sube desde el 95%.
    #
    # ESTE FICHERO VUELVE A LA VERSION DEL 13-oct Y SOLO CAMBIA ESTO. Los
    # commits del 13 y 14 ("Remove C123 token age filter", "Buy C123 tokens
    # at 96 percent without entry filters") habian dejado la entrada al 96%
    # pero apagando TODOS los frenos: edad minima 0, anti-mecha 0, holders 0,
    # titulares 0, operaciones 0, volumen 0, presion 0, mayhem permitido y
    # tope al 100%. Pedido el 15-oct: el 96% SI, los frenos tambien, y
    # "sin mayhem".
    # 95% EL 15-oct, pedido: "que compre en 95% curva". Baja desde el 96%
    # de esta misma manana. Septimo movimiento de este numero:
    # 90 -> 84 -> 79 -> 71 -> 59 -> 95 -> 96 -> 95.
    #
    # LO QUE GANA: al 95% quedan +30,3% de recorrido hasta migrar, contra
    # +24,0% que quedaban al 96%. Mas margen antes de la migracion, que es
    # donde las transacciones no confirmaban.
    # 94% EL 15-oct, pedido: "pon q compre un 1% antes en la curvatura".
    # Octavo movimiento: 90 -> 84 -> 79 -> 71 -> 59 -> 95 -> 96 -> 95 -> 94.
    #
    # LO QUE GANA: al 94% quedan +36,9% de recorrido hasta migrar, contra
    # +30,3% al 95%. Mas margen antes de la migracion, que es donde las
    # transacciones dejaban de confirmar. Y mas candidatas, porque toda
    # moneda que llegue al 95% pasa antes por el 94%.
    # 91% EL 15-oct, pedido: "baja al 91% la bonding". Noveno movimiento:
    # 90 -> 84 -> 79 -> 71 -> 59 -> 95 -> 96 -> 95 -> 94 -> 91.
    #
    # Al 91% quedan +57,5% de recorrido hasta migrar, contra +36,9% al 94%.
    # 88% EL 15-oct, pedido: "mejor pero compra algo antes". Decimo
    # movimiento: 90 -> 84 -> 79 -> 71 -> 59 -> 95 -> 96 -> 95 -> 94 -> 91 -> 88.
    #
    # EL 88 NO ES UN NUMERO AL AZAR, sale de una cuenta. Para que un peldano
    # de +X% se pueda cobrar DENTRO de la curva hace falta entrar por debajo
    # de 61.635 $ / (1+X). Con los peldanos que ha tenido esta config:
    #
    #     peldano +50%  ->  entrar por debajo del 92,1% de curva
    #     peldano +70%  ->  entrar por debajo del 89,3% de curva
    #
    # Al 91% el TP2 de +70% era INALCANZABLE: la curva se acaba antes. Al 88%
    # el techo pasa de +57,5% a +79,6%, asi que cualquier peldano hasta el
    # +70% cabe con margen. Es el mismo contrato que vigila
    # `tests/test_la_curva_llega_al_primer_tp.py` desde el 23-sep.
    #
    # QUE SE PAGA POR ENTRAR ANTES: la moneda tiene 3 puntos mas de curva por
    # recorrer, o sea mas tiempo expuesta a que el dev la tire. Y OJO:
    # `anti_rug_ratio` esta en 0 (apagado a peticion del 15-oct, "no si
    # venden de repente"), asi que ese freno NO esta puesto. Queda dicho; no
    # se enciende sin que Manu lo pida.
    # 82% EL 15-oct, pedido: "este bien esta pillando buenas subidas pero
    # entra entorno a los 27k a ver si consigues lo mismo pero entrando
    # entorno 18/22k". Undecimo movimiento.
    #
    # EL 82 SALE DE SU PROPIA OBSERVACION, no de mi tabla. Manu ve entradas
    # en ~27.000 $, y eso CALIBRA el precio de SOL --que yo venia suponiendo
    # a 150 $ y no lo esta:
    #
    #     si el umbral vivo era 88% -> 228,8 SOL de MC -> SOL a ~$118
    #     si el umbral vivo era 91% -> 260,9 SOL de MC -> SOL a ~$104
    #
    # No se sabe cual de los dos tenia el droplet (depende de si habia hecho
    # pull), asi que se eligio un umbral que caiga en 18-22k CON LOS DOS:
    #
    #     umbral 82%  ->  $21.263 con SOL a $118
    #                 ->  $18.650 con SOL a $104
    #
    # El 80% y el 81% solo valian para uno de los dos casos; el 83% y el 84%
    # solo para el otro. El 82 es el unico que entra en los dos.
    #
    # OJO CON LOS DOLARES DE ESTE FICHERO. Todos los MC en $ escritos arriba
    # (34.323, 39.130, 61.635 de migracion) se calcularon con SOL a 150 $.
    # Con SOL entre 104 y 118 son un 27-44% mas bajos: la migracion esta en
    # 43.000-48.500 $, no en 61.635. LOS PORCENTAJES DE CURVA Y LAS
    # PROPORCIONES SIGUEN BIEN --no dependen del precio-- pero las cifras en
    # dolares hay que releerlas con el SOL del dia.
    #
    # Si se quiere fijar la entrada en DOLARES de verdad (que es lo que Manu
    # pide realmente), el mando es `filters.max_entry_mc`, que usa el precio
    # de SOL en vivo. No se toca aqui porque es otro cambio: ese filtro vive
    # detras de la puerta del `max_buy_age` y encenderlo mueve mas cosas.
    # Queda ofrecido.
    #
    # QUE SE PAGA: 18 puntos de curva por recorrer en vez de 12. Mas tiempo
    # expuesto a un rug, y `anti_rug_ratio` sigue en 0 (apagado a peticion).
    # Techo hasta migrar: +128%, asi que el TP de +30% cabe de sobra (se come
    # el 23% del recorrido disponible).
    # 77% EL 15-oct. Duodecimo movimiento, y EL ULTIMO QUE DEBERIA HACER
    # FALTA, porque a partir de ahora quien decide la entrada es la banda en
    # DOLARES (`min_entry_mc` / `max_entry_mc`, mas abajo), no este numero.
    #
    # POR QUE CAMBIA EL PAPEL DE ESTE NUMERO. Un porcentaje de curva es fijo
    # y el precio de SOL se mueve: el 82% daba 18-21k con SOL a 104-118, y
    # daria 24-27k con SOL a 150. Ese es el motivo de que este parametro se
    # haya movido ONCE veces -- no era indecision, era que persigue un
    # objetivo en dolares con una herramienta que no mide dolares.
    #
    # AHORA ESTE UMBRAL SOLO DECIDE CUANDO SE EMPIEZA A MIRAR LA MONEDA, y
    # tiene que disparar POR DEBAJO del suelo de 18k para que el bot pueda
    # esperar a que entre en la banda. Con los dos precios de SOL calibrados
    # desde la observacion de Manu ("entra entorno a los 27k"):
    #
    #     umbral   SOL a $118   SOL a $104   bajo el suelo con los dos
    #       76%      $17.177      $15.139    si
    #       77%      $17.772      $15.663    si  <-- elegido
    #       78%      $18.398      $16.215    NO (ya en banda con $118)
    #
    # Se elige el 77% porque es el MAS CERCANO al suelo que sigue estando
    # por debajo con ambos precios: asi la espera hasta entrar en la banda es
    # la mas corta posible (+1,3% con SOL a 118, +15% con SOL a 104) y cabe
    # de sobra en los 60s de `max_buy_age`.
    #
    # Techo de curva al 77%: +173%, asi que el TP de +30% se come solo el
    # 17% del recorrido disponible.
    # 80% EL 15-oct. Decimotercer movimiento, y CORRIGE UN ERROR MIO del 77%.
    #
    # EL FALLO. Puse el 77% para que disparase por debajo del suelo de la
    # banda con cualquiera de los dos precios de SOL que barajaba. Pero con
    # SOL a ~105 (ya bien calibrado) el suelo de 18.000 $ cae en el 80,7% de
    # curva, asi que la moneda tenia que subir de 77% a 80,7% DENTRO de los
    # 60s de `max_buy_age`, o se descartaba por tiempo:
    #
    #     umbral   MC        hueco hasta la banda
    #       77%    $15.814   3,7 puntos = 4,7 SOL de compras
    #       79%    $16.958   1,7 puntos = 2,2 SOL
    #       80%    $17.576   0,7 puntos = 0,9 SOL   <- elegido
    #
    # Con el 80% hace falta casi SEIS VECES menos movimiento para entrar en
    # banda. Sigue disparando por debajo del suelo --que es lo que hace que
    # mande la banda y no este numero-- pero pegado a el.
    #
    # Manu reporto "no compra" tras encender todo esto. Esta es una de las dos
    # causas que se corrigen; la otra es `min_volumen_sol`.
    # 75,4% EL 16-oct, pedido: "baja a que compre entorno 15k".
    #
    # EL NUMERO SALE DEL MC, no de un porcentaje redondo. Con SOL a ~105
    # (calibrado desde las entradas observadas) el market cap en cada punto:
    #
    #     75,0% de curva -> $14.782
    #     75,4% de curva -> $14.980   <- elegido
    #     76,0% de curva -> $15.285
    #     90,7% de curva -> $27.000   (donde compraba hasta ahora)
    #
    # OJO: ESTO ES UN % DE CURVA, no dolares. Si SOL se mueve, el MC de
    # entrada se mueve con el. A 15k eso importa menos que antes porque el
    # objetivo es "entorno a", no una banda cerrada.
    #
    # LO QUE SE PAGA, y no es menor: quedan 25 PUNTOS de curva con la moneda
    # dentro, contra 9 al 91%. Casi el triple de tiempo expuesto a que el dev
    # la tire. Por eso se vuelve a encender el anti-rug (ver `anti_rug_ratio`).
    #
    # LO QUE SE GANA: el techo hasta migrar pasa de +57,5% a +188%, asi que
    # el TP de +40% solo se come el 21% del recorrido disponible.
    # UMBRAL AL 1% EL 18-oct. ESTO NO SE PIDIO: va incluido porque sin el, lo
    # que SI se pidio (comprar en 2-5k) no compra absolutamente nada.
    #
    # EL MOTIVO, con la cuenta hecha. Este detector descarta toda moneda con
    # `progreso < umbral` (curva96_source.py:492). Con el umbral en 0,754 la
    # primera vez que ve una moneda ya vale 14.980 $: TRES VECES el techo de
    # 5.000 pedido. La banda 2-5k quedaria puesta y muda para siempre.
    #
    #     0,754 de curva = 14.980 $     <- donde miraba antes
    #     0,316 de curva =  5.000 $     <- el techo pedido
    #     0,000 de curva =  2.936 $     <- donde NACE una moneda
    #
    # Se pone 0.01 y no 0 para que la moneda tenga al menos una operacion
    # hecha: con 0 entraria tambien la que acaba de nacer sin que nadie la
    # haya tocado, y no hay nada que medir en ella.
    # 0.89 EL 19-oct, pedido: "vuelve a usar la estrategia de comprar a un
    # 89%". Venia de 0.01 (la banda 2-5k de ayer).
    #
    # EL 89% DE CURVA SON 25.075 $ con SOL a 105, y 57,7 SOL dentro.
    # 0.88 EL 19-oct, pedido: "desde el 88". Venia de 0,89 (de hace un rato).
    # El 88% de curva son 24.026 $ y quedan +79,6% hasta migrar.
    # 0.93 EL 23-oct, pedido: "unicamente requisitos de sol que cruce el 93%
    # de la bonding curve". Venia de 0,88.
    # El 93% son 286,1 SOL de market cap = 30.043 $ con SOL a 105.
    umbral: 0.93
    # TOPE AL 40% EL 18-oct, por la misma razon y para proteger el nodo.
    #
    # Con el umbral tan abajo, dejar el tope en 0,995 haria que el detector
    # mandase a evaluar CADA moneda que opere entre el nacimiento y la
    # migracion. Cada evaluacion que pasa el volumen se queda hasta 60 s
    # leyendo la curva 6,7 veces por segundo, y `max_rps: 8` solo da para 1,2
    # monedas a la vez. El 429 de ayer fue exactamente eso.
    #
    # El 40% de curva son ~6.700 $: deja margen por encima del techo de 5.000
    # para que el que corte sea `max_entry_mc` (que usa el precio de SOL EN
    # VIVO) y no este tope de curva, que se desplazaria si SOL se mueve.
    # TOPE DE VUELTA A 0.995, y NO es cosmetico: con el umbral en 0,89 un
    # tope de 0,40 descartaria TODAS las monedas (`progreso < umbral or
    # progreso > tope`). Habria quedado mudo.
    #
    # El nodo ya no sufre como con el umbral al 1%: la ventana 89%-99,5% es
    # estrecha y pasan pocas monedas, no toda la curva.
    tope: 0.995
    buy_amount: 0
    # 0 EL 13-oct, pedido: "maximo de compras simultaneas son dos pero no
    # que solo dos". Estaba en 2 y eso NO era "dos a la vez": era un CUPO
    # TOTAL. Tras dos compras confirmadas la fuente se callaba para siempre
    # hasta reiniciar, y sin gritarlo -- justo la parada silenciosa que este
    # repo tiene documentada como "ya costo dias".
    #
    # QUIEN LIMITA LAS SIMULTANEAS ES `trade.max_posiciones`, que sigue en 2.
    # Son dos mandos distintos y se confundian por el nombre:
    #   max_compras    -> cuantas compra en TODA su vida (0 = sin limite)
    #   max_posiciones -> cuantas tiene abiertas A LA VEZ
    #
    # 0 ES "SIN LIMITE" aqui, no "ninguna": el codigo hace
    # `if cupo > 0 and ...` (universal_trader.py).
    max_compras: 0
    parar_tras_perdidas: 0

    # Demanda repartida: compradores totales y presión reciente.
    min_compradores: 8
    min_compradores_ola: 3
    ventana_presion: 5.0
    min_presion_ratio: 1.5
    min_compra_sol: 0.20
    min_edad_seg: 0
    max_edad_seg: 0

    # No perseguir una mecha/pump vertical de un segundo. La moneda puede
    # volver a evaluarse en la siguiente operacion mientras siga en la curva.
    vela_seg: 1.0

    # ANTI-MECHA / ANTI PUMP-AND-DUMP, ENCENDIDO EL 19-oct, pedido: "pon un
    # filtro anti mechas pump y dump". Estaba en 0 (apagado).
    #
    # QUE HACE: `volumen.subida()` mira cuanto ha subido el precio desde su
    # minimo en el ultimo segundo. Si pasa de este numero, la moneda se
    # descarta con "posible pump and dump" (curva96_source.py:347) y NO se
    # pierde: se vuelve a evaluar en la siguiente operacion si sigue en la
    # curva. Nacio el 23-sep tras entrar en CATO a 26K justo despues de que
    # subiera de 7,5K a 25K.
    #
    # POR QUE 0.40 Y NO MENOS, con la aritmetica de la curva al 88%:
    #
    #     compra de  2 SOL -> el precio sube  +4,7%
    #     compra de  5 SOL -> el precio sube +12,0%
    #     compra de 10 SOL -> el precio sube +24,7%
    #     compra de 20 SOL -> el precio sube +52,0%
    #
    # Un 40% en UN segundo pide ~15,7 SOL de compras en ese mismo segundo.
    # Eso ya no es un comprador grande: es una pared coordinada, que es
    # justo la mecha que se quiere evitar. Poner 15% tiraria monedas por una
    # sola compra de 6 SOL, que es normal al 88% de curva.
    #
    # SE VE EN `porque`: el motivo sale como "vela de +N% en 1,0s; posible
    # pump and dump", y el embudo lo cuenta en "vela 1s descartada".
    # APAGADO EL 19-oct, pedido: "que lo elimines". Estuvo encendido unas
    # horas: primero en 0,40 ("pon un filtro anti mechas pump y dump") y
    # luego en 1,00 ("sube anti mechas"), las dos cosas pedidas hoy mismo.
    # ESTO DESHACE AQUELLAS DOS ORDENES y queda escrito aqui.
    #
    # POR QUE SE QUITA, con el embudo delante: el punto 3 de `porque` daba 37
    # descartes por vela, el freno mas grande de los tres (21 por
    # volumen/presion, 11 por mayhem). Al 88% de curva una moneda esta
    # subiendo POR DEFINICION --es como ha llegado ahi-- asi que cualquier
    # corte por velocidad la pilla a media subida normal.
    #
    # LO QUE SE PIERDE: era lo unico que impedia comprar el ultimo escalon de
    # una vela verde. Nacio el 23-sep tras entrar en CATO a 26K justo despues
    # de que subiera de 7,5K a 25K. Sin esto, eso puede repetirse.
    #
    # Para volver a encenderlo basta poner un numero aqui; con 0 no corre.
    max_subida_vela: 0.35

    # Por peticion expresa, las señales de bundle no bloquean la compra.
    exigir_ver_creacion: false
    max_carteras_primer_bloque: 0
    max_sol_primer_bloque: 0
    max_bundle_pct: 0
    max_bundle_pct_sin_historia: 0
    heartbeat_interval: 300

  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  # 40 rps con el plan ampliado de Helius. Estuvo en 8 mientras el nodo
  # devolvia 429; si vuelven a aparecer, es que el limite sigue por debajo de
  # esto y hay que bajarlo otra vez -- o revisar que el endpoint del .env sea
  # el del plan nuevo y no el viejo.
  # 20, no 40. Con 40 el nodo devolvia 429 justo al ir a leer la curva para
  # comprar -- paso con "Joe", que habia pasado TODOS los filtros. Mejor menos
  # peticiones y que las que importan entren.
  # 8 EL 16-oct. TERCERA VEZ que este numero baja por 429. El panel mostro
  # 208 avisos de 429/websocket caido en 15 minutos, con el bot sin comprar
  # nada. Manu habia ampliado CREDITOS, que es el limite equivocado:
  #
  #     creditos   = cuantas peticiones al mes      (lo que amplio)
  #     rate limit = cuantas peticiones por SEGUNDO (lo que devuelve 429)
  #
  # Son limites distintos y ampliar uno no toca el otro.
  #
  # POR QUE 8 Y NO MENOS. El tope de posiciones vigilables es
  # `max_rps x price_check_interval / 2`:
  #
  #     max_rps 20 -> 10 vigilables
  #     max_rps 10 ->  5 vigilables
  #     max_rps  8 ->  4 vigilables   <- elegido, y hay 3 posiciones
  #     max_rps  6 ->  3 vigilables   (justo, sin margen)
  #     max_rps  5 ->  2 vigilables   NO: el TP reaccionaria tarde
  #
  # Con 8 caben las 3 posiciones con un hueco de margen, y el bot manda la
  # mitad de peticiones que con 20. Es ademas el valor con el que ya funciono
  # la ultima vez que aparecieron 429.
  #
  # SI LOS 429 SIGUEN DESPUES DE ESTO, el problema NO es el ritmo: hay que
  # mirar que `SOLANA_NODE_RPC_ENDPOINT` del .env sea el del plan NUEVO.
  # Helius puede dar una URL distinta al cambiar de plan, y entonces los
  # creditos pagados estan en una cuenta que el bot no usa.
  max_rps: 8
