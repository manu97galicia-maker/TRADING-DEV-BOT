# Experimento MAYHEM. NACIO EN PAPEL Y YA NO LO ESTA: desde el 3-nov opera
# con DINERO REAL, acotado a 5 compras de 0,03 SOL (0,15 SOL en total).
# Ver el bloque de `paper_trade`, mas abajo.
name: "PAPER MAYHEM 24K - cinco muestras"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
# APAGADA EL 4-nov, pedido: "Solo quiero la de comprar bloque 2 con dev
# migrado 1%". Venia de true. `paper_trade` se deja como estaba (en real):
# volver a encenderla es solo poner esto en true. Con enabled en false el
# arranque de "todas" (`python -m bot_runner`, arranca.sh, pump-bot) la salta.
enabled: false
separate_process: false
platform: "pump_fun"

trade:
  nombre_estrategia: "paper-mayhem-24k"
  buy_amount: 0.03
  mayhem_buy_amount: 0.03
  fraccion_saldo: 0
  tope_compra_sol: 0.03
  min_reserve_sol: 0.03
  max_posiciones: 2
  max_real_buys: 5
  reiniciar_tanda: false
  buy_slippage: 0.12
  sell_slippage: 0.25
  sell_slippage_proteccion: 0.50
  exit_strategy: "tp_sl"
  # Objetivo absoluto: funciona igual aunque cada entrada tenga un MC distinto.
  final_target_mc: 24000
  stop_loss_percentage: 0.70
  vender_todo_en_stop: true
  stop_a_entrada_tras_tp: false
  trailing_stop_percentage: 0
  max_hold_time: 600
  price_check_interval: 1
  anti_rug_ratio: 1.6
  anti_rug_seg: 3
  anti_rug_min_sol: 1.0

priority_fees:
  enable_dynamic: true
  enable_fixed: false
  fixed_amount: 0
  extra_percentage: 0.0
  hard_cap: 5000000
retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  max_token_age: 12
  min_buy_age: 1
  max_buy_age: 15
  # REAL DESDE EL 3-nov, pedido: "como arranco en real todas" -> "me refiero
  # a estas 3". Venia de true. Ningun otro numero se mueve.
  #
  # LO QUE PUEDE PERDER ESTA ACOTADO DE VERDAD, y conviene saber por que:
  #   `max_real_buys: 5`  SI es un freno. En universal_trader.py:4855 el tope
  #                       se comprueba con `if (self.max_real_buys and ...)`,
  #                       y 5 es verdadero, asi que entra. (Con 0 seria falso
  #                       y el tope quedaria APAGADO; es lo que pasa en
  #                       bot-paper-bloque4, donde el 0 no frena nada.)
  #   `reiniciar_tanda: false`  la tanda no se reinicia, asi que esas 5
  #                       compras son de por vida del proceso, no por tanda.
  #   `tope_compra_sol: 0.03`   cada compra son 0,03 SOL exactos.
  #   =>  5 x 0,03 = 0,15 SOL en total. A 105 $/SOL, unos 15,75 $.
  #
  # `paper_max_samples: 5` SE QUEDA SIN EFECTO. Solo se mira dentro de la
  # rama `if self.paper_trade:` (universal_trader.py:4763). En real no limita
  # nada; quien limita ahora es `max_real_buys`.
  #
  # OJO CON EL NOMBRE: se llama `bot-paper-...` pero ya NO es de papel. El
  # nombre decide el sufijo del estado
  # (`open_position_bot-paper-mayhem-24k__*.json`), asi que renombrarlo
  # dejaria huerfanas las posiciones vivas. Se deja, pero que no enganie.
  paper_trade: false
  paper_max_samples: 5
  paper_watch_secs: 600
  allow_mayhem: true
  require_mayhem: true
  min_entry_mc: 2600
  max_entry_mc: 4200
  min_buys: 8
  min_titulares: 8
  min_ops: 8
  min_curve_sol: 0.5
  ultimas_tx_compra: 3
  min_presion_ratio: 1.4
  presion_seg: 4
  ignorar_listas_de_devs: false
  bro_address: "top_devs_mayhem_66.json"
  pumpfun_dev:
    enabled: false

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false
node:
  max_rps: 12
