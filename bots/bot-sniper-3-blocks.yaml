name: "Estrategia REAL - dev migro 2x y 24pct"
env_file: ".env"
rpc_endpoint: "https://api.mainnet-beta.solana.com"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false          # DESACTIVADO 2026-07-25: perdedora, solo swing en real
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.1              # 0,1 SOL
  buy_slippage: 0.35
  sell_slippage: 0.35

  exit_strategy: "tp_sl"
  take_profit_percentage: 0.7        # +70% (subido)
  take_profit_sell_percentage: 0.7   # vender 70%
  tp2_gain: 1.95                      # +195% (subido)
  tp2_sell: 0.3                       # el 30% restante
  tp3_gain: 0
  tp3_sell: 0
  stop_loss_percentage: 0.35         # SL -35%
  max_hold_time: 1800                # 30 min
  price_check_interval: 2

  extreme_fast_mode: false
  extreme_fast_token_amount: 20

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 1_000_000
  extra_percentage: 0.0
  hard_cap: 1_000_000

filters:
  listener_type: "pumpportal"    # lanzamientos nuevos (evita el WSS de Helius)
  max_token_age: 30              # 30s (margen para RugCheck)
  match_string: null
  bro_address: null
  marry_mode: false
  yolo_mode: true                # continuo: compra cada dev que califique
  paper_trade: false             # EN VIVO
  min_curve_sol: 0               # sin filtro de bundle
  allow_mayhem: true             # dev verificado: permito mayhem (los buenos lanzan asi)

  # Filtro de reputacion del dev via API de pump.fun (dato real, no RugCheck):
  # comprar SOLO si el dev ha migrado >=2 tokens Y ratio >=24%
  pumpfun_dev:
    enabled: true
    min_migrations: 2
    min_rate: 0.24

  # RugCheck OFF (no tiene datos de devs de pump.fun; usamos la API de pump.fun)
  dexscreener:
    enabled: false
    enforce: true
    block_on_error: true
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 50
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0.24
    min_dev_launches: 2
    dev_migration_rules:
      - min_rate: 0.24
        min_migrations: 2
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 8
