name: "GANADOR - mayhem 800-2200 MC, 3 compras, 0.015 SOL, x2 vende 50%, x3 vende resto"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
enabled: false
separate_process: false
platform: pump_fun

trade:
  buy_amount: 0.015
  mayhem_buy_amount: 0.015
  rugs_para_bloquear: 1
  nombre_estrategia: ganador
  max_posiciones: 4
  max_perdidas_seguidas: 999
  max_real_buys: 999
  reiniciar_tanda: false

  buy_slippage: 0.15
  sell_slippage: 0.9
  exit_strategy: tp_sl

  # TP1: x2 (+100%), vende 50%
  take_profit_percentage: 1.0
  take_profit_sell_percentage: 0.5
  # TP2: x3 (+200%), vende el 100% restante
  tp2_gain: 2.0
  tp2_sell: 1.0
  mc_take_profit_tiers: []

  # SL -75% hasta el TP1; tras TP1 el suelo sube a la entrada (trinquete)
  stop_loss_percentage: 0.75
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: false
  trailing_stop_percentage: 0

  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  venta_muerta_seg: 20
  venta_muerta_gain: 0
  max_hold_time: 0
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.02

compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 5000000
  extra_percentage: 0.0
  hard_cap: 5000000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: logs
  max_token_age: 60
  max_buy_age: 60
  allow_mayhem: true
  require_mayhem: true
  marry_mode: false
  yolo_mode: true
  ignorar_listas_de_devs: true
  no_repeat_name_min: 5
  match_string: null
  min_entry_mc: 800
  max_entry_mc: 2200

  # Ventana de compra 5-60s: no entrar antes del segundo 5.
  # Se usa second_wave SOLO por su min_age_seconds; el resto de sus
  # condiciones van a 0 porque todas comparan con < y un 0 las deja pasar.
  second_wave:
    enabled: true
    window_seconds: 1.5
    min_age_seconds: 5
    min_net_buy_sol: 0
    min_buys: 0
    min_buyers: 0
    min_wave_buy_sol: 0
    min_wave_net_sol: 0
    min_wave_buyers: 0
    min_largest_buy_sol: 0

  pumpfun_dev:
    enabled: false

  min_buys: 3
  ultimas_tx_compra: 3
  min_titulares: 0

  dev_buy:
    min_sol: 0
