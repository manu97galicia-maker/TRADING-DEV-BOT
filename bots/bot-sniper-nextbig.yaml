name: "NEXT-BIG - 61 devs moonshot 200K semana 0.35 SOL"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true       # ON 2026-07-28 tarde (RPC de pago OK)
separate_process: true
platform: "pump_fun"

trade:
  # 2026-07-31: 0.25 -> 0.05. Con 0.294 SOL en la wallet, 0.25 era el 85% de la
  # cuenta en una sola operacion: daba para UN intento. A 0.05 dan para cinco, y
  # con 51% de aciertos y ratio ganancia/perdida ~1 hacen falta muchos intentos
  # para que el resultado signifique algo en vez de ser azar.
  # 2026-07-31 07:40: 0.05 -> 0.02. Con 0.077 SOL en la wallet, a 0.05 el bot
  # NO PODIA COMPRAR: le faltaba saldo para una sola entrada contando la reserva.
  # A 0.02 quedan 3 entradas. El precio es que las comisiones (~0.002 por ida y
  # vuelta) pasan a ser el 10% de cada operacion, asi que cada acierto tiene que
  # cubrir eso antes de dar nada.
  buy_amount: 0.02
  buy_slippage: 0.35
  sell_slippage: 0.35
  exit_strategy: "tp_sl"
  # 2026-07-31: fuera la escalera. Se vende TODO en +40% (Manu pidio 35-40; se
  # coge el 40 porque con el stop en -40 exige acertar el 52,6% en vez del 56,3%
  # que exigiria el 35).
  #
  # Lo que se gana: cada acierto cierra la operacion entera y el beneficio queda
  # en la wallet, sin depender de que la moneda siga subiendo.
  # Lo que se pierde: los runners. Con la escalera, un x22 como IM POOR dejaba
  # correr el 40% de la posicion; ahora se sale entero en +40%. Dado que la
  # mayoria de las operaciones se resuelven en menos de 60s y los runners son
  # raros, es un cambio defendible -- pero es explicitamente renunciar a la cola.
  take_profit_percentage: 0.40
  take_profit_sell_percentage: 1.0
  stop_loss_percentage: 0.40
  max_hold_time: 180               # 3 min (mas margen: los moonshots tardan mas en despegar)
  price_check_interval: 1
  extreme_fast_mode: false
  extreme_fast_token_amount: 20
  min_reserve_sol: 0.01

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000         # gas a 3/4 (2026-07-29)
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 2
  wait_after_buy: 0

filters:
  listener_type: "pumpportal"   # feed gratis aparte (no gasta creditos del RPC); matchea creator con la lista
  max_token_age: 30
  match_string: null
  bro_address: "top_devs_nextbig.json"   # 61 devs giga200k (>=2 monedas >$200K/sem) que NO estan en ELITE
  allow_mayhem: false           # OFF: las mayhem las maneja SOLO el bot MAYHEM (evita doble-compra + NEXT-BIG vende 35% = revierte en curva mayhem fina). Separacion limpia.
  marry_mode: false
  yolo_mode: true
  paper_trade: false           # COMPRA DE VERDAD con SOL real (2026-07-30, decision de Manu)
  min_curve_sol: 0
  # 2026-07-31: subido de 8000 -> 15000. Sobre 185.428 monedas de Dune, la
  # ganadora MEDIANA esta en $8.395 a los 20s: el tope de $8K rechazaba a mas de
  # la mitad de las que acaban funcionando, por 400 dolares de margen.
  max_entry_mc: 15000
  min_holders: 0
  max_holder_pct: 0
  holder_bypass_ratio: 3

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 6
