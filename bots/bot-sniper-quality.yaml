name: "QUALITY-PAPER - filtro puro rug0 MC3-3.8K 5holders"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.15
  buy_slippage: 0.35
  sell_slippage: 0.35
  exit_strategy: "tp_sl"
  take_profit_percentage: 0.4       # +40% -> vende 60%
  take_profit_sell_percentage: 0.60
  tp2_gain: 1.0                     # +100% -> vende 20%
  tp2_sell: 0.20
  tp3_gain: 1.5                     # +150% -> vende 20%
  tp3_sell: 0.20
  stop_loss_percentage: 0.40
  max_hold_time: 180
  price_check_interval: 1
  extreme_fast_mode: false
  extreme_fast_token_amount: 20
  min_reserve_sol: 0.03

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 20          # mide a los 20s (ventana del analisis)
  wait_after_buy: 0

filters:
  listener_type: "pumpportal"
  max_token_age: 60                # MAXIMO 1 MINUTO de edad de la moneda
  match_string: null
  bro_address: null                # SIN lista de devs -> evalua TODA moneda por filtro puro
  marry_mode: false
  yolo_mode: true
  paper_trade: true                # <<< SIMULADO (0 SOL real), notifica ROI por Telegram
  min_curve_sol: 15                # momentum: >=15 SOL en curva (~$5K) - filtra losers de 1.9 SOL
  max_entry_mc: 12000              # techo $12K (winners ya estan a ~$8.4K a los 20s)
  min_holders: 10                  # minimo 10 holders reales (2026-07-30)
  max_holder_pct: 0.20             # ningun holder individual >20%
  max_bundle_pct: 0.25             # BUNDLE < 25% (2026-07-30)
  holder_bypass_ratio: 0

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: true                  # activa RugCheck
    enforce: false
    block_if_rugged: true          # RUG ~0%: descarta lo marcado rugged por RugCheck
    block_on_error: false          # token muy fresco sin datos RugCheck -> no bloquea
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 8
