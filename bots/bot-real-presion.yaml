# ESTRATEGIA UNICA DE PRESION, pedida el 7-nov: "elimina lo de 6k y 15k,
# ahora entra cualquier moneda de pumpfun o pumpswap con esa presion
# compradora y volumen, una unica estrategia". Manu eligio la presion de la
# de 6k y "solo pump.fun de momento" (PumpSwap queda pendiente: hay que
# construir el vigilante de presion de los pools).
#   - Sale de bot-real-presion6k.yaml (todo igual: salida, stop, tamano,
#     prioridades, bundles, topes). Lo que cambia:
#   - umbral 0: se mira CUALQUIER moneda de la curva, desde que nace hasta
#     el 99,5% (antes desde el 45%, ~5,7k). La de 15,3k se borra.
#   - revisar_cada_seg 2 y log_presion_cada_seg 30: con todas las monedas a
#     la vista, cada una se reevalua como mucho cada 2 s y su linea de
#     "presion insuficiente" sale como mucho cada 30 s (1 vCPU, 1 GB).
#
# CAMBIO DEL 7-NOV (Manu: "haces a veces 7 ventas, no hagas tantas que nos
# funden a comision, haz 3" y "en total busco un 75% roi y stop ponlo al 18%
# y elimina el filtro de market cap y sube un poco volumen y presion"):
#   - 3 VENTAS como mucho: TP1 +38% vende el 79,71% (recupera lo invertido,
#     como antes), +55% la mitad del resto y +75% lo que queda.
#   - STOP -18% (antes -25%).
#   - SIN FILTRO DE MARKET CAP (min_entry_mc 0, antes 6000). Sigue mirando
#     desde la curva al 45% (~5,7k con SOL a 90 $): eso no se ha tocado.
#   - PRESION un poco mas alta: 5 compradores / 1,8x / 0,8 SOL -> 6 / 2x / 1 SOL.
# ESTRATEGIA "PRESION FUERTE DESDE 6K", pedida el 7-nov: "anade una que
# compre aquella moneda con presion compradora fuerte y volumen minimo, 6k mc"
# (Manu: "comprar a partir de 6k de MC"). Generada a partir de
# bot-paper-dev1-bloque2.yaml (mismas comisiones, deslizamiento, reserva,
# stop -25%, venta a los 5 min si va en rojo, blacklist y auto-baneo por
# rugs, sin mayhem). Lo que cambia:
#   - ENTRADA (filters.curva_96 + min_entry_mc): cualquier dev; se empieza a
#     mirar con la curva al 45% (~5k) y se compra cuando el market cap pasa
#     de 6.000 $ (min_entry_mc, en un plazo de 120 s) CON PRESION:
#     >= 5 compradores distintos en 5 s, >= 1,8x compras/ventas y >= 0,8 SOL
#     comprado en esa ventana; >= 8 compradores en total. Sin mecha de 1 s
#     (> 35%) y sin concentracion de titulares (> 50%).
#     AFLOJADA el 7-nov (Manu: "afloja un poco", eligio 4 / 1,5x / 0,5 / 8).
#     Antes: 6 compradores en 5 s, 2x, 1 SOL, 10 en total. Coste: entra en
#     mas monedas, y con ellas en mas monedas malas.
#     REAPRETADA un poco el 7-nov (Manu: "anade un poco mas de presion
#     compradora y volumen", eligio "un poco"): 4 / 1,5x / 0,5 SOL ->
#     5 / 1,7x / 0,7 SOL. Los 8 compradores en total no cambian.
#     Y otro poquito el 7-nov ("un poquito mas de presion y volumen"):
#     1,7x / 0,7 SOL -> 1,8x / 0,8 SOL.
#   - SALIDA: la misma que dev1 para los devs normales: TP1 +38% (79,71%) y
#     el resto a 7k / 9k / 12k / 15k / 19k. OJO: entrando a 6k+, el TP1 salta
#     por encima de ~8,3k, asi que el tramo de 7k (y a veces el de 9k) se
#     vende justo despues del TP1.
#   - 15% del SOL libre por compra, tras el TP1 el stop a compra +5%, y para
#     tras 3 perdidas seguidas (igual que todas).
#   - node.max_rps 8: comparte Helius con las otras dos estrategias.
#   - Sin limite de operaciones simultaneas (max_posiciones 0, 7-nov: "pon
#     sin limite de operaciones simultaneas"): manda el saldo; tope de
#     seguridad del codigo, 40.
name: REAL PRESION (CUALQUIER MONEDA)
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
enabled: false
separate_process: false
platform: pump_fun
trade:
  nombre_estrategia: real-presion
  buy_amount: 0.25
  buy_amount_usd: 0
  # 7-nov: "20% por operacion" (antes 0.15).
  # 7-nov, despues: "pon 30% por operacion" (antes 0.20).
  # 7-nov, despues: "44% por operacion" (antes 0.30).
  # 7-nov, despues: "en normal pon 70% por operacion" (antes 0.44).
  fraccion_saldo: 0.70
  fraccion_base: libre
  min_reserve_sol: 0.03
  # 7-nov: "maximo 4 simultaneas y maximo de posiciones abiertas 4"
  # (antes 3 por estrategia). 4 por estrategia y, ademas, 4 EN TOTAL
  # entre las dos: cuenta las posiciones de todas antes de comprar.
  # 7-nov, despues: "maximo 3" (antes 4 y 4).
  max_posiciones: 3
  max_posiciones_total: 3
  # 7-nov: las mayhem van "aparte": sus posiciones no cuentan en estas 3.
  max_posiciones_total_ignora: [bot-real-mayhem]
  max_real_buys: 1000
  reiniciar_tanda: false
  # 7-nov: "deslizamiento 18%" (antes 35% en compra y venta). El de las
  # ventas de proteccion (stop, rug) se queda en 50%: si no entra, el
  # stop no sale.
  # 7-nov, despues: "slippage de compra 9%" (antes 18%).
  buy_slippage: 0.09
  # 7-nov: "si hay tres fallidas sube el slippage a 14%". 3 compras
  # fallidas SEGUIDAS -> slippage de compra al 14% hasta reiniciar.
  subir_slippage_tras_fallidas:
    fallidas: 3
    slippage: 0.14
  # 7-nov: "reduce slippage" -> eligio "solo la venta a 10%" (antes 18%).
  # La compra sigue en 9% (14% tras 3 fallidas) y el stop en 50%.
  sell_slippage: 0.10
  sell_slippage_proteccion: 0.5
  exit_strategy: tp_sl
  # 7-nov, despues: "+50%, +85%, +120% y stop -22" (antes -18%). OJO: el
  # trailing copia este valor, asi que tambien pasa a -22% desde el pico.
  stop_loss_percentage: 0.22
  # 7-nov, despues: "pon el primer tp en 50%" (antes 0.38). Sigue vendiendo
  # el 79,71%: a +50% eso cobra lo invertido +20% (a +38% era +10%).
  take_profit_percentage: 0.50
  take_profit_sell_percentage: 0.7971014493
  mc_take_profit_tiers: []
  stop_a_entrada_tras_tp: true
  margen_stop_tras_tp: 0.05
  max_perdidas_seguidas: 3
  stop_al_tp_tras_tp: false
  vender_todo_en_stop: true
  mc_stop_loss: 0
  max_hold_time: 0
  venta_muerta_seg: 300
  venta_muerta_gain: 0.0
  price_check_interval: 1
  # 7-nov "haz 3 ventas" y "en total busco un 75% roi": TP1 +38% (79,71%),
  # +55% y +75% (mitad y mitad del resto).
  # 7-nov, despues: "+50%, +85%, +120%" (antes +55% / +75%).
  # 7-nov, despues: "un 80% en segundos" -> +50% (79,71%) y el resto a +80%
  # (antes +85% / +120%).
  tp2_gain: 0.80
  tp2_sell: 0.2028985507
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  # 7-nov: "prioridad de compra 0.007" (antes 0,011 SOL = 110000000).
  # 7-nov: "reducir mis costes enormemente asegurando que se ejecuten" ->
  # eligio "baja fija": compra 0,002 SOL (antes 0,007):
  #   2.000.000 lamports / 100.000 unidades = 20.000.000 microlamports
  fixed_amount_compra: 20000000
  # 7-nov: "prioridad de venta 0.006". La venta reserva 60.000 unidades:
  #   6.000.000 lamports / 60.000 = 100.000.000 microlamports = 0,006 SOL
  # Antes 0,00034 SOL (5714286) la normal y 0,0025 SOL (42424243) la de
  # proteccion (stop, rug). Las dos a 0,006: el stop no puede ir con
  # menos prisa que un take profit.
  # Y ventas de TP 0,001 SOL, venta del stop 0,002 SOL (antes las dos 0,006):
  #   1.000.000 / 60.000 = 16.666.667   y   2.000.000 / 60.000 = 33.333.333
  fixed_amount: 16666667
  fixed_amount_venta_proteccion: 33333333
  extra_percentage: 0.0
  hard_cap: 110000000
retries:
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0
filters:
  listener_type: logs
  yolo_mode: true
  paper_trade: false
  paper_watch_secs: 600
  max_token_age: 5
  max_entry_mc: 0
  max_buy_age: 120
  # 7-nov: "asegurate no rugs" -> eligio "dev con poco": no se compra si
  # el creador tiene mas del 10% de la moneda.
  max_dev_hold_pct: 0.10
  allow_mayhem: false
  require_mayhem: false
  ignorar_listas_de_devs: false
  min_first_block_buys: 0
  max_first_block_buys: 0
  min_first_block_usd: 0
  max_first_block_usd: 0
  buy_from_second_block: false
  second_block_confirmation:
    enabled: false
    min_buyers: 0
    min_buy_sol: 0
    min_net_sol: 0
    max_sells: 0
  # PRESION EN LOS DEX, pedida el 7-nov: "puedes coger tambien de raydium
  # con mismas condiciones" y "anade pumpswap y meteora y bags, todos tienen
  # que ser liquidez locked". Ver monitoring/dex_presion_source.py.
  #   - EN REAL desde el 7-nov (Manu: "de papel no, asegurate que en real va
  #     bien"). Compra y vende por Jupiter con la prioridad y el slippage del
  #     bot; las monedas de 9 decimales se cuentan bien (precio del DEX pasado
  #     a la unidad del bot). Probado por el bot entero en
  #     tests/test_dex_presion_real.py. en_papel: true lo vuelve a simular.
  #   - La presion es de 5 MINUTOS (GeckoTerminal), no de 5 segundos.
  #     Numeros propuestos el 7-nov, sin confirmar todavia por Manu.
  #   - Bags lanza en pools de Meteora: entra con el prefijo "meteora".
  dex_presion:
    # 7-nov: "solo las que llegan al 91% de la bonding": la parte de
    # PumpSwap (monedas ya migradas) se apaga. true la vuelve a encender.
    enabled: false
    en_papel: false
    # 7-nov, despues: "no compres mas que no sea pumpfun o pumpswap" (antes
    # raydium, pumpswap, meteora). Y solo monedas nacidas en pump.fun.
    dex: [pumpswap]
    solo_pumpfun: true
    intervalo_seg: 20
    min_compradores_5m: 30
    min_compras_5m: 50
    min_ratio_5m: 2.0
    min_volumen_5m_usd: 5000
    min_liquidez_usd: 10000
    min_lp_bloqueada_pct: 90
    # 7-nov: "no compres monedas con menos de 10 minutos de vida". En los DEX
    # la edad es la del pool (lo que da GeckoTerminal); sin fecha, no se compra.
    min_edad_min: 10
    max_posiciones_papel: 4
    importe_papel_sol: 0.15
    prioridad_compra_sol: 0.002
    prioridad_venta_sol: 0.001
  curva_96:
    enabled: true
    tope: 0.995
    buy_amount: 0
    max_compras: 0
    parar_tras_perdidas: 0
    # 7-nov: "no compres monedas con menos de 10 minutos de vida". Edad desde
    # que se creo en la cadena. Una mas joven se vuelve a mirar cuando ya la
    # tenga; una cuyo nacimiento no vio el bot (arranco despues) no se compra.
    min_edad_seg: 600
    max_edad_seg: 0
    vela_seg: 1.0
    max_subida_vela: 0.35
    # 7-nov: "sin pump and dumps ni mechas" -> "mas estricto": tampoco si ha
    # subido mas de un 60% en los ultimos 30 s.
    vela2_seg: 30
    max_subida_vela2: 0.60
    exigir_ver_creacion: false
    # 7-nov, Manu con la captura de LAGER (de ~2,5k a ~27k en el primer
    # segundo y el dev lo vende todo a los 2 min): "no me compres este
    # tipo". Estaban a 0 (apagados) porque venian copiados de dev1, no
    # porque se pidiera. Se ponen los valores por defecto del codigo: si
    # en el bloque de creacion compran mas de 3 carteras o entran mas de
    # 2 SOL, es bundle y no se compra.
    # 7-nov, despues: "mas de 5 carteras, no compra; mas de 9 SOL, no
    # compra" (antes 3 y 2.0).
    max_carteras_primer_bloque: 5
    max_sol_primer_bloque: 9.0
    max_bundle_pct: 0.5
    max_bundle_pct_sin_historia: 0.35
    heartbeat_interval: 300
    # 7-nov "cualquier moneda": desde que nace (antes 0.45).
    # 7-nov, despues: "solo las que llegan al 91% de la bonding" (antes 0.0).
    # Y despues: low cap "a partir de 8k" (min_mc_usd 8000). Se empieza a
    # mirar en el 40% de la curva (~4,9k con SOL a 90 $, ~8k con SOL a
    # 150 $) para que el minimo lo ponga el market cap y no la curva.
    umbral: 0.40
    revisar_cada_seg: 2.0
    # 7-nov: "dos ultimas tx sean compras". Con la presion OK, si en las 2
    # ultimas operaciones hay alguna venta, no se compra (se vuelve a mirar).
    # 7-nov, despues: "las 3 ultimas sean compras" (antes 2).
    ultimas_compras: 3
    # 7-nov: "minimo compras monedas de 5.6k de market cap". Por debajo no
    # se compra; se vuelve a mirar en la siguiente operacion.
    # 7-nov, despues: low cap "a partir de 8k" (antes 5.600).
    min_mc_usd: 8000
    # 7-nov: "buen volumen pero que entren muchas txs" -> eligio "60 compras
    # en total" desde que nacio (ademas de los 20 compradores distintos).
    # 7-nov, despues: "baja bastante volumen y gente" -> 25 (antes 60).
    min_compras_total: 25
    # 7-nov: "mas operaciones pero mayor volumen" -> eligio "30 SOL negociados"
    # (compras + ventas) desde que nacio.
    # Y 10 SOL negociados (antes 30).
    min_volumen_total_sol: 10
    log_presion_cada_seg: 30.0
    # 7-nov "afloja un poco": antes 10 / 6 / 2.0 / 1.0.
    # 7-nov: "mas volumen, quiero que haya muchas transacciones pero cogerlas
    # antes de que exploten" -> eligio "mas gente total": 20 (antes 8).
    # Y 8 compradores distintos desde que nacio (antes 20).
    min_compradores: 8
    # 7-nov "un poco mas de presion y volumen": antes 4 / 1.5 / 0.5.
    # 7-nov "un poquito mas": 1.7 / 0.7 -> 1.8 / 0.8.
    # 7-nov "sube un poco": 5 / 1.8 / 0.8 -> 6 / 2.0 / 1.0.
    # 7-nov, despues: "un poco mas de volumen y presion": 6 / 2.0 / 1.0 ->
    # 7 / 2.2 / 1.2.
    # 7-nov, despues: "bajar un poco la presion" -> eligio "un poco":
    # 7 / 2.2 / 1.2 -> 6 / 2.0 / 1.0.
    # 7-nov, despues: "baja presion un poco" (no pillaba nada): 6 / 2.0 /
    # 1.0 -> 5 / 1.8 / 0.8.
    min_compradores_ola: 5
    ventana_presion: 5.0
    min_presion_ratio: 1.8
    min_compra_sol: 0.8
  pumpfun_dev:
    enabled: false
  # 7-nov "elimina el filtro de market cap" (antes 6000).
  min_entry_mc: 0
cleanup:
  mode: post_session
  force_close_with_burn: false
  with_priority_fee: false
node:
  max_rps: 8
