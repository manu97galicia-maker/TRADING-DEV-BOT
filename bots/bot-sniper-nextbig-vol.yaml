# GEMELO DE NEXT-BIG EN MODO SEÑAL — experimento del filtro de volumen
#
# Identico a bot-sniper-nextbig.yaml salvo en TRES cosas, que son justo la
# hipotesis que se quiere medir:
#
#   1. wait_after_creation: 2 -> 20   mide la curva a los ~20s, que es donde la
#                                     consulta de Dune encuentra la separacion
#   2. min_curve_sol: 0 -> 3.0        exige que haya entrado dinero de verdad
#   3. paper_trade: true              NO compra: solo apunta y sigue el precio
#
# De donde sale el 3.0: sobre 185.428 monedas, el 75% de las que pasan de $8K
# hacen >=7,9 SOL de volumen en los primeros 20s, contra 1,9 SOL de la
# perdedora tipica. Dune mide volumen (compras+ventas) y la curva guarda el
# NETO; con un 69% de compras, 7,9 de volumen son ~3,0 SOL netos en la curva.
# Encaja con lo que el propio codigo ya habia observado: los bundles que si
# pumpean aparecian con ~4,3 y ~11,2 SOL en curva.
#
# ES UNA ESTIMACION. Ese es el motivo de correrlo en paper antes de tocar dinero.
#
# Como se lee el resultado: este bot escribe en paper_trades/results.jsonl (pico,
# minimo, que toco primero y en cuantos segundos). NEXT-BIG el de verdad escribe
# en trades/trades.log. A los 2-3 dias se comparan y se ve cual habria ganado.
#
# max_token_age baja a 10 para que, sumada la espera de 20s, la medicion caiga
# en la ventana de ~20-30s que mide Dune. Con los 30 originales una moneda vista
# a los 25s se acabaria midiendo a los 45s y no seria comparable.

name: "NEXT-BIG VOL (paper) - filtro 3 SOL en curva a los 20s"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.05             # igual que el bot real, para que la comparacion valga
  buy_slippage: 0.35
  sell_slippage: 0.35
  exit_strategy: "tp_sl"
  take_profit_percentage: 0.4
  take_profit_sell_percentage: 0.60
  tp2_gain: 1.0
  tp2_sell: 0.20
  tp3_gain: 1.5
  tp3_sell: 0.20
  stop_loss_percentage: 0.40
  max_hold_time: 180
  price_check_interval: 1
  extreme_fast_mode: false
  extreme_fast_token_amount: 20
  min_reserve_sol: 0.03

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 20      # <-- CAMBIO 1: medir a los ~20s, no a los 2s
  wait_after_buy: 0

filters:
  listener_type: "pumpportal"
  max_token_age: 10            # 10 + 20 de espera = medicion en la ventana de Dune
  match_string: null
  bro_address: "top_devs_nextbig.json"
  allow_mayhem: false
  marry_mode: false
  yolo_mode: true
  paper_trade: true            # <-- CAMBIO 3: solo avisa, NO compra
  min_curve_sol: 3.0           # <-- CAMBIO 2: exigir dinero real en la curva
  max_entry_mc: 15000
  min_holders: 0
  max_holder_pct: 0
  holder_bypass_ratio: 3

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 6
