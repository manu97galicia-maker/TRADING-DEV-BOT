# SECOND-WAVE (real, limitado)
#
# Detecta demanda externa en dos tiempos: primero exige traccion acumulada y,
# despues del segundo 5, una nueva oleada concentrada en los ultimos 1,5 s.
# Los umbrales reproducen la firma observada en Social (Hf7X...pump), pero se
# Se limita a dos compras reales persistentes para medirla sin gasto abierto.

name: "SECOND-WAVE 5/10/15s (real limitado)"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.30
  buy_slippage: 0.35
  sell_slippage: 0.35
  exit_strategy: "tp_sl"
  # Porcentajes sobre la posicion ORIGINAL: 30% + 35% + 35% = salida total.
  take_profit_percentage: 0.40
  take_profit_sell_percentage: 0.30
  tp2_gain: 0.80
  tp2_sell: 0.35
  # x3 sobre la entrada equivale a una ganancia de +200%.
  tp3_gain: 2.00
  tp3_sell: 0.35
  stop_loss_percentage: 0.35
  max_hold_time: 300
  price_check_interval: 1
  min_reserve_sol: 0.05
  max_real_buys: 2

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 1000000
  extra_percentage: 0.0
  hard_cap: 1000000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0
  wait_before_new_token: 0

filters:
  # Helius de pago por WSS: imprescindible para recibir cada TradeEvent y
  # calcular la segunda oleada; PumpPortal no entrega este flujo completo.
  listener_type: "logs"
  max_token_age: 15
  max_buy_age: 15
  match_string: null
  bro_address: null
  marry_mode: false
  yolo_mode: true
  paper_trade: false
  allow_mayhem: true

  # La curva se consulta solo despues de que pase la firma en memoria.
  min_entry_mc: 0
  max_entry_mc: 8000
  min_curve_sol: 0
  min_holders: 0
  min_titulares: 0
  min_ops: 0
  min_volumen_sol: 0

  second_wave:
    enabled: true
    min_age_seconds: 5.0
    window_seconds: 1.5
    min_net_buy_sol: 8.0
    min_buys: 20
    min_buyers: 15
    min_wave_buy_sol: 8.0
    min_wave_net_sol: 5.0
    min_wave_buyers: 5
    min_largest_buy_sol: 3.0

  dexscreener:
    enabled: false

cleanup:
  mode: "disabled"

node:
  max_rps: 8
