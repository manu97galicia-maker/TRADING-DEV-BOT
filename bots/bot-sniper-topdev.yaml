name: "Snipe Top Devs - watch wallets, buy on their launch"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false          # enciende cuando top_devs.json tenga wallets REALES
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.05             # PEQUENO a proposito: en modo continuo compras CADA
                               # lanzamiento de las wallets vigiladas. Sube con cuidado.
  buy_slippage: 0.35           # slippage compra 35%
  sell_slippage: 0.35          # slippage venta 35%

  exit_strategy: "tp_sl"
  # TP/SL escalonado: 60% al +50% . 40% al +150% . SL -35% . 30min max
  take_profit_percentage: 0.5        # +50%
  take_profit_sell_percentage: 0.6   # vender 60%
  tp2_gain: 1.5                       # +150%
  tp2_sell: 0.4                       # vender el 40% restante
  tp3_gain: 0
  tp3_sell: 0
  stop_loss_percentage: 0.35         # SL -35%
  max_hold_time: 1800                # 30 min max
  price_check_interval: 2

  extreme_fast_mode: false      # false = buy_amount real (no polvo)
  extreme_fast_token_amount: 20

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 1_000_000       # fee prioritario para entrar primero al bloque
  extra_percentage: 0.0
  hard_cap: 1_000_000

filters:
  listener_type: "logs"         # escucha TODAS las creaciones y filtra por creador
  max_token_age: 30             # segundos: ventana generosa (pocas wallets, poco volumen)
  match_string: null

  # ===== EL CORAZON DE ESTA ESTRATEGIA =====
  # Apunta a un archivo con las dev wallets a vigilar. Cuando UNA de ellas cree
  # una moneda en pump.fun -> compra con los parametros de arriba.
  # Acepta: un archivo .json/.txt, una wallet suelta, o una lista de wallets.
  bro_address: "top_devs.json"
  # ==========================================

  marry_mode: false
  yolo_mode: true               # TRUE = continuo: snipea CADA lanzamiento de los devs
  paper_trade: true             # <<< EMPIEZA EN SIMULACION. Pon false para ir en vivo.
  min_curve_sol: 2              # anti-basura: exige >=2 SOL en la curva (dinero real) o salta

  # Comprar al nacer = DexScreener aun NO tiene datos del token. El filtro aqui es
  # el DEV, no el market cap. Por eso los filtros de MC van APAGADOS.
  buy_on_dex_paid:
    enabled: false

  dexscreener:
    enabled: false              # apagado: el token es demasiado nuevo para tener MC
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 10
