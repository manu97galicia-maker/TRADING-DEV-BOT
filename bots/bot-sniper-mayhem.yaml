name: "Solo Mayhem - dev migró ≥20%"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false          # DESACTIVADO 2026-07-25: perdedora, solo swing en real
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.14             # 0,14 SOL por compra (REAL)
  buy_slippage: 0.35           # slippage compra 35%
  # Venta: suelo alto a propósito. El min_sol_output SOLO provoca el revert
  # (error 6003 TooLittleSolReceived); NUNCA hace que recibas menos -> siempre
  # cobras el precio real de la curva. Con 35% las ventas de bolsa entera en
  # curvas finas (mayhem) se revertían y caían a Jupiter (dejando polvo). 90%
  # deja que la venta en curva se complete de una sola vez, sin polvo atascado.
  sell_slippage: 0.90          # slippage venta 90% (anti-revert 6003)

  exit_strategy: "tp_sl"
  # Salida optimizada por datos: 60% al +40% (pico fiable, tocó 13/13) .
  # 40% restante al +150% (captura la cola, de donde vino el dinero grande) . SL -20%
  take_profit_percentage: 0.6        # TP1 = +60%
  take_profit_sell_percentage: 0.5   # vender la MITAD (50%) en TP1
  tp2_gain: 1.5                      # TP2 = +150%
  tp2_sell: 0.25                     # vender 25% (la mitad de lo que queda) en TP2
  tp3_gain: 2.2                      # TP3 = +220% (subido)
  tp3_sell: 0.25                     # vender el 25% restante en TP3
  stop_loss_percentage: 0.2          # SL -20%
  max_hold_time: 1800                # 30 min max
  price_check_interval: 1            # 1s: reacciona más rápido en TP/SL (agresivo)

  extreme_fast_mode: false      # false = lee la curva -> detecta mayhem de forma fiable
  extreme_fast_token_amount: 20 # (sin efecto con extreme_fast_mode: false)

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 2_500_000            # fee subido: aterriza antes que otros bots (agresivo)
  extra_percentage: 0.0
  hard_cap: 2_500_000

filters:
  listener_type: "logs"
  max_token_age: 30            # 30s: deja pasar tokens frescos; el filtro real es mayhem + dev
  match_string: null
  bro_address: null
  marry_mode: false
  yolo_mode: true                # continuo: sigue buscando la siguiente mayhem
  paper_trade: false             # EN VIVO (real)
  min_curve_sol: 0               # sin filtro de momentum (el dev>=20% es el filtro ahora)

  # >>> SOLO MODO MAYHEM <<<
  allow_mayhem: true             # permitir tokens mayhem (obligatorio para el gate)
  require_mayhem: true           # comprar ÚNICAMENTE tokens en mayhem mode

  # Filtro de reputación del dev (vía RugCheck; funciona en lanzamientos frescos)
  dexscreener:
    enabled: true
    enforce: true
    block_on_error: true
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 50
    min_boosts: 0
    min_liquidity_usd: 0         # 0 = no exige datos de mercado (no bloquea tokens nuevos)
    min_market_cap: 0            # 0 = sin filtro de market cap
    max_market_cap: 0            # 0 = sin filtro de market cap
    min_dev_migration_rate: 0.24 # dev migró >= 24%
    min_dev_launches: 1          # con >= 1 lanzamiento previo
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 15
