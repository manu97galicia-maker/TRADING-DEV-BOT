name: "MAYHEM - 15 devs que se disparan 0.1 SOL"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false      # OFF 2026-08-01 (misma tarde): Manu recarga la wallet y
                    # deja SOLO VELOCIDAD. Los avisos de mayhem siguen llegando
                    # por alerta_mayhem.py, que es un proceso aparte y no compra.
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.15            # 0.15 SOL (2026-07-29)
  buy_slippage: 0.35
  # Venta 90%: en curvas mayhem finas un slippage bajo revierte la venta (error
  # 6003 TooLittleSolReceived) -> cae a Jupiter dejando polvo. 90% deja que la
  # venta en curva se complete de una vez. (Nunca cobras menos: el suelo alto
  # solo evita el revert, siempre recibes el precio real de la curva.)
  sell_slippage: 0.90
  exit_strategy: "tp_sl"
  take_profit_percentage: 0.4      # +40% -> vende 60%
  take_profit_sell_percentage: 0.60
  tp2_gain: 1.0                    # +100% -> vende 20%
  tp2_sell: 0.20
  tp3_gain: 1.5                    # +150% -> vende 20% (resto)
  tp3_sell: 0.20                   # 60+20+20 = 100%, sin moonbag
  stop_loss_percentage: 0.40
  max_hold_time: 180
  price_check_interval: 1
  extreme_fast_mode: false         # false: lee la curva -> detecta mayhem de forma fiable
  extreme_fast_token_amount: 20
  min_reserve_sol: 0.03

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000         # gas a 3/4 (2026-07-29)
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 2
  wait_after_buy: 0

filters:
  listener_type: "logs"        # OBLIGATORIO para mayhem: pumpportal NO trae is_mayhem; logs (Helius WSS) lo lee del CreateEvent
  max_token_age: 30
  match_string: null
  bro_address: "top_devs_mayhem.json"   # 15 devs cuyos mayhem se disparan (Dune 14d: pct_100k>0 o pct_30k>=60)
  require_mayhem: true         # compra SOLO monedas mayhem (implica allow_mayhem)
  marry_mode: false
  yolo_mode: true
  paper_trade: false           # <<< EN VIVO (REAL)
  min_curve_sol: 0
  max_entry_mc: 8000            # no comprar si MC entrada > $8K (2026-07-29)
  min_holders: 0
  max_holder_pct: 0
  holder_bypass_ratio: 3

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 15
