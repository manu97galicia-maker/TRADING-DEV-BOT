# Experimento exclusivamente PAPER. No autoriza transacciones reales.
#
# Hipotesis que se quiere medir:
# - entrar solamente con MC entre 16k y 18k y demanda distribuida;
# - cortar en 13,68k;
# - recuperar capital cerca de 24k vendiendo el 73%;
# - proteger el 27% restante en la entrada y venderlo en 45k.
name: "PAPER PRESION 17K - recupera 24K - salida 45K"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
enabled: false
separate_process: false
platform: "pump_fun"

trade:
  nombre_estrategia: "paper-presion17k-45k"
  # La cantidad es virtual: paper_trade impide firmar compras o ventas.
  buy_amount: 0
  mayhem_buy_amount: 0
  fraccion_saldo: 0.15
  fraccion_base: "libre"
  tope_compra_sol: 0
  min_reserve_sol: 0.03
  max_posiciones: 5
  max_real_buys: 0
  reiniciar_tanda: true

  buy_slippage: 0.15
  sell_slippage: 0.25
  sell_slippage_proteccion: 0.50
  exit_strategy: "tp_sl"

  # Desde 17k, 24k equivale a +41,176%. Se vende 73% para recuperar
  # aproximadamente el capital inicial mas un pequeno margen de costes.
  take_profit_percentage: 0.4117647059
  take_profit_sell_percentage: 0.73
  # El escalon absoluto queda armado al ejecutarse el TP porcentual.
  mc_take_profit_tiers:
    - {target_mc: 45000, sell: 0.27}

  # Stop absoluto solicitado. El porcentual se desactiva para que no cambie
  # segun el punto exacto de entrada dentro de la banda 17k-18k.
  stop_loss_percentage: 0
  mc_stop_loss: 13680
  vender_todo_en_stop: true
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: false
  margen_stop_tras_tp: 0
  trailing_stop_percentage: 0
  max_hold_time: 600
  price_check_interval: 1

priority_fees:
  enable_dynamic: true
  enable_fixed: false
  fixed_amount: 0
  extra_percentage: 0.0
  hard_cap: 5000000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  paper_trade: true
  max_token_age: 0
  # Da dos minutos desde que aparece la candidata para confirmar banda,
  # compradores y presion; no compra si no llega a cumplirlo todo.
  max_buy_age: 120
  allow_mayhem: false
  require_mayhem: false
  ignorar_listas_de_devs: true

  min_entry_mc: 16000
  max_entry_mc: 18000
  min_holders: 8
  max_holder_pct: 0
  # Sin mínimo de volumen por petición expresa; la demanda se protege con
  # compradores distintos, número de operaciones y presión compra/venta.
  min_volumen_sol: 0
  min_buys: 12
  min_ops: 16
  min_presion_ratio: 1.6
  presion_seg: 5

  curva_96:
    enabled: true
    # Empieza a observar pronto; la compra la decide la banda 17k-18k.
    umbral: 0.50
    tope: 0.995
    buy_amount: 0
    max_compras: 0
    parar_tras_perdidas: 0
    min_compradores: 8
    min_compradores_ola: 3
    ventana_presion: 5.0
    min_presion_ratio: 1.6
    min_compra_sol: 0.20
    vela_seg: 1.0
    max_subida_vela: 0.35
    exigir_ver_creacion: false
    max_carteras_primer_bloque: 0
    max_sol_primer_bloque: 0
    max_bundle_pct: 0
    max_bundle_pct_sin_historia: 0
    heartbeat_interval: 300
  pumpfun_dev:
    enabled: false

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 12
