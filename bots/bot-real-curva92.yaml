    tope: 0.995
    buy_amount: 0
    max_compras: 0
    parar_tras_perdidas: 0
    min_edad_seg: 0
    max_edad_seg: 0
    vela_seg: 1.0
    max_subida_vela: 0.35
    exigir_ver_creacion: false
    max_carteras_primer_bloque: 0
    max_sol_primer_bloque: 0
    max_bundle_pct: 0.5
