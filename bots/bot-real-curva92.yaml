# ESTRATEGIA "CURVA 92%", pedida el 7-nov: "que compre cualquier moneda con
# presion compradora y volumen con bonding curve superada del 92%, sin mechas
# de un segundo o posible pump and dump, y mismo sistema de tp y sl".
# Generada a partir de bot-paper-dev1-bloque2.yaml (mismas comisiones,
# deslizamiento, reserva, stop -25%, venta a los 5 min si va en rojo, blacklist
# y auto-baneo por rugs, sin mayhem). Lo que cambia:
#   - ENTRADA (filters.curva_96): cualquier dev; curva >= 92% (y < 99,5%),
#     presion: >= 3 compradores distintos en 5 s, >= 1,5x compras/ventas y
#     >= 0,2 SOL comprados en esa ventana; >= 8 compradores en total.
#     SIN MECHA: no compra si sube mas de un 35% en una vela de 1 s.
#     ANTI PUMP&DUMP: no compra si los mayores titulares tienen > 50% (35% si
#     no se vio nacer).
#   - SALIDA (Manu eligio "mismo TP1 y resto al migrar"): TP1 +38% vende el
#     79,71% (recupera lo invertido +10%); el resto en 3 tramos iguales a
#     +60%, +100% y +150%. Sin tramos por market cap (a 92% la moneda ya va
#     por 30-35k).
#   - 15% del SOL libre por compra, tras el TP1 el stop a compra +5%, y para
#     tras 3 perdidas seguidas (igual que todas).
#   - node.max_rps 8: comparte Helius con las otras dos estrategias.
name: REAL CURVA 92% CON PRESION
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
enabled: false
separate_process: false
platform: pump_fun
