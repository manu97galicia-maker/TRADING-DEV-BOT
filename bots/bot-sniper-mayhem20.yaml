name: MAYHEM - dev >=25% migrado (min 2, sin techo), solo mayhem, 0,03 SOL, escalera x2/x3/x6/x7/x10, max 28s
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
# Multi-wallet: descomenta para repartir compras entre las 100 wallets
# wallets_json: wallets_generadas.json
enabled: false
separate_process: false
platform: pump_fun
trade:
  buy_amount: 0.025
  mayhem_buy_amount: 0.025
  # UNA SOLA A LA VEZ (pedido 26-ago, para empezar con cuidado). Sube a 3
  # cuando se vea como se comporta.
  max_posiciones: 2
  # TOPE DE POR VIDA (pedido 26-ago, al mandar fondos): 3 compras y para.
  max_real_buys: 3
  reiniciar_tanda: false
  # DOS PERDIDAS SEGUIDAS Y SE PARA (pedido 26-ago, igual que devmig). Como
  # esta estrategia es 100% mayhem, con esto sobra -- no hace falta ademas
  # mayhem_max_perdidas, que es el freno especifico para un bot que mezcla
  # mayhem y normales.
  max_perdidas_seguidas: 2
  mayhem_max_perdidas: 0
  # UN RUG Y BLOQUEADO PARA SIEMPRE (iba al valor por defecto del motor, 2;
  # ahora explicito e igual que devmig).
  rugs_para_bloquear: 1
  buy_slippage: 0.3
  sell_slippage: 0.9
  exit_strategy: tp_sl
  take_profit_percentage: 1.0
  take_profit_sell_percentage: 0.5
  tp2_gain: 2.0
  tp2_sell: 0.25
  tp3_gain: 3.0
  tp3_sell: 0.25
  tp4_gain: 0
  tp4_sell: 0
  tp5_gain: 0
  tp5_sell: 0
  # TRINQUETE (pedido 26-ago, igual que devmig): sin stop hasta el TP1, pero
  # en cuanto salta, el suelo sube al precio de compra; con el TP2 sube al
  # TP1, con el TP3 al TP2, y asi. Antes de esto no habia stop NUNCA -- se
  # podia ganar el TP1 y perderlo todo despues.
  # SIN STOP hasta el TP1; el trinquete tras cada TP SI se queda (pedido
  # 26-ago: se deshizo por error un momento antes).
  stop_loss_percentage: 0.80
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: true
  trailing_stop_percentage: 0
  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  venta_muerta_seg: 120
  venta_muerta_gain: 0.0
  # MAXIMO 28 SEGUNDOS ABIERTA (pedido 26-ago, antes 5400 = 90 min). Al
  # cumplirse se vende lo que quede, toque o no algun TP. Con la escalera
  # llegando hasta x10, los tramos altos (x6/x7/x10) van a quedar casi
  # siempre fuera de alcance en 28 s -- es la contrapartida de no quedarse
  # colgado en una mayhem que no se puede vender por panico.
  max_hold_time: 16
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.02
compute_units:
  buy: 140000
  sell: 120000
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 20000000
  extra_percentage: 0.0
  hard_cap: 20000000
retries:
  max_attempts: 2
  # ESPERA 15s ANTES DE COMPRAR, PARA EVITAR RUGS (pedido 26-ago). Da tiempo
  # a que un rug se note antes de meter dinero.
  wait_after_creation: 15
  wait_after_buy: 0
filters:
  listener_type: logs
  max_token_age: 60
  # SUBIDO de 3 a 30 (obligado por el wait_after_creation de arriba): la
  # edad se cuenta desde que nace la moneda, no desde que empieza a
  # vigilarse, asi que con la espera de 15s puesta, un max_buy_age de 3
  # habria hecho que TODA moneda llegara ya "caducada" a la vigilancia y no
  # se comprara nunca nada. Con 30, quedan ~15s reales de ventana.
  max_buy_age: 30
  # Mismo motivo que en mayhemsimple: el suelo de 3.400 no cuenta si ya
  # nacio ahi, solo si lo cruza despues del primer segundo.
  min_buy_age: 1
  match_string: null
  bro_address: null
  ignorar_listas_de_devs: false
  pumpfun_dev:
    enabled: true
    min_rate: 0.25
    min_migrations: 2
    # compra sin esperar confirmacion del mercado (6 carteras) -- entra de
    # primero en vez de decimo. Ver universal_trader.py:2205-2219.
    compra_inmediata: true
    timeout_seg: 2.0
  allow_mayhem: true
  require_mayhem: true
  marry_mode: false
  yolo_mode: true
  paper_trade: false
  # ENTRA SOLO SI YA SUPERA 3,4K (pedido 26-ago). El techo de 3.000 que
  # habia antes es INCOMPATIBLE con un suelo de 3.400 (min > max = nunca
  # compra nada), asi que se quita el techo -- igual que en mayhemsimple.
  min_entry_mc: 3450
  max_entry_mc: 3700
  min_curve_sol: 0
  min_volumen_sol: 0
  max_volumen_sol: 0
  min_vol_ventana_sol: 0
  min_presion_ratio: 3.0
  presion_seg: 3.0
  min_buys: 2
  min_ops: 0
  min_titulares: 0
  redes_originales: false
  min_holders_gmgn: 0
  senal_gmgn: []
  no_repeat_name_min: 5
  max_holder_pct: 0.05
  max_dev_hold_pct: 0.0
  min_holders: 0
  holder_bypass_ratio: 0
  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: solana
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6
cleanup:
  mode: post_session
  force_close_with_burn: false
  with_priority_fee: false
node:
  max_rps: 15
