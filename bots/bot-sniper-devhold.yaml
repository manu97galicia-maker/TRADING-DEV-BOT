# DEV CON PIEL EN EL JUEGO. Modo normal (compra al nacer), NO mayhem.
# Dos condiciones sobre el creador: que haya migrado 2+ monedas antes y que
# se quede con >= 10% del supply. La tesis es que un dev con historial y con
# su propio dinero dentro no tira la moneda a los dos minutos.
#
# Salida en escalera: se cobra pronto y se deja correr una cola cada vez mas
# pequena, hasta un 1% que solo se suelta en 800K.
name: "DEVHOLD - dev 2+ migraciones y >=10% supply, escalera 50/70/120/x3/x5"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
enabled: true
separate_process: false
platform: pump_fun

trade:
  buy_amount: 0.15
  mayhem_buy_amount: 0.15
  rugs_para_bloquear: 1
  nombre_estrategia: devhold
  max_posiciones: 3
  max_perdidas_seguidas: 999
  max_real_buys: 2
  reiniciar_tanda: false

  buy_slippage: 0.12
  sell_slippage: 0.9
  exit_strategy: tp_sl

  # ESCALERA POR MARKET CAP. Se expresa en MC y no en porcentaje para que el
  # "80% liquidado antes de 25K" se cumpla ENTRARAS DONDE ENTRARAS: un tramo
  # por porcentaje cae en un MC distinto segun a cuanto compraste, y con el
  # techo de entrada en 4.700 eso movia el ultimo escalon miles de dolares.
  #
  # El primer escalon si va por porcentaje: cubre el pop temprano que no llega
  # a 10K. Con entrada <= 4.700, +50% es como mucho 7.050, muy por debajo del
  # primer tramo de MC, asi que ninguno puede saltar en perdida.
  take_profit_percentage: 0.50      # +50%  -> suelta 20%
  take_profit_sell_percentage: 0.20
  tp2_gain: 0
  tp2_sell: 0
  tp3_gain: 0
  tp3_sell: 0
  tp4_gain: 0
  tp4_sell: 0
  tp5_gain: 0
  tp5_sell: 0

  mc_take_profit_tiers:
    - {target_mc: 10000,  sell: 0.20}
    - {target_mc: 14000,  sell: 0.20}
    - {target_mc: 20000,  sell: 0.20}   # <- aqui ya van 0,80 fuera, antes de 25K
    - {target_mc: 40000,  sell: 0.08}
    - {target_mc: 78000,  sell: 0.07}
    - {target_mc: 200000, sell: 0.03}
  # 0,20+0,20+0,20+0,20 = 0,80 liquidado en 20K. Luego 0,08+0,07+0,03 = 0,98
  # total, y el 2% que sobrevive solo se suelta en 800K.
  final_target_mc: 800000

  # EL TRINQUETE: cada TP sube el suelo al TP anterior. Cobrado el primer
  # escalon, la operacion ya no puede acabar en perdida.
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: true
  stop_al_tp_anterior: true
  stop_loss_percentage: 0.50
  # OJO: un 0 aqui NO desactiva el trailing -- el codigo hace
  # `trailing_stop_percentage or stop_loss_percentage`, asi que un 0 hereda el
  # stop loss en silencio. Por eso va escrito explicito.
  # Normal: dejar correr. Aguanta correcciones del 75% desde el pico,
  # que en la practica solo corta un desplome. Aqui mandan los suelos_por_mc.
  trailing_stop_percentage: 0.75

  # SUELOS QUE SUBEN Y NO BAJAN. El trinquete de los TP ya protege mientras
  # quedan escalones, pero la cola (3% hasta 78K y 1% hasta 800K) iba a pelo:
  # podia subir a 200K y volver a cero sin vender nada. Esto le pone red.
  suelos_por_mc:
    - {alcanza: 7000,   suelo: 5000}
    - {alcanza: 10000,  suelo: 7000}
    - {alcanza: 14000,  suelo: 10000}
    - {alcanza: 20000,  suelo: 14000}
    - {alcanza: 40000,  suelo: 25000}
    - {alcanza: 78000,  suelo: 50000}
    - {alcanza: 200000, suelo: 120000}
    - {alcanza: 400000, suelo: 250000}

  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  venta_muerta_seg: 120
  venta_muerta_gain: 0.0
  max_hold_time: 0
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.02

compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 5000000
  extra_percentage: 0.0
  hard_cap: 5000000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: logs
  max_token_age: 30
  max_buy_age: 15
  # MODO NORMAL, sin mayhem.
  allow_mayhem: false
  require_mayhem: false
  marry_mode: false
  yolo_mode: true
  ignorar_listas_de_devs: false
  no_repeat_name_min: 2
  match_string: null

  # El dev se queda con al menos el 10% del supply.
  # TECHO DE ENTRADA: no comprar por encima de 4.700 de market cap.
  max_entry_mc: 4700
  min_dev_hold_pct: 0.10

  # Y tiene historial: 2 monedas migradas como minimo.
  pumpfun_dev:
    enabled: true
    min_migrations: 2
    min_rate: 0.10
    compra_inmediata: true
    timeout_seg: 2.0

  dev_buy:
    min_sol: 0
