name: "SWING - escaladores lentos (edge real, entra 1-3s HOLD ~54s)"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false               # DESACTIVADO 2026-07-26: mediana <15K = dinero muerto (backtest)
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.1
  buy_slippage: 0.15
  sell_slippage: 0.30

  exit_strategy: "tp_sl"
  # Salida escalonada vendiendo la MITAD del restante en cada nivel:
  take_profit_percentage: 0.5  # +50%  -> vende 50% (mitad del restante)
  take_profit_sell_percentage: 0.40
  tp2_gain: 1.5  # +100% -> vende 25% (mitad del restante -> queda 1/4)
  tp2_sell: 0.25
  tp3_gain: 3.0  # +200% -> vende 12.5% (mitad del restante)
  tp3_sell: 0.15  # moonbag final = 12.5% corre libre
  stop_loss_percentage: 0.40  # SL -30% (los escaladores no dumpean <10s, deja respirar)
  max_hold_time: 120                 # 2 min: el pico medio es ~54s, no aguantar tokens muertos
  price_check_interval: 2

  extreme_fast_mode: false
  extreme_fast_token_amount: 20

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 50_000_000        # 0.005 SOL/tx
  extra_percentage: 0.0        # (el move pasa DESPUES de entrar, latencia irrelevante)
  hard_cap: 50_000_000

# CRITICO: entrada RAPIDA. Antes (default 15s) compraba tarde -> el TP nunca
# disparaba porque el token ya habia subido. Ahora entra en ~2s (como el backtest).
retries:
  wait_after_creation: 6       # 2s tras creacion (antes 15s) -> captura la subida
  wait_after_buy: 0            # sin retraso: el monitor de venta arranca ya

filters:
  listener_type: "logs"        # logs basta: tienes ~50s, no necesitas geyser caro
  max_token_age: 30            # entra en los primeros ~10s
  match_string: null

  # 90 devs por ROI esperado (~150-200 lanzamientos/dia, +14.5% ROI backtest)
  bro_address: "top_devs_200.json"

  marry_mode: false
  yolo_mode: true              # continuo: snipea cada lanzamiento de los devs
  paper_trade: false           # <<< EN VIVO (REAL). Pon true para volver a simulacion.
  min_curve_sol: 0.5           # bajado: con entrada a 2s la curva tiene menos SOL aun
  max_holder_pct: 0.05         # no comprar si un holder (no-curva) tiene >5% del supply
  max_entry_mc: 3500  # no comprar si el MC ya supera $4K (evita entrar en spikes)
  min_holders: 6            # no comprar si hay <5 poseedores (bundle/no organico)
  holder_bypass_ratio: 3       # permite holder >5% si la MEDIANA del dev >= 3x el MC actual (hay recorrido)

  buy_on_dex_paid:
    enabled: false

  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 12
