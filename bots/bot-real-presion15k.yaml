# CAMBIO DEL 7-NOV (Manu: "haces a veces 7 ventas, no hagas tantas que nos
# funden a comision, haz 3" y "en total busco un 75% roi y stop ponlo al 18%
# y elimina el filtro de market cap y sube un poco volumen y presion"):
#   - 3 VENTAS como mucho: TP1 +38% vende el 79,71% (recupera lo invertido,
#     como antes), +55% la mitad del resto y +75% lo que queda.
#   - STOP -18% (antes -25%).
#   - SIN FILTRO DE MARKET CAP (min_entry_mc 0, antes 15300). Sigue mirando
#     desde la curva al 75% (~12,7k con SOL a 90 $): eso no se ha tocado.
#   - PRESION un poco mas alta: 4 compradores / 1,6x / 0,6 SOL -> 5 / 1,8x / 0,8 SOL.
# ESTRATEGIA "PRESION SUAVE DESDE 15,3K", pedida el 7-nov: "anade una de
# presion compradora pero no tan estricta pero a partir de los 15.3k mc".
# Generada a partir de bot-real-presion6k.yaml (mismas comisiones,
# deslizamiento, reserva, 15% del SOL libre, stop -25%, tras el TP1 stop a
# compra +5%, venta a los 5 min si va en rojo, para tras 3 perdidas seguidas,
# sin mayhem, blacklist y auto-baneo por rugs, sin limite de posiciones).
# Lo que cambia:
#   - ENTRADA: se empieza a mirar con la curva al 75% (~12,8k con SOL a
#     91 $; si SOL pasa de ~109 $ el 75% ya cae por encima de 15,3k y se
#     entra algo mas arriba, nunca por debajo) y se compra
#     cuando el market cap pasa de 15.300 $ (min_entry_mc, en un plazo de
#     120 s) con presion MAS SUAVE que la de 6k: >= 4 compradores distintos
#     en 5 s (6k pide 5), >= 1,6x compras/ventas (6k: 1,8x) y >= 0,6 SOL
#     comprados en esa ventana (6k: 0,8 SOL); >= 6 compradores en total (6k:
#     8). Mismos frenos: sin mecha de 1 s (> 35%) y titulares <= 50%.
#   - SALIDA: TP1 +38% (79,71%, recupera lo invertido +10%) y el resto en
#     +60% / +100% / +150%, como la curva 92%. NO los tramos por market cap
#     de 7k-19k: entrando a 15,3k, el TP1 salta por encima de ~21k y esos
#     tramos se venderian todos de golpe justo despues.
name: REAL PRESION SUAVE DESDE 15,3K
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
enabled: false
separate_process: false
platform: pump_fun
trade:
  nombre_estrategia: real-presion15k
  buy_amount: 0.25
  buy_amount_usd: 0
  # 7-nov: "20% por operacion" (antes 0.15).
  fraccion_saldo: 0.20
  fraccion_base: libre
  min_reserve_sol: 0.03
  max_posiciones: 0
  max_real_buys: 1000
  reiniciar_tanda: false
  buy_slippage: 0.35
  sell_slippage: 0.35
  sell_slippage_proteccion: 0.5
  exit_strategy: tp_sl
  stop_loss_percentage: 0.18
  take_profit_percentage: 0.38
  take_profit_sell_percentage: 0.7971014493
  mc_take_profit_tiers: []
  stop_a_entrada_tras_tp: true
  margen_stop_tras_tp: 0.05
  max_perdidas_seguidas: 3
  stop_al_tp_tras_tp: false
  vender_todo_en_stop: true
  mc_stop_loss: 0
  max_hold_time: 0
  venta_muerta_seg: 300
  venta_muerta_gain: 0.0
  price_check_interval: 1
  # 7-nov "haz 3 ventas" y "en total busco un 75% roi": TP1 +38% (79,71%),
  # +55% y +75% (mitad y mitad del resto).
  tp2_gain: 0.55
  tp2_sell: 0.1014492754
  tp3_gain: 0.75
  tp3_sell: 0.1014492753
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount_compra: 110000000
  fixed_amount: 5714286
  fixed_amount_venta_proteccion: 42424243
  extra_percentage: 0.0
  hard_cap: 110000000
retries:
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0
filters:
  listener_type: logs
  yolo_mode: true
  paper_trade: false
  paper_watch_secs: 600
  max_token_age: 5
  max_entry_mc: 0
  max_buy_age: 120
  allow_mayhem: false
  require_mayhem: false
  ignorar_listas_de_devs: false
  min_first_block_buys: 0
  max_first_block_buys: 0
  min_first_block_usd: 0
  max_first_block_usd: 0
  buy_from_second_block: false
  second_block_confirmation:
    enabled: false
    min_buyers: 0
    min_buy_sol: 0
    min_net_sol: 0
    max_sells: 0
  curva_96:
    enabled: true
    tope: 0.995
    buy_amount: 0
    max_compras: 0
    parar_tras_perdidas: 0
    min_edad_seg: 0
    max_edad_seg: 0
    vela_seg: 1.0
    max_subida_vela: 0.35
    exigir_ver_creacion: false
    # 7-nov, Manu con la captura de LAGER (de ~2,5k a ~27k en el primer
    # segundo y el dev lo vende todo a los 2 min): "no me compres este
    # tipo". Estaban a 0 (apagados) porque venian copiados de dev1, no
    # porque se pidiera. Se ponen los valores por defecto del codigo: si
    # en el bloque de creacion compran mas de 3 carteras o entran mas de
    # 2 SOL, es bundle y no se compra.
    max_carteras_primer_bloque: 3
    max_sol_primer_bloque: 2.0
    max_bundle_pct: 0.5
    max_bundle_pct_sin_historia: 0.35
    heartbeat_interval: 300
    umbral: 0.75
    min_compradores: 6
    # 7-nov "anade un poco mas de presion compradora y volumen" (eligio
    # "un poco"): antes 3 / 1.3 / 0.3. Y "un poquito mas": 1.5 / 0.5 -> 1.6 / 0.6.
    # 7-nov "sube un poco": 4 / 1.6 / 0.6 -> 5 / 1.8 / 0.8.
    min_compradores_ola: 5
    ventana_presion: 5.0
    min_presion_ratio: 1.8
    min_compra_sol: 0.8
  pumpfun_dev:
    enabled: false
  # 7-nov "elimina el filtro de market cap" (antes 15300).
  min_entry_mc: 0
cleanup:
  mode: post_session
  force_close_with_burn: false
  with_priority_fee: false
node:
  max_rps: 8
