# MAYHEMSIMPLE - pedida 26-ago, a partir de una captura de un screener con
# dos campos rellenos: Edad max 0,08 min (~4,8 s) y MKT Cap min 3,4K. Todo lo
# demas (liquidez, volumen, compra neta, TXs, dev...) vacio a proposito.
#
# SIN FILTRO DE CREADOR NINGUNO -- ni pumpfun_dev, ni dev_elite, ni
# dev_mediana, ni dev_buy. Las otras tres estrategias (devmig, mayhem,
# devbuy) apuestan por QUIEN lanza; esta apuesta solo por que la moneda YA
# ha llegado a 3.400 $ con menos de 5 s de vida -- si arranco tan rapido,
# alguien la esta comprando fuerte AHORA MISMO, sin que importe quien la
# creo. Es la mas simple de las cuatro, y tambien la menos informada: no
# distingue un pump real de un bundle que se infla solo entre carteras del
# mismo dueño.
#
# NUMEROS SIN VALIDAR: 0 operaciones reales con este filtro.
name: "MAYHEMSIMPLE - mayhem+dev>=30%, 0,025 SOL, TP40/80/150/400/650+50kMC, SL30%"
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
enabled: true
separate_process: false
platform: pump_fun
trade:
  buy_amount: 0.035
  mayhem_buy_amount: 0.035
  max_posiciones: 1
  max_real_buys: 0
  reiniciar_tanda: false
  max_perdidas_seguidas: 22
  buy_amount_tras_sl: 0.025
  mayhem_max_perdidas: 0
  rugs_para_bloquear: 2
  buy_slippage: 0.3
  sell_slippage: 0.9
  exit_strategy: tp_sl
  # TP1 +50% 20% | TP2 +100% 29% | TP3 +175% 20% (~$10k MC)
  # TP4 +400% 14% (~$20k MC) | TP5 +650% 14% (~$30k MC) | moonbag 3% en $50k MC
  take_profit_percentage: 0.50
  take_profit_sell_percentage: 0.20
  tp2_gain: 1.00
  tp2_sell: 0.29
  tp3_gain: 1.75
  tp3_sell: 0.20
  tp4_gain: 4.00
  tp4_sell: 0.14
  tp5_gain: 6.50
  tp5_sell: 0.14
  # SL -30%; trinquete: TP1 -> SL sube a precio de compra; TP2+ -> SL sube al TP anterior
  stop_loss_percentage: 0.85
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: true
  trailing_stop_percentage: 0
  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  venta_muerta_seg: 120
  venta_muerta_gain: 0.0
  max_hold_time: 20
  final_target_mc: 50000
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.01
compute_units:
  buy: 140000
  sell: 120000
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 20000000
  extra_percentage: 0.0
  hard_cap: 20000000
retries:
  max_attempts: 2
  # ESPERA 15s ANTES DE COMPRAR, PARA EVITAR RUGS (pedido 26-ago). Con
  # max_buy_age en 30 (edad contada desde que nace la moneda) quedan ~15s
  # reales de ventana tras la espera para cruzar los 3.450$.
  wait_after_creation: 0
  wait_after_buy: 0
filters:
  listener_type: logs
  # EDAD: los dos numeros del screener, sin margen de mas.
  max_token_age: 5
  # VENTANA 1-30s (pedido 26-ago, ampliada desde 1-2s): compra en el
  # instante exacto en que cruce 3.400$ en cualquier punto de los primeros
  # 30s -- la comprobacion es cada 0,15s y compra nada mas cumplir, no
  # espera a que acabe la ventana.
  max_buy_age: 36
  # NO CUENTA SI YA NACIO POR ENCIMA: el suelo de 3.400 solo vale si lo
  # cruza DESPUES del primer segundo, no si ya abre ahi. Nacer ya inflada es
  # la senal de un dev-buy grande o un bundle, no de demanda real subiendo
  # -- ver universal_trader.py, "EDAD MINIMA PARA CONTAR EL SUELO".
  min_buy_age: 0
  match_string: null
  bro_address: null
  ignorar_listas_de_devs: false
  pumpfun_dev:
    enabled: true
    min_rate: 0.30
    min_migrations: 1
  allow_mayhem: true
  require_mayhem: true
  marry_mode: false
  yolo_mode: true
  paper_trade: false
  # MKT CAP: el otro numero del screener. Sin techo -- el campo Max del
  # screener estaba vacio.
  min_entry_mc: 3200
  max_entry_mc: 4500
  min_curve_sol: 0.3
  min_volumen_sol: 0
  max_volumen_sol: 0
  min_vol_ventana_sol: 0
  min_presion_ratio: 2.0
  presion_seg: 3.0
  min_buys: 2
  ultimas_tx_compra: 3
  min_ops: 8
  min_titulares: 4
  redes_originales: false
  min_holders_gmgn: 0
  senal_gmgn: []
  no_repeat_name_min: 5
  max_holder_pct: 0.05
  max_dev_hold_pct: 0.0
  min_holders: 0
  holder_bypass_ratio: 0
  dev_buy:
    min_sol: 0
  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: solana
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6
cleanup:
  mode: post_session
  force_close_with_burn: false
  with_priority_fee: false
node:
  max_rps: 15
