# CUNA — snipear en el nacimiento, sin stop
#
# Compra CUALQUIER lanzamiento entre $2.040 y $2.600 de market cap, o sea en los
# primeros segundos, antes de que entre nadie. Sin stop-loss.
#
# ─────────────────────────────────────────────────────────────────────────────
# EL SUELO DE $1.000 QUE PIDIO MANU NO EXISTE
# ─────────────────────────────────────────────────────────────────────────────
# El market cap minimo posible en pump.fun es $2.040: la curva arranca con
# reservas virtuales fijas (30 SOL / 1.073e9 tokens) y ninguna moneda puede
# valer menos que eso. La banda util es 2.040-2.600, que en SOL de curva son
# 0 a 3,86.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE NO LLEVA STOP (y donde esta el riesgo de verdad)
# ─────────────────────────────────────────────────────────────────────────────
# El razonamiento de Manu es correcto en su parte: comprando pegado al suelo de
# la curva, el precio casi no puede caer -- no hay sitio. Un stop ahi solo
# sacaria de operaciones por ruido.
#
# Pero el riesgo no es el precio, son las COMISIONES. Cada operacion que no
# sube cuesta:
#
#   2,25% x2 de pump.fun sobre 0,30 SOL ...... 0,0135 SOL
#   prioridad (20M) + red .................... 0,0041
#   ────────────────────────────────────────────────────
#   por operacion muerta ..................... 0,0176 SOL  = 5,9%
#
# Con 50 operaciones muertas se van 0,88 SOL. Como esta estrategia compra TODO
# lo que nace, van a ser muchas: hace falta que aproximadamente 1 de cada 12
# haga +100% solo para no perder dinero.
#
# La prioridad se baja de 100M a 20M justo por esto: aqui no se compite por una
# moneda concreta -- se compra todo -- asi que pagar por aterrizar antes no
# aporta y esos 0,0068 SOL de diferencia por operacion si se notan al cabo de
# cien compras.

name: "CUNA - nacimiento 2-2,6K sin stop"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false      # apagada 5-ago: Manu deja SOLO la de DEV30
separate_process: false
platform: "pump_fun"

trade:
  buy_amount: 0.30
  buy_slippage: 0.15
  sell_slippage: 0.90

  exit_strategy: "tp_sl"
  # +100% la mitad · +200% un cuarto · +400% el ultimo cuarto. Sin moonbag:
  # 50 + 25 + 25 = 100%. Si no llega al +200%, lo que quede sale por tiempo.
  take_profit_percentage: 1.00
  take_profit_sell_percentage: 0.50
  tp2_gain: 2.00
  tp2_sell: 0.25
  tp3_gain: 4.00
  tp3_sell: 0.25
  tp4_gain: 0
  tp4_sell: 0

  # ANTI-RUG. Se deja aunque no haya stop, porque no es un stop de precio: mira
  # si el dev esta VOLCANDO (ventas > 2x compras en 4 s) y sale antes de que la
  # curva se vacie. Es la unica proteccion que queda, y sin ella una moneda que
  # se hunde solo se suelta al cumplirse el tiempo.
  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3

  # 0.95 = practicamente sin stop. No se pone 0 porque el bot lo interpretaria
  # como "vender de inmediato"; con 0,95 haria falta un -95% para disparar, que
  # comprando en el suelo de la curva no puede pasar.
  stop_loss_percentage: 0.95
  max_hold_time: 600          # sin stop, el tiempo es la unica salida
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.05

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 20_000_000
  extra_percentage: 0.0
  hard_cap: 20_000_000

retries:
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  max_token_age: 60
  max_buy_age: 3              # menos de 3 segundos de vida

  match_string: null
  bro_address: null

  allow_mayhem: false
  marry_mode: false
  yolo_mode: true
  paper_trade: false          # DINERO REAL

  # Banda 2-3K (Manu, 5-ago). El suelo de 2.000 no recorta nada: el market cap
  # minimo posible en pump.fun es $2.040 (curva vacia), asi que quien manda es
  # el techo.
  min_entry_mc: 2000
  max_entry_mc: 3000
  min_curve_sol: 0

  # Sin titulares ni señal: a los 3 segundos GMGN no conoce a 1 de cada 3
  # monedas y la señal aun no ha saltado. El volumen si vale porque lo cuenta
  # el propio bot de la cadena, en el instante.
  # 10 SOL = ~$730 movidos en esos 3 segundos.
  #
  # Manu pidio 19 SOL (~1,4K) con el techo en $2.800, y esos dos numeros son
  # incompatibles: en una bonding curve el volumen y el market cap son la misma
  # magnitud, asi que 19 SOL de compras dejan la curva en $4.390, por encima
  # del techo. Lo unico que puede tener 19 SOL de volumen y seguir por debajo
  # de $2.800 es una moneda donde un tercio largo del movimiento ya son VENTAS.
  #
  # Medido en vivo sobre 242 lanzamientos seguidos (5-ago, 10 min), a los 3 s
  # y con el resto de filtros puestos (8 tx, 5 titulares, MC <= 2.800):
  #
  #   volumen >= 19 SOL ....  0 de 242   (0,0%)  <- no compraria nunca
  #   volumen >= 14 SOL ....  2 de 242   (0,8%)
  #   volumen >= 10 SOL ....  4 de 242   (1,7%)  <- puesto
  #   volumen >=  6 SOL ....  7 de 242   (2,9%)
  #
  # Manu elige mantener el techo barato y bajar el volumen (5-ago).
  min_volumen_sol: 10

  # 6 TRANSACCIONES MINIMAS, tambien si van en bundle en el primer bloque: el
  # bot lee cada TradeEvent del log por separado, asi que un bundle de 6 cuenta
  # como 6. Esto es lo que separa "14 SOL movidos" de "14 SOL que se metio el
  # creador el solo en una compra" -- el segundo caso pasa el filtro de dinero
  # sin que haya entrado nadie. Medido: el 30% de los lanzamientos llega a 6 tx
  # en 3 s y el 24% a 6 tx + 5 titulares, asi que este par por si solo no es lo
  # que cierra el grifo.
  min_ops: 8

  # 8 TITULARES: wallets distintas cuyas compras superan a sus ventas, contadas
  # del mismo stream. No se usa GMGN aqui a proposito: tarda 1,3 s y a los 3
  # segundos de vida no conoce a 1 de cada 3 monedas, o sea que llegaria tarde
  # y ademas fallaria. Esto cuesta cero y esta disponible en el instante.
  #
  # Medido sobre 242 lanzamientos con el resto de filtros puestos, subir de 5 a
  # 8 titulares cuesta poco y a partir de ahi se cae en picado:
  #
  #   >=  5 titulares ....  5 de 242  (2,1%)
  #   >=  8 titulares ....  3 de 242  (1,2%)   <- puesto
  #   >= 10 titulares ....  1 de 242  (0,4%)
  #   >= 12 titulares ....  0 de 242  (0,0%)
  #
  # 8 es el ultimo escalon que no vacia el filtro: de 6 a 8 no se pierde ni una
  # sola moneda, o sea que las que traen 6 compradores suelen traer 8.
  min_titulares: 8

  # REDES SOCIALES PROPIAS (Manu, 5-ago). Se lee el JSON del `uri` que trae el
  # propio lanzamiento y se exige que haya un enlace a una CUENTA -- no al tuit
  # de otro -- y que esa cuenta no la haya usado ya otra moneda en 6 horas.
  #
  # Lo que se ve en las monedas reales es que casi todas las "redes" son un
  # enlace al post de un tercero (x.com/Cointelegraph/status/..., un tuit de
  # jackbutcher, etc.): el que lanza se cuelga de algo que ya tiene alcance.
  # Eso no es la red social de la moneda.
  #
  # No cuesta latencia: la descarga se lanza en cuanto aparece la moneda y se
  # recoge cuando ya han pasado los demas filtros, o sea 2-3 segundos despues.
  redes_originales: true
  redes_timeout: 1.5

  max_volumen_sol: 0
  min_vol_ventana_sol: 0
  min_holders_gmgn: 0
  senal_gmgn: []

  no_repeat_name_min: 5
  max_holder_pct: 0.0
  max_dev_hold_pct: 0.0
  min_holders: 0
  holder_bypass_ratio: 0

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 15
