# DEV CON MIGRADAS + PRIMER BLOQUE + ENTRADA EN EL SEGUNDO BLOQUE.
# Creada el 3-nov, pedido: "creen una estrategia que sea snipear las monedas
# con el developer que tenga un minimo 1% de proyectos migrados y que en el
# primer bloque haya dos compras minimo y por un volumen minimo de $375.
# Pagamos 6 centimos de fees, de priority fees, para entrar de primeros en el
# segundo bloque."
#
# CAMBIADA EL 4-nov, pedido: "que se compren por debajo de 4.1k, 1% de
# proyectos minimos del dev migrado, y comprar en el segundo bloque 30$ de
# solana pagando 0.06$ buy fee priority. TP 38% recuperas iniciales +10% y lo
# que sobre lo vendes en tres tramos hasta los 14k. SL 25%."
# Lo que cambio: 20 $ -> 30 $, tope de entrada 4,1k (nuevo), stop 8% -> 25%,
# y la salida entera (ya no es la de la hermana).
# (El tope de entrada se quito el 5-nov: "Elimina lo del mcap".)
# Y EL 4-nov POR LA TARDE: "Pon 0.2 sol para solventar el problema y quita lo
# de 375". 30 $ -> 0,2 SOL fijos, y el primer bloque sin minimo de dolares.
#
# VUELVE A PAPER EL 5-nov para validar la ventana exacta de 1-2 segundos sin
# mover SOL. El nombre del fichero conserva el mismo estado historico.
#
# LO QUE NO SE PIDIO Y SE HA TENIDO QUE ELEGIR, para poder cambiarlo luego:
#   - 0,03 SOL de reserva: sin ella no queda SOL para pagar la comision de
#     vender.
name: "PAPER DEV 1% + EDAD 1-2 S"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
# En false a proposito: `enabled` solo lo mira el arranque de "todas"
# (bot_runner.py). Esta se lanza sola con run_bot_process, y asi no se cuela
# junto a las otras estrategias sobre la misma wallet.
enabled: TRUE
separate_process: false
platform: "pump_fun"

trade:
  nombre_estrategia: "paper-dev1-bloque2"
  # 0,25 SOL FIJOS, pedido el 6-nov por la noche ("... y compre 0.25 sol").
  # Venia de 0,1. Cada compra aparta 0,25 x 1,35 + 0,003 = 0,3405 SOL del
  # saldo mientras se hace.
  #
  # (HISTORIA) 0,1 SOL FIJOS, pedido el 6-nov: "0.1 compra". Venia de 0,15 (pedido ese
  # mismo dia con "0.15 por compra y volumen 200"; antes 0,2). Cada compra
  # aparta 0,1 x 1,35 (deslizamiento) + 0,003 = 0,138 SOL del saldo mientras
  # se hace.
  #
  # (HISTORIA) 0,2 SOL FIJOS, pedido el 4-nov: "Pon 0.2 sol para solventar el problema".
  # Venia de buy_amount_usd: 30. EN DOLARES EL BOT NO COMPRA hasta haber leido
  # el precio de SOL (universal_trader.py: "Mientras el precio no se haya
  # confirmado NO SE COMPRA"), y si el droplet no llega a la web de precios,
  # no compra nunca. En SOL fijos el importe sale de `buy_amount` y no
  # depende de ningun precio. 0,2 SOL son unos 21 $ con el SOL a 105 $.
  # 15% DEL SALDO DE SOL POR COMPRA, pedido el 7-nov ("compra en todas 15%
  # del balance", y Manu confirmo que tambien esta). Venia del 35%. Con tres
  # estrategias sobre la misma wallet, cada una coge el 15% de lo libre.
  #
  # (HISTORIA) 35% DEL SALDO DE SOL POR COMPRA, pedido el 6-nov por la noche ("35% sol
  # balance"). Venia del 50% (pedido un rato antes con "50% del sol
  # balance"; antes, 0,25 SOL fijos). Manda `fraccion_saldo` y
  # `buy_amount` ya no se usa (se deja escrito por si se vuelve a fijos).
  # Base "libre": el 50% del SOL GASTABLE de la wallet = saldo - 0,03 de
  # reserva - lo que este apartado por compras en curso. Por eso cada compra
  # sale mas pequena que la anterior mientras haya posiciones abiertas. Con
  # 0,497 SOL: 1a ~0,163, 2a ~0,10, 3a ~0,06... Al vender, el SOL vuelve y
  # la siguiente compra vuelve a ser grande.
  # Lo que cuesta: la comision de prioridad (0,0141 SOL) es fija, asi que en
  # las compras pequenas pesa mucho.
  buy_amount: 0.25
  buy_amount_usd: 0
  fraccion_saldo: 0.15
  fraccion_base: "libre"
  min_reserve_sol: 0.03
  # SIN LIMITE DE OPERACIONES SIMULTANEAS, pedido el 7-nov: "pon sin limite
  # de operaciones simultaneas". Venia de 7 (4-nov). Con 0 manda el SALDO:
  # cada compra es el 15% del SOL libre y no se compra por debajo de la
  # reserva. El codigo guarda un tope de seguridad de 40
  # (universal_trader.py, TOPE_DURO_POSICIONES) contra un fallo raro.
  # Ojo: el nodo vigila bien unas max_rps / 2 posiciones a la vez (7 con 14);
  # con mas, cada una se mira algo menos a menudo.
  max_posiciones: 0
  # DEVS BUENOS GUARDADOS, pedido el 7-nov: "Junta en una lista todos los
  # buenos dev que tenemos guardados que suelen superar 15k mc" + "tambien
  # para comprar". A los de esta lista se les compra AUNQUE NO LLEGUEN al 10%
  # de migradas (para eso `pumpfun_dev.strict_only: false`). Siguen mandando
  # la edad (8 s), sin mayhem, la blacklist manual y el auto-baneo por rugs.
  devs_marcados: "devs_buenos_15k.json"
  # Los marcados NO se saltan el auto-baneo por rugs ("bloc dev rugs",
  # 6-nov). Sin esta linea se lo saltarian (es lo que hace el codigo por
  # defecto, pensado para otras estrategias).
  marcados_saltan_baneo: false
  max_real_buys: 1000
  reiniciar_tanda: FALSE
  # DESLIZAMIENTO 35% AL COMPRAR Y AL VENDER, pedido el 6-nov: "Pon buy
  # slippage y sell 35%". Venian de 15% (compra) y 25% (venta). Motivo: la
  # compra de coolcoin (2mEumt...) paso los filtros y fallo al confirmarse.
  # Lo que cuesta: en una moneda que sube muy rapido se puede pagar hasta un
  # 35% por encima del precio que vio el bot, y en la venta aceptar hasta un
  # 35% por debajo.
  buy_slippage: 0.35
  sell_slippage: 0.35
  # SUELO ANCHO SOLO PARA EL STOP (4-nov, "Si"; igual que bot-unica123-real).
  # En un desplome el precio se mueve mas de lo normal entre que se decide
  # vender y la venta aterriza: con el suelo normal la venta se cae y te
  # quedas dentro. El stop acepta vender hasta un 50% por debajo para salir
  # seguro. Los TP usan el 35% de arriba.
  sell_slippage_proteccion: 0.50
  exit_strategy: "tp_sl"
  # SALIDA (4-nov). Stop -25%.
  #
  # DOS SALIDAS SEGUN EL DEV, pedido el 7-nov: "mantén la estrategia actual
  # ... take profit como teniamos; si en la lista hay alguno que supere
  # habitualmente los 30k haces lo de recuperar iniciales al 45% de ganancia
  # y dejas correr el resto en cuatro ventas".
  #
  # 1) LA DE SIEMPRE (aqui abajo), para todos menos los de devs_30k.json. Es
  #    la del 6-nov por la tarde (Manu eligio "+38% y 5 tramos a 19k"):
  #    TP1 a +38% vende el 79,71% (1,10 / 1,38): recupera lo invertido +10%.
  #    El 20,29% que queda sale por market cap:
  #        7.000 $ -> 30%   9.000 $ -> 30%   12.000 $ -> 15%
  #       15.000 $ -> 15%  19.000 $ -> 10%   (del resto)
  # 2) LA DE LOS DEVS DE 30K+ (filters.dev_elite, mas abajo): TP1 a +45%
  #    vende el 68,97% (1 / 1,45): recupera justo lo invertido. El 31,03%
  #    que queda, en 4 partes iguales a 30k / 45k / 60k / 80k (Manu eligio
  #    estos niveles).
  # Los porcentajes son DE LA POSICION ORIGINAL (universal_trader.py: "Sell
  # fractions are relative to the original buy"), y los tramos solo se arman
  # cuando ya ha saltado el TP1. Los market caps son dolares de verdad (precio
  # de SOL del momento).
  stop_loss_percentage: 0.25
  take_profit_percentage: 0.38
  take_profit_sell_percentage: 0.7971014493
  mc_take_profit_tiers:
    - target_mc: 7000
      sell: 0.0608695652
    - target_mc: 9000
      sell: 0.0608695652
    - target_mc: 12000
      sell: 0.0304347826
    - target_mc: 15000
      sell: 0.0304347826
    # El ultimo redondea hacia arriba para que no quede polvo sin vender.
    - target_mc: 19000
      sell: 0.0202898552
  # TRAS EL TP1 EL STOP SE MUEVE A COMPRA +5%, pedido el 7-nov: "cuando
  # salga tp1 el sl se mueve a precio compra mas algo de ganancias" (Manu
  # eligio +5%). Venia de justo el precio de compra (6-nov).
  stop_a_entrada_tras_tp: true
  margen_stop_tras_tp: 0.05
  # PARAR TRAS 3 PERDIDAS SEGUIDAS, pedido el 7-nov: "si alguna estrategia
  # falla o nos da negativo tres resultados la paras". Deja de comprar hasta
  # el siguiente arranque; lo abierto se sigue vendiendo.
  max_perdidas_seguidas: 3
  stop_al_tp_tras_tp: false
  vender_todo_en_stop: true
  mc_stop_loss: 0
  max_hold_time: 0
  # VENTA A LOS 5 MINUTOS SI ESTA POR DEBAJO DEL PRECIO DE COMPRA, pedido el
  # 6-nov por la noche: "vender si a los cinco minutos esta por debajo del
  # precio de compra". Venia de 60 s ("Y vende si al minuto la moneda esta
  # muerta").
  # A los 300 s de comprar, si el precio esta POR DEBAJO del de compra, se
  # vende entera. Si esta igual o por encima, se la deja correr y ya no se
  # vuelve a mirar: mandan el TP y el stop. Se mira una sola vez
  # (universal_trader.py, "MONEDA MUERTA": vende si sube < venta_muerta_gain).
  venta_muerta_seg: 300
  venta_muerta_gain: 0.0
  price_check_interval: 1

# 0,011 SOL DE PRIORIDAD EN LA COMPRA, pedido el 6-nov por la noche:
# "0.011 de prioridad". Venia de 0,014142857 SOL (baja):
#     11.000.000 lamports / 100.000 unidades = 110.000.000 microlamports
# Unos 0,99 $ por compra con el SOL a 89,86 $. `hard_cap` se ajusta a lo
# mismo (110.000.000).
#
# (HISTORIA) +0,005 SOL OTRA VEZ, pedido el 6-nov por la noche ("sube 0.005 la
# prioridad de compra"). Venia de 0,009142857 SOL; ahora 0,014142857 SOL:
#     14.142.857 lamports / 100.000 unidades = 141.428.571 microlamports
# Unos 1,27 $ por compra con el SOL a 89,86 $ (5,7% de una compra de 0,25).
# `hard_cap` sube con ella a 141.428.571 para que no se recorte.
#
# (HISTORIA) +0,005 SOL MAS, pedido el 6-nov por la tarde: "Sube 0.005 sol las
# prioridades de compra". Venia de 0,004142857 SOL; ahora 0,009142857 SOL
# por compra:
#     9.142.857 lamports / 100.000 unidades = 91.428.571 microlamports
# Unos 82 centimos con el SOL a 89,86 $. Se paga tambien en las compras que
# fallan. Para que no se recorte hubo que subir `hard_cap` (el codigo recorta
# la de la compra a ese tope): 42.424.243 -> 91.428.571.
#
# (HISTORIA) +0,003 SOL DE PRIORITY FEE EN LA COMPRA, pedido el 6-nov: "sube 0.003 mas
# la comision de comprar con prioridad". Venia de 0,001142857 SOL (los 12
# centimos de abajo); ahora 0,004142857 SOL por compra:
#     4.142.857 lamports / 100.000 unidades = 41.428.571 microlamports
# Unos 37 centimos con el SOL a 89,86 $ (43 con el SOL a 105 $). Se paga
# tambien en las compras que fallan (van sin simulacion previa). Queda por
# debajo de `hard_cap` (42.424.243), asi que no se recorta.
#
# (HISTORIA) 12 CENTIMOS DE PRIORITY FEE EN LA COMPRA, pedido el 5-nov: "Sube a 12
# centimos". Venia de 6 (pedido el 3-nov). Es lo que pagaba bot-unica123-real
# en real. El bot no cobra en dolares: cobra microlamports por unidad de
# computo, y la compra reserva 100.000 unidades
# (pumpfun/instruction_builder.py, get_buy_compute_unit_limit). Con el SOL a
# 105 $:
#     0,12 $ / 105 $ = 0,001142857 SOL = 1.142.857 lamports
#     1.142.857 lamports / 100.000 unidades = 11,428571 lamports por unidad
#                                           = 11.428.571 microlamports
# OJO, son 12 centimos SOLO con el SOL a 105 $: el numero va fijo en SOL. A
# 90 $ salen 10,3 centimos y a 120 $ salen 13,7.
#
# DOS NUMEROS, A PROPOSITO:
#   fixed_amount_compra -> SOLO la compra (universal_trader.py, `fee_compra`,
#                          va como priority_fee_override). Son los 12 centimos.
#   fixed_amount        -> las ventas normales. Sigue en 5.714.286 (no se
#                          pidio subirla): una venta usa 60.000 unidades, unos
#                          3,6 centimos cada una (TP1 y tramos).
# Asi, si algun dia se cambia la comision de las ventas, la de entrada no se
# mueve con ella.
#   fixed_amount_venta_proteccion -> SOLO las ventas que protegen (stop,
#                          anti-rug). Pedida el 4-nov ("Si"): las mismas reglas
#                          del stop que bot-unica123-real. Mismo precio por
#                          unidad que alli: 42.424.243 x 60.000 unidades =
#                          2.545.455 lamports = 0,00255 SOL, unos 27 centimos
#                          por stop con el SOL a 105 $. Los TP siguen pagando
#                          ~3,6 centimos. Sin ella el stop va en la misma cola
#                          que todo lo demas justo cuando la moneda se desploma.
priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount_compra: 110000000
  fixed_amount: 5714286
  fixed_amount_venta_proteccion: 42_424_243
  extra_percentage: 0.0
  # EL TOPE TIENE QUE DEJAR PASAR LA DEL STOP. El codigo recorta TODAS las
  # comisiones a este numero, la protectora incluida: con el tope en
  # 5.714.286 (lo que tenia) la del stop quedaba recortada a la de una venta
  # normal y no servia de nada. La compra paga sus 12 centimos exactos,
  # porque `fixed_amount_compra` es fijo y queda por debajo de este tope; el
  # tope solo es el techo contra una errata.
  # 6-nov: 42.424.243 -> 91.428.571 -> 141.428.571 -> 110.000.000, lo justo
  # para la compra de 0,011 SOL
  # (si no, el codigo la recortaria a la del stop). Las ventas no cambian:
  # usan sus propios numeros fijos, por debajo de este tope.
  hard_cap: 110_000_000

retries:
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  # MODO CONTINUO, 6-nov ("Arranca ahora y asegurate que compras"). Con
  # curva_96 apagada las monedas llegan por este escuchador, y sin
  # `yolo_mode: true` el bot mira UNA sola moneda y se apaga ("single token
  # mode"). No cambia ningun filtro: solo hace que siga escuchando.
  yolo_mode: true
  # PAPER: registra entradas y salidas simuladas, nunca firma ni mueve SOL.
  paper_trade: false
  paper_watch_secs: 600
  max_token_age: 5
  # SIN TOPE DE MARKET CAP OTRA VEZ, pedido el 6-nov: "Quita el limite de
  # compra" -> "De capitalizacion de mercado". Venia de 3960 (~3.900 $,
  # puesto ese mismo dia con "pon Max buy en 3.9k"). Sin tope, el bot no
  # relee la curva para comprobarlo.
  max_entry_mc: 0
  # VENTANA DE 8 s, puesta el 6-nov para mirar el primer bloque ("Pide
  # minimo 3 compradores iniciales y 350 volumen..."). Desde "Quita holders
  # y volumen" ya no hay minimos que esperar, asi que no espera nada: solo
  # sigue descartando lo que tenga mas de 8 s al ir a comprar (lo mismo que
  # curva_96.max_edad_seg). Venia de 0. SIN ELLA LOS FILTROS
  # DEL PRIMER BLOQUE NO SE COMPRUEBAN NUNCA (universal_trader.py: el bucle
  # solo corre con max_buy_age > 0). 8 s, los mismos de la edad maxima.
  max_buy_age: 8
  # El 1% del dev es la única condición de mercado, también para Mayhem.
  allow_mayhem: false
  require_mayhem: false
  # DEVS CON RUGS BLOQUEADOS, pedido el 6-nov: "pero bloc dev rugs". Venia
  # de true (lo puso Codex el 5-nov). En false vuelven las dos listas, que
  # eran orden de Manu del 4-nov:
  #   - la BLACKLIST manual (blacklist_devs.json, 25 devs);
  #   - el AUTO-BANEO: un dev al que este bot le ha comprado y ha rugeado
  #     `rugs_para_bloquear` veces (2, el valor por defecto) no se le vuelve
  #     a comprar (blocked_devs<sufijo>.json).
  # El dev es la cartera que minteo, tambien si la lanzo una plataforma
  # (universal_trader.py, `_identidades_del_dev`).
  ignorar_listas_de_devs: false

  # EL 1% DEL DEV ES LA UNICA CONDICION DE ENTRADA, pedido el 5-nov: "Solo
  # activa la estrategia de comprar cuando el 1% de todos los lanzamientos
  # minimo del developer ha hecho bonding" -> "Claro que compre muchas mas".
  # Venia de 2 compras minimas en el primer bloque y espera al segundo
  # bloque. Al quitarlo tambien entran las monedas que el bot ve TARDE (sin
  # su nacimiento): se descartaban solo porque no podia mirar su primer
  # bloque (244 de 741 en el droplet ese dia).
  #
  # SIN MINIMOS EN EL PRIMER BLOQUE, pedido el 6-nov por la noche: "Quita
  # holders y volumen". Venia de 3 compras y 500 $ (pedidos ese mismo dia:
  # 3/350 -> 2/350 -> 2/200 -> 3/500). Ya no se mira cuantos compran ni
  # cuanto en el primer bloque: decide el dev (1%), la edad (8 s), mayhem y
  # las listas de devs.
  min_first_block_buys: 0
  max_first_block_buys: 0
  min_first_block_usd: 0
  max_first_block_usd: 0
  # No se espera a que cierre el primer bloque: basta con que cumpla.
  buy_from_second_block: false

  # APAGADA A PROPOSITO. En la hermana esta encendida y obliga a ver el
  # segundo bloque entero antes de comprar, o sea, a entrar en el tercero.
  # Aqui se pidio entrar de primeros en el segundo.
  second_block_confirmation:
    enabled: false
    min_buyers: 0
    min_buy_sol: 0
    min_net_sol: 0
    max_sells: 0

  curva_96:
    enabled: false
    umbral: 0
    tope: 1.0
    buy_amount: 0
    max_compras: 0
    parar_tras_perdidas: 0
    min_compradores: 0
    min_compradores_ola: 0
    ventana_presion: 5
    min_presion_ratio: 0
    min_compra_sol: 0
    vela_seg: 1
    max_subida_vela: 0
    exigir_ver_creacion: false
    max_carteras_primer_bloque: 0
    max_sol_primer_bloque: 0
    max_bundle_pct: 0
    max_bundle_pct_sin_historia: 0
    heartbeat_interval: 300
    # EDAD MAXIMA 8 s, pedido el 6-nov: "Maximo 8 segundos". Venia de 5.
    # Cuenta desde la CREACION DEL MINT (monitoring/volumen.py, `edad_real`)
    # hasta justo antes de enviar NUESTRA compra, despues de leer el historial
    # del dev (universal_trader.py, `_demasiado_vieja_para_comprar`). Con
    # `curva_96.enabled: false` solo se mira ahi, al ir a comprar. Una moneda
    # cuya creacion no vio el bot no tiene edad y no se compra.
    # Lo que cuesta: entra en monedas con mas segundos de vida, a precio algo
    # mas alto, a cambio de no perder devs nuevos cuyo historial tarda en leerse.
    min_edad_seg: 0
    max_edad_seg: 8

  # DEV: MINIMO 1 MIGRADA Y EL 10% DE SUS LANZAMIENTOS, pedido el 6-nov
  # por la noche: "pon solo un proyecto minimo migrado y 10% min sin nada
  # mas". Venia de 2 migradas y el 20%. Con 1 de 10 pasa (10%); con 1 de 11
  # no (9%).
  #
  # (HISTORIA) DEV: MINIMO 2 MIGRADAS Y EL 20% DE SUS LANZAMIENTOS, pedido el 6-nov
  # por la noche: "Pon minimo dos migraciones y minimo 20% proyectos
  # migrados". Venia de 1 migrada y el 1%. Con 2 de 10 pasa (20%); con 2
  # de 11 no (18%); con 1 de 3 tampoco (falta la segunda migrada).
  # Lo que cuesta: muchos menos devs pasan; se compra mucho menos.
  #
  # (HISTORIA) DEV: MINIMO EL 1% DE SUS LANZAMIENTOS MIGRADOS, pedido el 6-nov por la
  # tarde: "Pon migracion minima 1% no 1". Venia de min_rate 0 (bastaba 1
  # migrada, pedido esa misma manana). tasa = migradas / lanzadas: 1 de 100
  # pasa (1,00%); 1 de 101 no (0,99%). Y al menos 1 migrada (min_migrations).
  # Cuentan como suyas las monedas que minteo a traves de una plataforma
  # (ver `_minteadas_por_plataforma` en monitoring/pumpfun_dev.py).
  # Lo que cuesta: los devs que lanzan cientos de monedas y migraron una por
  # suerte se quedan fuera; se compra menos.
  # Un dev en su primera moneda tiene 0 migradas: no pasa. Si el historial no
  # se puede leer, tampoco: sin el dato no se compra.
  # La consulta se lanza al detectar la moneda y se espera al cerrar el
  # primer bloque, asi que no anade tiempo a la compra.
  # COMPRA INMEDIATA: el historial del dev se pide al detectar la moneda y,
  # si pasa, se compra sin esperar a edad, bloques, MC ni presión.
  # timeout_seg 9: el respaldo por la cadena espera como mucho 8 s; si no hay
  # dato en 9, no se compra (con dinero real, no saber no es que si).
  pumpfun_dev:
    enabled: true
    min_migrations: 1
    min_rate: 0.10
    compra_inmediata: true
    timeout_seg: 9
    # EN FALSE DESDE EL 7-NOV: los devs de `trade.devs_marcados` (la lista de
    # 15k+) compran sin pasar la regla del 10%; el resto si la tiene que
    # pasar. La "puerta de mediana" sigue apagada (no hay `dev_mediana`).
    strict_only: false

  # SALIDA PROPIA PARA LOS DEVS DE 30K+ (7-nov), ver la explicacion junto al
  # take profit. Solo la usan los devs de `lista`: min_rate 2.0 (un 200%)
  # hace que nadie entre aqui por su tasa de migradas.
  dev_elite:
    lista: "devs_30k.json"
    min_rate: 2.0
    stop_loss_percentage: 0.25
    take_profit_percentage: 0.45
    take_profit_sell_percentage: 0.6896551724
    mc_take_profit_tiers:
      - target_mc: 30000
        sell: 0.0775862069
      - target_mc: 45000
        sell: 0.0775862069
      - target_mc: 60000
        sell: 0.0775862069
      # El ultimo redondea hacia arriba para que no quede polvo sin vender.
      - target_mc: 80000
        sell: 0.0775862070

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  # 14, NO 12, por las 7 plazas (4-nov). Cada posicion abierta consulta su
  # precio cada price_check_interval (1 s), y el bot deja media cuota para
  # comprar (universal_trader.py, _avisa_si_el_nodo_no_da_mas):
  #     vigilables = max_rps x 1 / 2      12 -> 6     14 -> 7
