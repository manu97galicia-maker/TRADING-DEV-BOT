# Copy-trading de traders verificados. BLOQUEADO EN PAPEL hasta revisar muestra.
name: "COPY ELITE 0.1 SOL - PAPER"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
enabled: false
separate_process: false
platform: "pump_fun"

trade:
  buy_amount: 0.1
  buy_slippage: 0.12
  sell_slippage: 0.20
  exit_strategy: "tp_sl"
  take_profit_percentage: 0.80
  take_profit_sell_percentage: 1.0
  stop_loss_percentage: 0.24
  vender_todo_en_stop: true
  price_check_interval: 1
  # Incluso si alguien quita paper_trade por error, limita la prueba a una compra.
  max_real_buys: 1
  min_reserve_sol: 0.10

priority_fees:
  enable_dynamic: true
  enable_fixed: false
  fixed_amount: 0
  extra_percentage: 0.0
  hard_cap: 5000000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  max_token_age: 300
  max_buy_age: 30
  paper_trade: true
  allow_mayhem: false
  copy_wallets:
    enabled: true
    wallets: []
    wallets_file: "copy_traders_verified.txt"
    follow_funded: false
    poll_interval: 1.0

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false
