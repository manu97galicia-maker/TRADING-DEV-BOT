# DEVMIG - la unica estrategia viva.
#
# ENTRADA, SALIDA Y TAMANO SALEN DE MEDIR, no de intuicion.
#
# Comprobado sobre las ULTIMAS 24 HORAS reales (31 operaciones que el filtro
# habria hecho, cruzadas con el maximo real de cada moneda en pump.fun):
#
#     acertaron el +75% ... 32,3%   (el backtest largo decia 43,7%: la
#                                    simulacion es optimista, contar con menos)
#     ritmo ............... 1,29 operaciones por hora
#     a 0,10 SOL .......... +0,4455 SOL en el dia
#
# LA COMISION DE PRIORIDAD ES LO QUE MAS PESA A ESTE TAMANO. Con 1,02 $ el
# mismo dia habria dado -0,3221 SOL en vez de +0,4455: la comision es fija y
# sobre una posicion de 0,10 SOL se lleva el 25% de ida y vuelta. Por eso
# esta en 0,02 $, aunque eso signifique renunciar a entrar de primero.
#
# POR QUE ESTE TAMANO Y NO MAS. Con 0,619 SOL de saldo, 0,10 por posicion deja
# margen para la peor racha vista al simular 2.000 dias. A 0,30 harian falta
# 1,49 SOL y a 0,50, 2,54.
#
# POR QUE 6 CARTERAS. Lo que separa a las que se disparan es cuanta gente
# distinta compra, no cuanto dinero entra: de 0-5 carteras el 5,8% llega a 6K,
# de 12-20 el 15,0%. Bajar de 6 a 5 hunde el acierto.
#
# EL FILTRO DE CREADOR ESTA APAGADO a proposito: el 85,2% de las monedas con
# arranque limpio las lanza alguien con CERO migraciones, y los que repiten
# rinden peor (13,3% frente a 16,4%).
name: "DEVMIG - dev >=25% migrado (min 2), compra inmediata, 0,07 SOL, solo pump.fun (no mayhem)"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
enabled: true
separate_process: false
platform: "pump_fun"

trade:
  buy_amount: 0.07
  # A CERO: el tamano vuelve a ser fijo (0,15 SOL). Puesto a 0,70 el importe
  # seria el 70% del saldo libre calculado al comprar. Se deja cableado por si
  # se quiere volver a atar al saldo.
  #
  # LO QUE CUESTA BAJAR A 0,08. Los costes fijos no bajan contigo:
  #
  #     posicion   comision fija   pump.fun (2,25% x2)   total ida y vuelta
  #       0,30         0,5%              4,5%                  5,0%
  #       0,15         1,0%              4,5%                  5,5%
  #       0,08         1,9%              4,5%                  6,4%
  #       0,03         5,0%              4,5%                  9,5%
  #
  # A 0,08 sigue siendo asumible contra un objetivo del +35%, pero cada
  # operacion nace debiendo un 6,4%. Por eso el suelo esta en 0,03: por debajo
  # la comision se come el objetivo entero.
  #
  # Capital que hace falta: 3 posiciones x 0,08 + 0,02 de reserva = 0,26 SOL.
  # Si entra una elite (0,30) hacen falta 0,48.
  fraccion_saldo: 0
  # SUELO. Los costes fijos no bajan con el tamano: la renta de la cuenta de
  # token son 0,00204 SOL y las comisiones de pump.fun un 2,25% por lado. En
  # una compra de 0,02 SOL eso es mas del 15% de ida y vuelta, asi que la
  # operacion nace necesitando un +15% solo para empatar. Por debajo de 0,03
  # el bot avisa y NO compra.
  #
  # ESTO ES LO QUE HA ESTADO MOLIENDO LA WALLET. La cadena tiene compras de
  # 0,014 / 0,019 / 0,026 / 0,031 / 0,033 SOL que no salen en ningun log de
  # este bot: 25 operaciones seguidas para dejarse 0,115 SOL.
  compra_minima_sol: 0.03
  # UN RUG Y FUERA. Al creador que te deja una perdida grande no se le
  # vuelve a comprar. El bloqueo se guarda en disco y lo comparten todos
  # los bots, asi que sobrevive a los reinicios.
  rugs_para_bloquear: 1
  mayhem_buy_amount: 0.07
  nombre_estrategia: "devmig"
  # TRES A LA VEZ. Con una sola, el 21-ago cumplieron 44 monedas en tres horas
  # y solo se compraron 24: el 45% del flujo se perdia porque el bot estaba
  # ocupado. A 0,20 SOL, tres posiciones son 0,60 y caben en el saldo.
  # TRES A LA VEZ. Con una sola, el 21-ago cumplieron 44 monedas en tres horas
  # y solo se compraron 24: el 45% del flujo se perdia por estar ocupado. Con
  # el filtro del creador el flujo es mucho mas fino y las colisiones son
  # raras, pero no cuesta nada tenerlas. Capital que hace falta para las tres:
  # 3 x 0,15 + 0,02 de reserva = 0,47 SOL.
  max_posiciones: 3
  # TOPE DE POR VIDA, NO POR TANDA (pedido 26-ago, al mandar fondos nuevos):
  # 3 compras reales y para para siempre, hasta el proximo reinicio manual.
  # Sin `reiniciar_tanda: false` el contador vuelve a 0 solo en cuanto se
  # queda sin posiciones abiertas, y 3 dejarian de ser 3.
  max_real_buys: 3
  reiniciar_tanda: false
  # DOS PERDIDAS SEGUIDAS Y LA ESTRATEGIA SE PARA (pedido 26-ago): deja de
  # comprar hasta el proximo reinicio del servicio; lo que ya este abierto
  # se sigue vigilando y vendiendo. Se cuenta con el P&L real de la wallet
  # (delta neto), no con si toco un TP -- una que cobra TP1 y luego se hunde
  # tambien cuenta como perdida si cierra en negativo.
  max_perdidas_seguidas: 2
  escala_por_sol_ganado: 0

  buy_slippage: 0.12
  sell_slippage: 0.25
  exit_strategy: "tp_sl"

  # OBJETIVO AL +35%, NO AL +75%. Medido sobre las 30 monedas que el bot
  # compro DE VERDAD el 21-ago, cruzadas con su maximo real:
  #
  #     llegaron a +35% ... 13 de 30  (43,3%)
  #     llegaron a +75% ...  4 de 30  (13,3%)
  #     llegaron a x2 .....  2 de 30  ( 6,7%)
  #
  # La cuenta, perdiendo un 12% cuando falla:
  #     +75%:  0,133 x 0,75 - 0,867 x 0,12 = -0,004   pierde
  #     +35%:  0,433 x 0,35 - 0,567 x 0,12 = +0,084   gana
  #
  # POR QUE EL BACKTEST DECIA OTRA COSA. El estudio de 1.016 monedas daba un
  # 43,7% al +75%, pero medido contra el maximo alcanzado ALGUNA VEZ. Dos de
  # las cuatro que hoy llegaron al +75% tardaron 4 y 13 minutos: tiempo que el
  # bot no aguanta. El +35% se cobra en segundos, y por eso el numero real se
  # parece al medido.
  # CAMBIADO 26-ago, PEDIDO ASI POR MANU: vende poco al primer tramo y
  # reparte el grueso entre el segundo y el tercero.
  #
  # OJO, dicho claro: esto RENUNCIA a "primero se recupera lo puesto, luego
  # corre gratis". Con el 20% de antes (76%), el TP1 por si solo ya sacaba de
  # la wallet mas de lo puesto (1 / (1,35 x 0,9775) = 75,8% recuperaba el
  # 100%). Con el 20% de ahora, el TP1 solo recupera ~26% de la posicion: si
  # la moneda cae despues de tocar el TP1 pero antes del TP2, la operacion
  # SI puede cerrar en perdida -- antes no podia, porque `stop_a_entrada_
  # tras_tp` sube el suelo al precio de compra en cuanto salta el TP1, pero
  # eso protege el precio, no protege que ya se haya sacado el dinero.
  #
  # Los tramos siguen siendo cada uno un +35% sobre el anterior:
  #     1,35^2 = +82%   ·   1,35^3 = +146%
  #
  # Sin moonbag: 20 + 40 + 40 = 100, no queda un resto que se guarde para
  # siempre. Sin dato propio de ESTA proporcion (0 operaciones con ella
  # todavia) -- lo unico medido es que vender el 100% al +35% SIN escalera
  # rendia +0,228 SOL/SOL, el mejor numero del backtest general.
  take_profit_percentage: 0.35
  take_profit_sell_percentage: 0.20
  tp2_gain: 0.82
  tp2_sell: 0.40
  tp3_gain: 1.46
  tp3_sell: 0.40
  mc_take_profit_tiers: []

  # EL TRINQUETE: TP1 -> el suelo sube al precio de compra; TP2 -> sube al TP1;
  # TP3 -> al TP2, y asi.
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: true
  stop_loss_percentage: 0.65
  trailing_stop_percentage: 0

  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  # Mas de un minuto por debajo de la compra -> fuera entera. El suelo
  # estructural son 2.097 $ y se entra en 2.800: la que al minuto sigue por
  # debajo no ha encontrado comprador y solo le queda caer. El stop del 65%
  # esta demasiado abajo para sacarla.
  venta_bajo_entrada_seg: 60
  venta_muerta_seg: 120
  venta_muerta_gain: 0.0
  venta_sin_volumen_seg: 180
  max_hold_time: 3600
  price_check_interval: 1
  extreme_fast_mode: false
  # Con el tamano atado al saldo, la reserva solo tiene que cubrir la
  # comision de las ventas pendientes, no otra compra entera.
  min_reserve_sol: 0.03

compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 5_714_283
  extra_percentage: 0.0
  hard_cap: 5_714_283

retries:
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  max_token_age: 20
  # TRES SEGUNDOS. Las tres unicas ganadoras del 21-ago cumplieron a los 2,3,
  # 2,4 y 2,5 s. Las que tardan son las que no arrancan: 23 de 28 operaciones
  # salieron por `bajo_entrada` perdiendo 0,0286 cada una, y el unico rug
  # cumplio a los 3,8 s. Con el filtro anterior (60 s, config del 20-ago) los
  # tres rugs de ese dia cumplieron a los 12, 19,5 y 26 s.
  max_buy_age: 5
  # NO REPETIR NOMBRE EN 10 MINUTOS. El 21-ago se compro USD1 TRES veces y
  # RK-251 dos: mints distintos con el mismo nombre, alguien relanzando la
  # misma moneda. De las tres USD1 una gano y dos perdieron.
  no_repeat_name_min: 10
  match_string: null
  # A false A PROPOSITO: en true no se mira NINGUNA lista de creadores, ni la
  # manual ni el auto-baneo por rugs. Con el auto-baneo activado tiene que
  # estar en false o el bloqueo no se aplica nunca.
  ignorar_listas_de_devs: false
  allow_mayhem: false
  # SIN ESTO EL BOT PROCESA UNA MONEDA Y SE PARA PARA SIEMPRE.
  # El 21-ago DEVMIG estuvo mas de dos horas viendo 2.349 monedas y
  # evaluando CERO: se quedo esperando a la primera que encontro. El log
  # lo dice ("Running in single token mode") pero el servicio sigue en
  # `active`, asi que por fuera parece que va bien.
  # OJO: se lee de `filters`, no de `trade`. Puesto en trade no hace nada.
  marry_mode: false
  yolo_mode: true
  require_mayhem: false

  max_entry_mc: 3406
  min_entry_mc: 0
  # A CERO A PROPOSITO: ESTO ES LA VELOCIDAD.
  #
  # Exigir 8 SOL y 6 carteras significa ESPERAR entre 1 y 3 segundos a que el
  # mercado confirme. Comprando por historial del creador no se espera a
  # nadie: para cuando seis carteras han entrado, el que compro de primero ya
  # lleva la ventaja que se buscaba.
  #
  # LO QUE SE PIERDE, dicho claro: las 6 carteras eran el filtro que mas
  # pesaba (de 0-5 carteras el 5,8% llega a 6K; de 12-20, el 15,0%), y
  # bajarlo de 6 a 5 hundia el acierto del 43,7% al 34,7%. Aqui se cambia ese
  # filtro por el del creador. Si el >=20% no compensa, esto es lo primero
  # que hay que devolver a 8.0 / 6.
  min_volumen_sol: 0
  max_volumen_sol: 0
  min_titulares: 0
  min_presion_ratio: 0
  presion_seg: 0
  min_holders: 0
  min_holders_gmgn: 0

  # DEV QUE SUELE PUMPEAR POR ENCIMA DE 1 MILLON: mas dinero, comision alta
  # para entrar de primero, y stop mas corto.
  #
  # "SUELE" SON DOS MONEDAS, NO UNA. Con una sola pasaria cualquiera que haya
  # tenido un pelotazo entre veinte fracasos.
  #
  # SOLO CUENTAN LAS MONEDAS QUE MIGRARON. El `ath_market_cap` de pump.fun se
  # infla solo con el pool seco -- un creador llego a ensenar 89.950.686 $ de
  # maximo con 1.387 $ de liquidez. Migrar exige 85 SOL reales en la curva y
  # eso no se finge. Filtrar por pico SIN exigir migracion seria coleccionar
  # granjas.
  #
  # EL STOP DEL 55% ES MAS CORTO, NO MAS SUAVE: corta antes. Tiene sentido
  # aqui porque con 0,30 SOL cada punto de caida cuesta el doble.
  dev_elite:
    min_pico_mc: 1000000
    min_monedas_altas: 2
    buy_amount: 0.30
    stop_loss_percentage: 0.55
    # 1,01 $ a SOL 93,64. Son 0,010786 SOL: 77.042.857 microlamports x 140.000
    # unidades de computo. SOLO se paga en estas compras.
    fixed_amount: 77_042_857
    # Sin escalera propia -> usa la de arriba (76/7/5/5 y 7% de moonbag).
    min_rate: 9.99

  pumpfun_dev:
    enabled: true
    # SOLO CREADORES QUE HAN MIGRADO EL 20% O MAS de lo que han lanzado.
    # Deja pasar el 0,3% del flujo (13 de 5.167 evaluaciones): cuenta con
    # HORAS entre operacion y operacion, no es que este roto.
    min_rate: 0.25
    min_migrations: 2
    # La decision se toma al detectar la moneda, no al final. Lo que no
    # cumple se cae antes de gastar RPC; lo que cumple se compra sin esperar
    # confirmacion de mercado.
    compra_inmediata: true
    # Si la API de pump.fun no contesta en 2 s, no se compra. Sin el dato del
    # creador esta estrategia no tiene filtro ninguno.
    timeout_seg: 2.0

  # SEGUNDA PUERTA POR MEDIANA (pedida 26-ago). No exige tasa/migraciones
  # minimas como pumpfun_dev de arriba: exige que la MEDIANA de sus monedas
  # MIGRADAS ya valga 20K+, con al menos 2 migradas para que sea mediana y no
  # suerte de una sola. A cambio, deja entrar hasta 4.500 $ de market cap en
  # vez del techo general (max_entry_mc mas arriba) -- mismo tamano que el
  # resto, el trato es el techo de entrada Y la escalera de salida.
  #
  # "QUE NUNCA HAGAN RUG" ya esta cubierto sin nada nuevo: ignorar_listas_de_
  # devs esta en false, asi que el auto-baneo de blacklist_devs.json (1 rug y
  # fuera) se aplica a esta puerta exactamente igual que a la normal.
  #
  # ESCALERA PROPIA, SIN DATO TODAVIA (puerta nueva, 0 operaciones reales).
  # Sin esto heredaba la del +35% de mas arriba, que se eligio PORQUE ese
  # filtro (25%/2 migraciones) apenas acierta a los +75% (13,3% de 30). Este
  # grupo es distinto: el dev ya ha probado una mediana de 20K+, mas cerca de
  # la poblacion general que del filtro raspado -- ahi el mejor numero medido
  # (1.016 monedas, tres remuestreos) fue vender TODO a +75% (x1,75):
  # +0,228 SOL por SOL apostado. Aqui no se vende todo: se recupera lo puesto
  # a +75% (60% vendido, con margen sobre el 58,5% de equilibrio tras la
  # comision del 2,25%) y se deja correr un tramo mas largo que el filtro
  # normal, porque la entrada (3,4-4,5K) y la mediana del dev (20K+) dejan
  # mucho mas hueco de por medio que en el filtro de base.
  dev_mediana:
    min_mediana_mc: 20000
    min_monedas: 2
    max_entry_mc: 4500
    take_profit_percentage: 0.75
    take_profit_sell_percentage: 0.60
    tp2_gain: 1.50
    tp2_sell: 0.15
    tp3_gain: 3.00
    tp3_sell: 0.15
    # 10% moonbag: mas que el 7% de la escalera normal, porque aqui el techo
    # historico del dev (mediana 20K+) SI deja hueco para que valga la pena
    # dejar algo corriendo sin vender.
