# VELOCIDAD (paper) — cazar las LARP: sin lista de devs, solo volumen temprano
#
# Por que existe
# --------------
# La LARP que hizo x10 en minutos la lanzo FciWQ5qf..., que no esta en la lista
# de 121 devs. El bot ni la miro: con bro_address puesto, solo existe lo que
# lanzan esos 121. Lo mismo pasa con los dos creadores que dieron TODO el
# beneficio historico (8FkkpSgV... y 5fM9cY5G...): tampoco estaban en la lista.
#
# Este bot invierte la premisa. No pregunta QUIEN lanza, pregunta QUE PASA en
# los primeros 20 segundos. Sobre 185.428 monedas de Dune, las que superan los
# $8K hacen 50,6 SOL de volumen en 20s contra 1,9 de las que no: x26,6 de
# separacion. Esa es la senal, y no necesita saber el nombre de nadie.
#
# Lo que esto implica, dicho claro
# --------------------------------
# La lista de devs no era solo un filtro de calidad: era la proteccion contra
# rugs. Sin ella se entra a lanzamientos de cualquiera, incluidos los que
# bundlean media supply para arrancar la vela y luego la tiran. La propia LARP
# llevaba 48,9% bundleado. Se acepta a proposito, porque el encargo era cazar
# monedas como esa; el precio es comer mas rugs. POR ESO VA EN PAPEL.
#
# Decisiones de calibrado
# -----------------------
# min_curve_sol 5.0 (no 3.0 como el gemelo NEXT-BIG VOL): sin filtro de creador
# el embudo es ~100x mas ancho -- pasan de mirar 121 wallets a mirar todo
# pump.fun, miles de lanzamientos al dia. Con el umbral bajo, esto seria una
# ametralladora de notificaciones y de llamadas al RPC. 5 SOL netos en curva
# deja pasar solo lo que se esta moviendo de verdad.
#
# max_entry_mc 30000 (no 15000): a los 20 segundos un cohete ya vale bastante.
# Cortar en 15K excluiria justo las que se quieren cazar. El filtro de volumen
# es quien selecciona aqui; el tope de MC solo evita comprar un techo evidente.
#
# La escalera de salida es IDENTICA a la de los otros dos bots, a proposito.
# Se sabe que es mala para runners (IM POOR hizo x22 y dejo 0,179 SOL porque
# TP1 suelta el 60% en +40%), pero si se cambian entrada Y salida a la vez no
# se puede saber cual de las dos explica la diferencia. Primero se mide la
# entrada; las salidas se prueban despues, por separado.

name: "VELOCIDAD (paper) - sin lista de devs, 5 SOL en curva a los 20s"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.05             # igual que los otros dos, para poder comparar
  buy_slippage: 0.35
  sell_slippage: 0.35
  # SCALP: salir en +15% y no ser codicioso (2026-07-31, peticion de Manu).
  #
  # El stop BAJA con el objetivo, y no es opcional. Vender en +15% manteniendo
  # un stop de -40% exige acertar el 78% de las veces solo para no perder; con
  # las perdidas reales del historico (-65%) sube al 85%. El acierto medido son
  # 63 operaciones al 50,8%. Con TP y SL simetricos el listo baja al 58%, que
  # sigue siendo exigente pero ya esta en el mismo mundo.
  exit_strategy: "tp_sl"
  take_profit_percentage: 0.15
  take_profit_sell_percentage: 1.0   # vende TODO en +15%, sin escalera
  stop_loss_percentage: 0.15
  max_hold_time: 60                  # un scalp que tarda mas de 1 min ya fallo
  price_check_interval: 1
  extreme_fast_mode: false
  extreme_fast_token_amount: 20
  min_reserve_sol: 0.15        # el suelo que pediste; en papel no aplica, queda por coherencia

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 20      # medir a los ~20s, la ventana donde Dune separa
  wait_after_buy: 0

filters:
  listener_type: "pumpportal"
  max_token_age: 10            # 10 + 20 de espera = medicion dentro de la ventana
  match_string: null
  bro_address: null            # <-- LA DIFERENCIA: sin lista, mira TODO pump.fun
  allow_mayhem: true           # se abre la red: ningun otro bot esta activo para duplicar
  marry_mode: false
  yolo_mode: true
  paper_trade: true            # NO compra. Solo apunta y sigue el precio.
  # $4.000 de volumen en los primeros 20s (peticion de Manu). A ~$150/SOL son
  # 27 SOL de volumen, que en la curva quedan en ~10 SOL netos con el 69% de
  # compras que mide Dune. Mas exigente que los 5 de antes: menos senales, pero
  # solo lo que se esta moviendo de verdad.
  min_curve_sol: 10.0          # <-- EL UNICO FILTRO REAL
  max_entry_mc: 30000
  min_holders: 0
  max_holder_pct: 0
  holder_bypass_ratio: 3

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 6
