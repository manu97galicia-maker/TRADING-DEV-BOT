# VELOCIDAD (paper) — cazar las LARP: sin lista de devs, solo volumen temprano
#
# Por que existe
# --------------
# La LARP que hizo x10 en minutos la lanzo FciWQ5qf..., que no esta en la lista
# de 121 devs. El bot ni la miro: con bro_address puesto, solo existe lo que
# lanzan esos 121. Lo mismo pasa con los dos creadores que dieron TODO el
# beneficio historico (8FkkpSgV... y 5fM9cY5G...): tampoco estaban en la lista.
#
# Este bot invierte la premisa. No pregunta QUIEN lanza, pregunta QUE PASA en
# los primeros 20 segundos. Sobre 185.428 monedas de Dune, las que superan los
# $8K hacen 50,6 SOL de volumen en 20s contra 1,9 de las que no: x26,6 de
# separacion. Esa es la senal, y no necesita saber el nombre de nadie.
#
# Lo que esto implica, dicho claro
# --------------------------------
# La lista de devs no era solo un filtro de calidad: era la proteccion contra
# rugs. Sin ella se entra a lanzamientos de cualquiera, incluidos los que
# bundlean media supply para arrancar la vela y luego la tiran. La propia LARP
# llevaba 48,9% bundleado. Se acepta a proposito, porque el encargo era cazar
# monedas como esa; el precio es comer mas rugs. POR ESO VA EN PAPEL.
#
# Condiciones actuales (Manu, 2026-07-31 08:50)
# ---------------------------------------------
# Comprar toda moneda que DENTRO DE LOS PRIMEROS 20 SEGUNDOS este entre $3.000 y
# $4.500 de market cap. Vender el 60% cuando suba un 50%, dejar correr el 40%.
#
# EQUIVALENCIA QUE HAY QUE TENER DELANTE PARA AJUSTAR ESTO
# --------------------------------------------------------
# En la curva de pump.fun el market cap, el SOL acumulado y el volumen son el
# MISMO dato visto de tres formas. Fijar uno fija los otros dos:
#
#     market cap   SOL en curva   volumen que hizo falta
#        $2,080        0.0            $0        <- precio de nacimiento
#        $3,000        6.0        $1,180
#        $4,000       11.6        $2,271
#        $4,500       14.1        $2,766        <- techo actual
#        $5,000       16.5        $3,232
#
# Por eso "que haga $3.000 de volumen Y este por debajo de $4.500" no se puede:
# con $3.000 de volumen la moneda ya vale ~$4.750. Manda el techo, que es lo que
# de verdad controlas al comprar. Si algun dia quieres exigir $3.000 de volumen
# de verdad, el techo tiene que subir a ~$4.800.
#
# Historial de filtros probados aqui, para no repetirlos:
#   - >10 holders a los 20s -> rechazo 152 de 152 (a esa edad hay 2-3)
#   - min_curve_sol junto al techo de MC -> incompatibles, son la misma variable

name: "VELOCIDAD (paper) - sin devs, MC $3K-$4.5K a los 20s"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true
separate_process: true
platform: "pump_fun"

trade:
  # 0.15 y no 0.05 (1-ago): la cuota FIJA de pump.fun es ~0.0018 SOL por
  # transaccion. Sobre 0.05 SOL eso son casi 11 puntos porcentuales solo en
  # cuotas; sobre 0.15 baja a 3,6. Por debajo de 0.15 no se opera, se pagan
  # comisiones.
  buy_amount: 0.15
  buy_slippage: 0.35
  sell_slippage: 0.35
  # 2026-07-31, condiciones de Manu: vender el 60% cuando suba un 50%,
  # "que es cuando suele salir en tendencias". Deja correr el 40% restante.
  #
  # Sustituye al scalp de +15/-15 anterior. El stop sube a -30: con TP en +50 y
  # vendiendo solo el 60%, el beneficio medio por acierto es ~+30% de la
  # posicion, asi que un stop de -40 volveria a poner la balanza en contra.
  exit_strategy: "tp_sl"
  # Salida rehecha con las 31 senales reales del 1-ago 6:30-6:35.
  #
  # Antes: +50% vendiendo el 60%. El 40% que quedaba salia igualmente por
  # stop-loss, asi que una GANADORA dejaba +2,3% y una perdedora -41%: hacia
  # falta acertar el 95% de las veces para no perder. Se acerto el 39%.
  #
  # Ahora: se vende TODO en el objetivo. Una ganadora deja +91% y una
  # perdedora -36%, asi que basta con acertar el 29%. En esas 31 senales se
  # acerto el 26%: sigue quedandose corto, pero ya es una diferencia que la
  # medicion en papel puede resolver, no un abismo aritmetico.
  #
  # El nivel exacto del TP NO esta ajustado a proposito: se comprobo que el
  # orden de 27 configuraciones se invierte entre media hora y la siguiente
  # (correlacion -0,37). +100% es donde la exigencia se cruza con lo logrado,
  # no el ganador de un barrido.
  take_profit_percentage: 1.00
  take_profit_sell_percentage: 1.00     # vender el 100%: sin resto que sangre
  stop_loss_percentage: 0.30
  max_hold_time: 180                    # 120s cortaba picos que llegaban tarde
  price_check_interval: 1
  extreme_fast_mode: false
  extreme_fast_token_amount: 20
  # Ya NO es decorativo: desde que esto opera en real, este suelo es la
  # gasolina. Si la wallet llega a cero no se puede firmar ni una venta, y las
  # posiciones abiertas se quedan atrapadas. No bajarlo por "aprovechar" saldo.
  min_reserve_sol: 0.15

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 20      # medir a los ~20s, la ventana donde Dune separa
  wait_after_buy: 0

filters:
  listener_type: "pumpportal"
  # Edad maxima 1 minuto (peticion de Manu). El bot comprueba la edad ANTES de
  # esperar, asi que el tope real de compra es max_token_age + wait_after_creation:
  # 40 + 20 = 60s como mucho desde el lanzamiento.
  max_token_age: 40
  match_string: null
  bro_address: null            # <-- LA DIFERENCIA: sin lista, mira TODO pump.fun
  allow_mayhem: true           # se abre la red: ningun otro bot esta activo para duplicar
  marry_mode: false
  yolo_mode: true
  # <<< DINERO REAL desde el 1-ago (decision de Manu, avisado del riesgo) >>>
  # La unica medicion real que hay -- las 31 senales del 1-ago 6:30-6:35 con
  # ESTA configuracion ya optimizada -- seguia en negativo: hacen falta 29% de
  # aciertos y hubo 26%. Se enciende igualmente porque es su dinero y su
  # decision; queda escrito para saber que se sabia.
  paper_trade: false
  # Sin filtro de volumen: en la curva es la misma variable que el market cap,
  # y el rango de abajo ya lo define. Ver la cabecera.
  min_curve_sol: 0
  min_entry_mc: 3000        #  6,0 SOL en curva = ~$1.180 de volumen
  max_entry_mc: 4500        # 14,1 SOL en curva = ~$2.766 de volumen
  # 2026-07-31 08:20: 10 -> 0. Rechazo 152 de 152 monedas en la primera hora
  # ("solo 2 holders (< 10) -> NO organico"). A los 20 segundos una moneda
  # tipica tiene 2-3 poseedores, asi que pedir mas de 10 ahi no filtraba: vetaba
  # todo. Se apaga y manda el volumen, que es la senal validada.
  #
  # Si mas adelante se cuelan bundles, se vuelve a activar con un umbral sacado
  # de la distribucion real de los logs, no a ojo.
  min_holders: 0
  max_holder_pct: 0
  holder_bypass_ratio: 3

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 6
