# VELOCIDAD (paper) — cazar las LARP: sin lista de devs, solo volumen temprano
#
# Por que existe
# --------------
# La LARP que hizo x10 en minutos la lanzo FciWQ5qf..., que no esta en la lista
# de 121 devs. El bot ni la miro: con bro_address puesto, solo existe lo que
# lanzan esos 121. Lo mismo pasa con los dos creadores que dieron TODO el
# beneficio historico (8FkkpSgV... y 5fM9cY5G...): tampoco estaban en la lista.
#
# Este bot invierte la premisa. No pregunta QUIEN lanza, pregunta QUE PASA en
# los primeros 20 segundos. Sobre 185.428 monedas de Dune, las que superan los
# $8K hacen 50,6 SOL de volumen en 20s contra 1,9 de las que no: x26,6 de
# separacion. Esa es la senal, y no necesita saber el nombre de nadie.
#
# Lo que esto implica, dicho claro
# --------------------------------
# La lista de devs no era solo un filtro de calidad: era la proteccion contra
# rugs. Sin ella se entra a lanzamientos de cualquiera, incluidos los que
# bundlean media supply para arrancar la vela y luego la tiran. La propia LARP
# llevaba 48,9% bundleado. Se acepta a proposito, porque el encargo era cazar
# monedas como esa; el precio es comer mas rugs. POR ESO VA EN PAPEL.
#
# Condiciones actuales (Manu, 2026-07-31)
# ---------------------------------------
# Entrar en toda moneda que en los primeros 20s llegue a $3.500 de market cap y
# tenga mas de 10 poseedores distintos. Vender el 60% cuando suba un 50%, "que
# es cuando suele salir en tendencias", y dejar correr el 40%.
#
# Los dos filtros se complementan y por eso van juntos:
#   - el MC dice que ALGUIEN ha comprado (la perdedora tipica de Dune se queda
#     en $2.462 a los 20s; la ganadora esta en $8.395)
#   - los holders dicen que han comprado VARIOS. Es la defensa contra el bundle:
#     tres carteras pueden inflar el market cap, pero no pueden ser once.
#
# Aviso sobre el conteo de holders: el bot usa getTokenLargestAccounts, que solo
# devuelve las 20 cuentas mayores. Para un minimo de 10 sirve de sobra, pero no
# se puede subir mucho mas de ahi. Y falla en abierto: si el RPC no responde, no
# bloquea la compra.
#
# max_entry_mc 30000: a los 20 segundos un cohete ya vale bastante, y cortar mas
# abajo excluiria justo lo que se quiere cazar. Solo evita comprar un techo.

name: "VELOCIDAD (paper) - sin devs, MC>3.5K y >10 holders a los 20s"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.05             # igual que los otros dos, para poder comparar
  buy_slippage: 0.35
  sell_slippage: 0.35
  # 2026-07-31, condiciones de Manu: vender el 60% cuando suba un 50%,
  # "que es cuando suele salir en tendencias". Deja correr el 40% restante.
  #
  # Sustituye al scalp de +15/-15 anterior. El stop sube a -30: con TP en +50 y
  # vendiendo solo el 60%, el beneficio medio por acierto es ~+30% de la
  # posicion, asi que un stop de -40 volveria a poner la balanza en contra.
  exit_strategy: "tp_sl"
  take_profit_percentage: 0.50
  take_profit_sell_percentage: 0.60
  stop_loss_percentage: 0.30
  max_hold_time: 120
  price_check_interval: 1
  extreme_fast_mode: false
  extreme_fast_token_amount: 20
  min_reserve_sol: 0.15        # el suelo que pediste; en papel no aplica, queda por coherencia

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 60_000_000
  extra_percentage: 0.0
  hard_cap: 60_000_000

retries:
  wait_after_creation: 20      # medir a los ~20s, la ventana donde Dune separa
  wait_after_buy: 0

filters:
  listener_type: "pumpportal"
  # Edad maxima 1 minuto (peticion de Manu). El bot comprueba la edad ANTES de
  # esperar, asi que el tope real de compra es max_token_age + wait_after_creation:
  # 40 + 20 = 60s como mucho desde el lanzamiento.
  max_token_age: 40
  match_string: null
  bro_address: null            # <-- LA DIFERENCIA: sin lista, mira TODO pump.fun
  allow_mayhem: true           # se abre la red: ningun otro bot esta activo para duplicar
  marry_mode: false
  yolo_mode: true
  paper_trade: true            # NO compra. Solo apunta y sigue el precio.
  # Condiciones de Manu (2026-07-31): la moneda tiene que haber llegado a
  # $3.500 de market cap y tener mas de 10 holders dentro de los primeros 20s.
  #
  # Se quita el filtro de volumen (min_curve_sol) a proposito: exigir 20 SOL en
  # curva implicaba un MC de ~$8.400, muy por encima del suelo de $3.500 que se
  # pide ahora. Manteniendo los dos, el de volumen mandaba y el de MC no se
  # habria disparado nunca.
  min_curve_sol: 0
  min_entry_mc: 3500
  max_entry_mc: 30000
  min_holders: 10           # >10 poseedores distintos = no es un bundle de 3 carteras
  max_holder_pct: 0
  holder_bypass_ratio: 3

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 6
