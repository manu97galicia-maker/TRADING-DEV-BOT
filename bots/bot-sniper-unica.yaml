# UNICA - la unica estrategia viva.
#
# Sustituye a DEFINITIVA, ELITE y RAPIDA, que hacian lo mismo con umbrales de
# creador distintos y se pisaban entre ellas comprando la misma moneda.
#
# LA ENTRADA SALE DE UNA MEDIDA, no de una corazonada. El 20-ago se cruzaron
# 1.016 monedas (lectura del bot en los 5 primeros segundos) con su maximo
# real segun pump.fun:
#
#   base de la muestra ................  8,1% llegan a 6K   3,1% a 12K
#   6+ carteras, 8-15 SOL, MC <=2.800 .. 20,0% llegan a 6K   7,5% a 12K
#
#   Eso es 2,48 veces mejor que no filtrar.
#
# LO QUE SEPARA ES CUANTA GENTE DISTINTA COMPRA, no cuanto dinero entra:
#
#   0-5 carteras   5,8% llegan a 6K
#   5-8            8,3%
#   8-12          12,2%
#   12-20         15,0%
#
# Y MAS SOL NO ES MEJOR. De 8 a 15 SOL en cinco segundos rinde un 10,8%; por
# encima de 15 baja al 9,1% y solo el 1,8% llega a 12K. Eso ya no es demanda,
# es bundle. Por eso hay techo de volumen y no solo suelo.
#
# EL 18% DE LA CURVA NO ERA LA SENAL: pasarlo en 5 segundos da 9,3% frente al
# 6,7% de no pasarlo. Existe, pero es ruido al lado de lo de arriba.
#
# =============================================================================
#  VOL4K  ·  recien nacidas  ·  volumen  ·  dev que migra 10%+  ·  0,35 SOL
#  Salida 55% al +40% · 20% al +100% · 10% al x3 · 15% moonbag · SIN STOP
# =============================================================================
#
# Pedida por Manu el 15-ago como UNICA estrategia activa. Junta tres cosas que
# hasta ahora iban por separado: que la moneda acabe de nacer, que ya se este
# moviendo dinero de verdad en ella, y que el creador tenga historial.

name: "UNICA - 6+ carteras, 8-15 SOL, MC <=2.800; +50% vende la mitad"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false
separate_process: false
platform: "pump_fun"

trade:
  # 0,15 DE BASE, y 0,25 si el creador ha migrado el 50% o mas de lo que
  # lanza. La tasa ya se calcula en el filtro del dev, asi que subir la apuesta
  # no cuesta ninguna llamada extra.
  #
  # `dev_elite` (que ya existia) NO servia para esto: cambia el TP y el stop,
  # no cuanto se pone. `buy_amount_dev_top` se anadio al motor el 16-ago.
  buy_amount: 0.20
  nombre_estrategia: \"unica\"
  # La compra crece un 35% por cada SOL ganado de VERDAD. El bote es comun a
  # los tres bots (comparten wallet) y solo cuenta P&L leido de la cadena.
  #   +1 SOL ganado -> 0,203 por compra | +5 SOL -> 0,413
  escala_por_sol_ganado: 0.35
  max_real_buys: 6
  # 0,50, no 0,30: con la base en 0,40, dejarlo en 0,30 seria apostar MENOS
  # por el creador bueno que por el normal. Si lo quieres en 0,30 igualmente,
  # es esta linea.
  buy_amount_dev_top: 0.50
  dev_top_min_rate: 0.20
  mayhem_buy_amount: 0.06

  # Dos posiciones = 0,70 SOL de los 1,53 que hay. Sin esta linea el codigo usa
  # 20 por defecto, que serian 7 SOL.
  max_posiciones: 2
  mayhem_max_perdidas: 0

  # Slippage alto en la compra: en una moneda que se esta moviendo, un margen
  # corto hace que la transaccion REVIENTE y pagues la comision sin moneda.
  buy_slippage: 0.12
  sell_slippage: 0.25

  exit_strategy: "tp_sl"
  # 30% al +50% · 30% en x3 · 25% al tocar 9.800 $ de market cap · 15% moonbag.
  #
  # Los `gain` son ganancia, no multiplicador: 0.50 = +50%, 2.00 = x3.
  # El escalon de 9.800 va por MARKET CAP y solo se activa cuando los dos de
  # porcentaje ya se han cobrado (universal_trader.py:3667).
  # El 15% que queda no se vende nunca.
  take_profit_percentage: 0.75
  take_profit_sell_percentage: 1.0
  # SALIDA: UN SOLO OBJETIVO, +75%, Y SE VENDE ENTERA.
  #
  # Medido sobre la muestra del 20-ago (40 monedas del grupo filtrado, y
  # comprobado tambien en grupos de 156 y 283 con filtros mas flojos):
  #
  #     vende todo a x1,50 ... +0,145 por cada 1 SOL
  #     vende todo a x1,75 ... +0,228     <- el mejor en las tres muestras
  #     vende todo a x2,00 ... +0,177
  #     la escalera anterior . +0,159
  #
  # NO ES UN PICO DE SUERTE. Los vecinos (1,70 / 1,80 / 1,85) dan entre +0,196
  # y +0,228: es una meseta. Remuestreando 1.000 veces sale positivo el 100%
  # de las veces, con el 90% de los casos entre +0,102 y +0,333.
  #
  # Se descartaron x3 y x4, que en la media salian mejor (+0,216 y +0,236) pero
  # PIERDEN dinero en la primera mitad de la muestra: todo su resultado venia
  # de una sola moneda que hizo x14,4.
  #
  # Y EL MOONBAG RESTABA: vender el 100% da +0,228, el 80% da +0,161 y el 50%
  # da +0,059. Lo que queda dentro casi nunca sigue subiendo -- vuelve al
  # precio de compra y sale por el suelo del trinquete.
  mc_take_profit_tiers: []

  # SIN STOP LOSS, como pediste. El 0 significa "sin suelo" en la ruta de
  # dinero real (`sl_price = entry*(1-pct) if pct else None`).
  stop_loss_percentage: 0.80
  trailing_stop_percentage: 0

  # Pero el suelo SUBE segun cobra: al cobrar el +40% se pone en la entrada, y
  # de ahi al escalon anterior. Asi el moonbag del 15% no puede acabar en
  # perdida. No es un stop de los que te sacan por ruido.
  stop_a_entrada_tras_tp: true
  # El suelo sigue subiendo escalon a escalon: tras el 2o TP pasa al 1o.
  stop_al_tp_tras_tp: true
  stop_al_tp_anterior: true

  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3

  # LAS DOS CONDICIONES DE SALIDA QUE PEDISTE, y son distintas:
  #
  # 1) PARADA POR DEBAJO DE LA COMPRA a los 2 minutos -> fuera. Mira el PRECIO,
  #    una sola vez, al cumplirse el plazo.
  venta_muerta_seg: 120
  # MAS DE UN MINUTO POR DEBAJO DE LA COMPRA -> FUERA ENTERA, moonbag
  # incluido. El suelo estructural son 2.097 $ y se entra en 2.800: una
  # moneda que al minuto sigue por debajo de lo pagado no ha encontrado
  # comprador, y lo unico que queda por delante es la caida al suelo. El
  # stop del 80% esta demasiado abajo para sacarla; esto si.
  venta_bajo_entrada_seg: 60
  venta_muerta_gain: 0.0
  # 2) SIN VOLUMEN 2 minutos seguidos -> fuera. Mira el VOLUMEN, de forma
  #    continua. Da igual que el precio siga alto: si nadie negocia, ese precio
  #    no lo va a pagar nadie. Es la leccion de las 63 monedas que quedaron
  #    atrapadas con "valor" en pantalla y cero SOL detras.
  #    (Opcion nueva, anadida al motor el 15-ago.)
  venta_sin_volumen_seg: 120

  max_hold_time: 3600
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.05

  # UN SOLO RUG Y FUERA. Por defecto son 2; con 1, al creador que te la
  # juega una vez no se le vuelve a comprar nunca (queda anotado en
  # blocked_devs_bot-sniper-definitiva.json).
  rugs_para_bloquear: 1

# OBLIGATORIO: Token-2022 no cabe en las 59.700 unidades por defecto y la VENTA
# falla con "Program failed to complete", dejando la posicion atrapada.
compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  # UN 5% POR ENCIMA DE LO QUE PAGAN ELLOS. En la captura de Manu la tarifa de
  # prioridad es 0,085 $; un 5% mas son 0,08925 $, que a 75,18 $/SOL son
  # 0,0011871 SOL. Con 140.000 unidades de computo eso sale a 8.480.000
  # microlamports por unidad.
  #
  # OJO: esto es la parte de PRIORIDAD, la que se puja. La comision base de red
  # (los 0,075 $ de la captura) no se elige, la pone la red.
  #
  # Si SOL cambia mucho de precio, este numero deja de valer 0,089 $ y hay que
  # rehacerlo.
  fixed_amount: 8_480_000
  extra_percentage: 0.0
  hard_cap: 8_480_000

retries:
  # DOS INTENTOS, no tres. Cada intento que aterriza y falla paga su comision;
  # el tercero casi nunca salva la operacion y si suma coste.
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  max_token_age: 90

  # 30 SEGUNDOS DE VENTANA, no 3. Esto es lo que hace posible el filtro de
  # volumen: el bot ve la moneda al nacer y se queda VIGILANDOLA hasta 30 s,
  # comprando en el instante exacto en que el volumen cumple. Con la ventana en
  # 3 s no daria tiempo a que se negociara nada y el filtro no dispararia
  # nunca. No retrasa la compra: si cumple en el segundo 1, compra en el 1.
  # 30 SEGUNDOS, no 3. Con filtros de volumen y de operaciones el bot NO
  # espera a ciegas: se queda vigilando la moneda y compra en el instante
  # exacto en que cumple las dos condiciones. Con la ventana en 3 s no daria
  # tiempo a que se negociara nada y no compraria nunca.
  max_buy_age: 60

  match_string: null
  bro_address: null
  # BANEO AUTOMATICO ACTIVADO. En false, el bot mantiene su propia lista: al
  # creador que te rugea `rugs_para_bloquear` veces no se le vuelve a comprar
  # nunca (queda en blocked_devs_bot-sniper-definitiva.json). En true esa lista
  # se ignoraba, que es como estaba heredado.
  ignorar_listas_de_devs: false

  # FILTRO DEL CREADOR: APAGADO, y a proposito.
  #
  # Era el unico de los filtros que no tenia una medida detras. Los otros tres
  # --carteras, volumen, market cap-- salen de cruzar 1.016 monedas con su
  # maximo real. Este venia de intuicion, y los datos dicen lo contrario:
  #
  #   el 85,2% de las monedas con arranque limpio las lanza alguien con CERO
  #   migraciones, asi que exigir historial deja fuera casi todo el flujo
  #
  #   y los creadores que REPITEN rinden peor: 13,3% llegan a x1,75 frente al
  #   16,4% de los que solo aparecen una vez
  #
  # El 20-ago a las 11:31 tumbo a TradeFi, que cumplia todo lo demas --6
  # carteras, 9,2 SOL, MC 2.605 $-- solo porque era la primera moneda de su
  # creador y por tanto no podia tener historial. Con ELITE al 25% llego a
  # tumbar el 98% de lo que le llegaba: 3 compras en toda su vida.
  #
  # Lo que protege aqui es la ESTRUCTURA (el techo de entrada a 2.800 $, con el
  # suelo estructural en 2.097), no la reputacion del que lanza.
  pumpfun_dev:
    enabled: false

  # VOLUMEN MINIMO 300 $ = 3,99 SOL (a 75,18 $/SOL).
  min_volumen_sol: 8.0

  # SIN FRANJA HORARIA: opera las 24 horas. El {inicio:18, fin:4} venia
  # heredado de cuando esta estrategia se llamaba NOCHE, y estaba descartando
  # todo fuera de esa banda sin que nadie lo hubiera pedido para esta version.
  horario: {}

  allow_mayhem: false
  require_mayhem: false
  marry_mode: false
  yolo_mode: true
  paper_trade: false          # DINERO REAL

  # TECHO DE COMPRA EN 2.800 $.
  #
  # AVISO IMPORTANTE, y prefiero decirtelo antes de que veas el log vacio:
  # este techo y el filtro de volumen tiran el uno contra el otro. El volumen
  # EMPUJA el market cap -- son la misma magnitud en la curva de pump.fun --,
  # asi que una moneda que ya ha negociado 53 SOL dificilmente sigue por debajo
  # de 2.800 $. Es una combinacion muy estrecha: espera pocas compras, o
  # ninguna. Si a las pocas horas no ha disparado, el numero a soltar es este
  # (o el volumen), no el filtro del dev.
  min_entry_mc: 0
  # POR DEBAJO DE 2.600 $, que es practicamente el nacimiento (2.097).
  # POR DEBAJO DE 3.700 $, el mismo techo para todos: el techo aparte para el
  # creador bueno (2.800) se queda desactivado porque ahora seria MAS BAJO que
  # el general.
  max_entry_mc: 2800
  max_entry_mc_dev_top: 0
  min_curve_sol: 0
  # SIN TECHO DE VOLUMEN, y esto corrige una medida anterior.
  #
  # Se habia puesto un techo de 15 SOL porque sobre TODAS las monedas mas
  # volumen rendia peor (9,1% frente a 10,8%): mucho SOL de golpe suele ser
  # bundle. Pero esa medida no estaba condicionada.
  #
  # Cuando ya se exigen 6 carteras distintas Y market cap por debajo de 2.800,
  # el volumen alto deja de ser bundle: 20 SOL repartidos entre seis
  # compradores con el precio aun por debajo de 2.800 es demanda real que
  # todavia no ha movido el market cap.
  #
  #   con techo de 15 ... 40 casos, 45,0% aciertan, rinde +0,2280, 1,94 ops/h
  #   sin techo ......... 71 casos, 43,7% aciertan, rinde +0,2168, 3,20 ops/h
  #   el tramo que se tiraba (>15 SOL): 31 casos y el 41,9% llegaba al +75%
  #
  # Se pierden 1,3 puntos de acierto y se gana un 65% de operaciones: el SOL
  # por hora sube un 69%. Aguanta las dos mitades de la muestra (+0,186 y
  # +0,247) y sale positivo el 100% de 1.000 remuestreos.
  #
  # OJO: bajar a 5 carteras SI diluye de verdad (34,7% de aciertos, +0,1411).
  # El techo de volumen sobraba; el suelo de carteras no.
  max_volumen_sol: 0
  min_vol_ventana_sol: 0
  # Sin minimo de compras: la condicion de arranque es el volumen. Estuvo en 4
  # y era el mayor cuello del embudo -- de 38 monedas descartadas, solo 1 llego
  # a tener 3 compradores en 30 s.
  # 4 TRANSACCIONES PREVIAS antes de entrar. Cuenta operaciones de la moneda,
  # compras y ventas, no compradores distintos: es "que haya pasado algo ya".
  min_ops: 4
  # MAS COMPRA QUE VENTA. El ratio mide cuanto SOL entra frente al que sale en
  # los ultimos  segundos: 1.0 exige que entre mas del que sale.
  # El volumen solo dice que hay movimiento; esto dice hacia donde va, y evita
  # entrar justo cuando el dinero se esta yendo.
  # Las 3 ultimas operaciones tienen que ser COMPRAS: nadie ha vendido aun.
  ultimas_tx_compra: 2
  min_presion_ratio: 1.0
  presion_seg: 3.0
  min_buys: 0
  min_titulares: 6
  redes_originales: false
  min_holders_gmgn: 0
  senal_gmgn: []

  # DOS MINUTOS, no 24 horas. El bloqueo de un dia estaba tumbando el 64% de
  # todo el flujo (461 de 721 monedas): con tickers comunes, un nombre bloquea
  # al siguiente durante un dia entero. Dos minutos es lo que pediste y hace lo
  # que hacia falta: cortar al que relanza la misma moneda seguida.
  no_repeat_name_min: 2
  max_holder_pct: 0.0
  max_dev_hold_pct: 0.0
  min_holders: 0
  holder_bypass_ratio: 0

  buy_on_dex_paid:
    enabled: false
  dexscreener:
    enabled: false
    enforce: false
    block_on_error: false
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 0
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 0
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  # 40 rps con el plan ampliado de Helius. Estuvo en 8 mientras el nodo
  # devolvia 429; si vuelven a aparecer, es que el limite sigue por debajo de
  # esto y hay que bajarlo otra vez -- o revisar que el endpoint del .env sea
  # el del plan nuevo y no el viejo.
  # 20, no 40. Con 40 el nodo devolvia 429 justo al ir a leer la curva para
  # comprar -- paso con "Joe", que habia pasado TODOS los filtros. Mejor menos
  # peticiones y que las que importan entren.
  max_rps: 20
