# Experimento exclusivamente PAPER: nunca firma transacciones reales.
name: "PAPER 4 TX PRIMER BLOQUE - 20 USD"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"
enabled: false
separate_process: false
platform: "pump_fun"

trade:
  nombre_estrategia: "paper-bloque4-20usd"
  buy_amount: 0
  buy_amount_usd: 20
  fraccion_saldo: 0
  min_reserve_sol: 0
  max_posiciones: 20
  max_real_buys: 0
  reiniciar_tanda: true
  buy_slippage: 0.15
  sell_slippage: 0.25
  exit_strategy: "tp_sl"
  # Sin stop-loss ni take-profit: se observa el recorrido durante 10 minutos
  # y se registra la valoración al último precio.
  stop_loss_percentage: 0
  mc_stop_loss: 0
  max_hold_time: 0
  price_check_interval: 1

priority_fees:
  enable_dynamic: false
  enable_fixed: false
  fixed_amount: 0
  extra_percentage: 0.0
  hard_cap: 0

retries:
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 0

filters:
  listener_type: "logs"
  paper_trade: true
  paper_watch_secs: 600
  max_token_age: 0
  max_buy_age: 45
  allow_mayhem: false
  require_mayhem: false
  ignorar_listas_de_devs: true

  # El bloque de creación debe cerrar con exactamente cuatro compras.
  min_first_block_buys: 4
  max_first_block_buys: 4
  min_first_block_usd: 375
  max_first_block_usd: 900
  # La entrada se evalúa al ver la primera operación de un slot posterior.
  buy_from_second_block: true

  curva_96:
    enabled: true
    # La fuente entrega cada moneda desde su primera actividad; las puertas
    # anteriores toman la decisión cuando ya se observó el bloque siguiente.
    umbral: 0
    tope: 0.995
    buy_amount: 0
    max_compras: 0
    parar_tras_perdidas: 0
    min_compradores: 0
    min_compradores_ola: 0
    ventana_presion: 5
    min_presion_ratio: 0
    min_compra_sol: 0
    vela_seg: 1
    max_subida_vela: 0
    exigir_ver_creacion: false
    max_carteras_primer_bloque: 0
    max_sol_primer_bloque: 0
    max_bundle_pct: 0
    max_bundle_pct_sin_historia: 0
    heartbeat_interval: 300
  pumpfun_dev:
    enabled: false

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 12
