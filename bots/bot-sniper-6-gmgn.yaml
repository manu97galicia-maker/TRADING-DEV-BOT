name: "Estrategia 6"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false          # enciende/apaga desde el panel
separate_process: true
platform: "pump_fun"

trade:
  buy_amount: 0.01             # PLACEHOLDER - ajusta por estrategia
  buy_slippage: 0.35           # slippage compra 35%  (SLIP)
  sell_slippage: 0.35          # slippage venta 35%   (SLIP)

  exit_strategy: "tp_sl"
  # TP/SL: vender 50% al +50% . 25% al +140% . resto (25%) HOLD (moonbag)
  take_profit_percentage: 0.5        # TP
  take_profit_sell_percentage: 0.5   # TP
  tp2_gain: 1.4                       # TP
  tp2_sell: 0.25                      # TP
  tp3_gain: 0                         # sin tercer tramo -> moonbag 25%
  tp3_sell: 0
  stop_loss_percentage: 0.17          # SL -17%
  max_hold_time: 0                    # sin limite de tiempo (moonbag aguanta)
  price_check_interval: 2

  extreme_fast_mode: false      # false = buy_amount real (no polvo)
  extreme_fast_token_amount: 20 # (sin efecto con extreme_fast_mode: false)

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 1_000_000
  extra_percentage: 0.0
  hard_cap: 1_000_000

filters:
  listener_type: "logs"
  max_token_age: 0.001          # antiguedad max (ajusta si usas filtro de dev)
  match_string: null
  bro_address: null
  marry_mode: false
  yolo_mode: false              # false = una compra . true = continuo

  # Entrada LIMPIA - todos los filtros apagados. Actívalos por estrategia.
  dexscreener:
    enabled: false
    enforce: true
    block_on_error: true
    chain: "solana"
    require_dex_paid: false
    require_liquidity_locked: false
    min_lp_locked_pct: 50
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    min_dev_migration_rate: 0
    min_dev_launches: 3
    timeout_seconds: 6

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 25
