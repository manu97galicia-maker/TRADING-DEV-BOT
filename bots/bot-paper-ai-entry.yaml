# PAPER ONLY. MoonTok + DexScreener paid/boost candidates.
# Real trading must remain disabled until measured and explicitly approved.
name: "PAPER AI ENTRY - MoonTok + Dex Paid"
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
enabled: true
separate_process: false
platform: pump_fun

trade:
  buy_amount: 0.15
  mayhem_buy_amount: 0
  # Zero means no configured position cap; wallet reserve remains authoritative.
  max_posiciones: 0
  max_real_buys: 0
  reiniciar_tanda: false
  max_perdidas_seguidas: 0
  buy_amount_tras_sl: 0.15
  rugs_para_bloquear: 1
  buy_slippage: 0.20
  sell_slippage: 0.25
  exit_strategy: tp_sl
  take_profit_percentage: 0.25
  take_profit_sell_percentage: 0.30
  tp2_gain: 0.50
  tp2_sell: 0.25
  tp3_gain: 0.75
  tp3_sell: 0.25
  tp4_gain: 1.00
  tp4_sell: 0.04
  tp5_gain: 2.00
  tp5_sell: 0.04
  tp6_gain: 4.00
  tp6_sell: 0.04
  tp7_gain: 9.00
  tp7_sell: 0.04
  tp8_gain: 19.00
  tp8_sell: 0.04
  stop_loss_percentage: 0.18
  stop_a_entrada_tras_tp: true
  stop_al_tp_tras_tp: false
  trailing_stop_percentage: 0
  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  venta_muerta_seg: 0
  venta_muerta_gain: 0
  max_hold_time: 0
  final_target_mc: 0
  price_check_interval: 1
  extreme_fast_mode: false
  min_reserve_sol: 0.03
  tope_compra_sol: 0.40

compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 700000
  extra_percentage: 0.0
  hard_cap: 700000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0
  wait_before_new_token: 0

filters:
  # Zero keeps paper positions open until TP or SL closes them.
  paper_watch_secs: 0
  listener_type: logs
  max_token_age: 10800
  max_buy_age: 0
  min_buy_age: 0
  allow_mayhem: false
  require_mayhem: false
  marry_mode: false
  yolo_mode: true
  paper_trade: true
  ignorar_listas_de_devs: false
  max_holder_pct: 0.05
  min_holders: 0
  min_curve_sol: 0
  min_entry_mc: 0
  max_entry_mc: 0
  min_volumen_sol: 0
  max_volumen_sol: 0
  min_presion_ratio: 0
  presion_seg: 0
  min_buys: 0
  min_ops: 0
  min_titulares: 0
  redes_originales: false
  min_holders_gmgn: 0
  senal_gmgn: []
  no_repeat_name_min: 0
  max_dev_hold_pct: 0
  holder_bypass_ratio: 0
  dev_buy:
    min_sol: 0
  pumpfun_dev:
    enabled: false

  buy_on_dex_paid:
    enabled: true
    poll_interval: 1
    heartbeat_interval: 300
    max_age_minutes: 10
    # Zero disables token-age filtering. The paid event itself must still be fresh.
    max_token_age_minutes: 0
    require_volume_h24: true
    normal_buy_amount: 0.30
    small_boost_buy_amount: 0.35
    boost_threshold: 100
    boost_buy_amount: 0.40

  telegram_calls:
    enabled: false
    session_name: moontok_watcher
    normal_buy_amount: 0.15
    nitro_buy_amount: 0.17
    promoted_buy_amount: 0.20
    promotion_threshold: 500
    channels:
      - CryptoListings
      - dextools_nitro
      - DEXTNewPairsBot
      - LegendsAlphas
    suffixes:
      - pump

  # New-token alerts from the requested Discord channel. Paper only: the
  # source-specific amount overrides the default simulated entry size.
  discord_calls:
    enabled: false
    channels:
      - "1466400963509227811"
    poll_seconds: 1.0
    is_bot_token: true
    buy_amount: 0.20
    suffixes:
      - pump
  gmgn_signals:
    enabled: false

  dexscreener:
    enabled: true
    enforce: true
    block_on_error: true
    chain: solana
    require_listed: false
    require_dex_paid: false
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    timeout_seconds: 6

callouts:
  enabled: true
  publish: false
  outbox: trades/pumpfun_callout_outbox.jsonl

cleanup:
  mode: post_session
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 15
