# PAPER ONLY. MoonTok + DexScreener paid/boost candidates.
# Real trading must remain disabled until measured and explicitly approved.
name: "PAPER AI ENTRY - MoonTok + Dex Paid"
env_file: .env
rpc_endpoint: ${SOLANA_NODE_RPC_ENDPOINT}
wss_endpoint: ${SOLANA_NODE_WSS_ENDPOINT}
private_key: ${SOLANA_PRIVATE_KEY}
enabled: true
separate_process: false
platform: pump_fun

trade:
  # YA NO MANDA ESTE NUMERO (23-sep): manda el 15% del saldo, que esta en
  # `fraccion_saldo` mas abajo. Con el porcentaje encendido, el importe se
  # recalcula DENTRO del cerrojo de gasto con el saldo recien leido, y pisa
  # tanto a este numero como al de cada fuente.
  #
  # A CERO, Y NO ES UN OLVIDO. La regla de esta configuracion es que mande
  # UNO de los dos, nunca los dos: dejar aqui un numero mientras el porcentaje
  # esta encendido es un numero que parece decidir y no decide. Los tres
  # sitios que pueden mandar importe --este, titulares y telegram-- van a cero
  # juntos, para que no quede ninguno pareciendo que manda.
  #
  # Si algun dia se apaga el porcentaje, hay que poner un numero aqui: con los
  # dos a cero el bot no compraria, que es un fallo ruidoso y no uno silencioso.
  buy_amount: 0
  mayhem_buy_amount: 0
  # Posiciones abiertas A LA VEZ. TECHO DE 5, y por debajo manda el SALDO.
  # Son dos frenos, y gana siempre el que se quede corto.
  #
  # El del saldo: antes de abrir cada posicion el bot lee el saldo REAL y
  # solo entra si queda hueco para
  #     saldo - min_reserve_sol - lo ya comprometido >= compra + 0,003
  # Ese 0,003 por posicion cubre sus propias comisiones y la renta de la
  # cuenta de token, asi que la reserva global (min_reserve_sol) NO se va en
  # rentas y siempre queda gas para VENDER lo que esta abierto.
  #
  # OJO: poner 5 aqui no hace que haya 5. Lo que hace falta en la cartera
  # para que quepan las cinco, contando la reserva de 0,03:
  #     compra 0,12 (el tope de hoy)   -> 0,645 SOL
  #     compra 0,26 (curva 96%)        -> 1,345 SOL
  #     compra 0,495 (el tope de ago)  -> 2,52 SOL
  #
  # AL SUBIR DE 0,07 A 0,12 EL 19-SEP se perdieron posiciones con saldo
  # pequeno: con medio SOL caben TRES, no cinco. Con 0,07 cabian las cinco
  # ya con medio SOL. Para las cinco con 0,12 hacen falta 0,645.
  # Con menos saldo caben menos, y no es un fallo: es el guardian evitando
  # quedarse sin SOL para cerrar.
  #
  # Y CUESTAN POSICIONES. Con la compra tope, segun el saldo:
  #     0,5 SOL -> 0 posiciones (no cabe ni una: 0,495 + colchon > 0,47)
  #     1,0 SOL -> 1
  #     2,0 SOL -> 3
  #     2,6 SOL -> 5
  # Subir el tamano de compra y subir el numero de posiciones tiran en
  # sentidos contrarios. Si lo que se quiere son las 5, la palanca es bajar
  # tope_compra_sol, no subirlo.
  #
  # Por que 5 y no mas: cada posicion abierta consulta su precio CADA
  # SEGUNDO (price_check_interval: 1) y el nodo esta limitado a 15 por
  # segundo (node.max_rps). Pasadas ~7 las consultas se encolan y el stop
  # loss reacciona tarde, que es justo cuando mas duele. Con 5 hay margen.
  # Si algun dia quieres mas, sube price_check_interval ANTES que esto.
  max_posiciones: 5
  # Tope de por vida de compras reales. Empieza en 1 a proposito: el camino
  # de compra de mints EXISTENTES nunca se ha ejecutado contra una compra de
  # verdad (hay avisos en token_builder.py y en las tres fuentes). Con 1 se ve
  # si la transaccion entra antes de repetir el mismo fallo tres veces.
  # 0 = sin tope de compras. Este contador es POR TANDA y la tanda solo
  # cierra cuando no queda NINGUNA posicion abierta: con un numero aqui, si
  # una cierra y la otra sigue viva, no se compra la que falta. Quien limita
  # cuantas hay a la vez es max_posiciones, no esto.
  max_real_buys: 0
  # Cierra la tanda y pone el contador a 0 cuando no queda ninguna posicion
  # abierta, para que el bot pueda seguir comprando. En false, max_real_buys
  # deja de ser un tope POR TANDA y se convierte en un apagado con retardo:
  # hechas esas compras el bot se calla para siempre aunque el servicio siga
  # "active". El 19-ago eso dejo tres bots 23 horas sin comprar con 4.435
  # monedas cumpliendo los filtros por delante.
  reiniciar_tanda: true
  max_perdidas_seguidas: 0
  # SIN COMPRA REDUCIDA TRAS UN STOP LOSS. Mientras mande el porcentaje esto
  # no puede hacer nada: el importe se recalcula despues, dentro del cerrojo de
  # gasto, y cualquier numero que se ponga aqui se pierde. Se deja a 0 para que
  # la configuracion diga la verdad. Si algun dia vuelve el importe fijo y se
  # quiere recuperar la idea, hay que hacerlo como FRACCION del porcentaje, no
  # como una cantidad suelta.
  buy_amount_tras_sl: 0
  rugs_para_bloquear: 1
  buy_slippage: 0.10
  sell_slippage: 0.1
  # SLIPPAGE DE LAS VENTAS QUE SALVAN LA POSICION (stop loss, anti-rug,
  # panico). 23-sep.
  #
  # EL FALLO QUE COSTO UN -52% EN CATO. El slippage no es una preferencia: es
  # un SUELO escrito en la transaccion. Con 0,1 la venta le dice a la cadena
  # "no aceptes menos del 90% de lo que vale ahora"; si mientras la
  # transaccion vuela el precio cae mas de ese 10%, la cadena la RECHAZA. En
  # una moneda que se parte por la mitad en segundos eso significa que el
  # stop loss dispara a -28%... y la venta no entra. Y no entra la siguiente.
  # Tras tres fallos el bot espera 20 s antes de reintentar una venta
  # protectora, y para entonces la moneda esta a -52%.
  #
  # Un take profit SI puede permitirse rechazar un mal precio: si no sale hoy
  # sale manana. Un stop loss no: lo que se pierde por no ejecutarlo es mucho
  # mayor que lo que cuesta ejecutarlo mal. Por eso aqui el suelo va ancho.
  #
  # NO SIGNIFICA QUE SE VENDA UN 50% MAS BARATO: es un suelo, no un objetivo.
  # Se cobra el precio de mercado, que casi siempre esta muy por encima. El
  # suelo solo entra en juego cuando el precio de verdad se ha desplomado --
  # que es exactamente cuando hay que salir aunque duela.
  sell_slippage_proteccion: 0.50
  exit_strategy: tp_sl
  # ESCALERA. Los porcentajes son de la cantidad ORIGINAL, no de lo que
  # queda: el 10% del primer peldano es el 10% de lo que se compro.
  #
  #   cerca:  10% a +25%   25% a +48%   32,7% a +80%  = 67,7%
  #   lejos:  7,7% a x2,5  6,5% a x3,3  5,3% a x5
  #           4,2% a x7    3,0% a x10   1,8% a x15   1,8% a x20  = 30,3%
  #   moonbag: 2%, que vende Manu a mano. El bot no lo toca.
  #
  # ULTIMO CAMBIO (19-sep), pedido: "quita un total de un 10 por ciento del
  # primer escalon y repartelo entre el tercero en adelante". El primero baja
  # de 20% a 10% y esos diez puntos se reparten del tercero para arriba EN
  # PROPORCION a lo que ya vendia cada uno. Proporcional y no a partes
  # iguales a proposito: repartir igual habria subido el x20 de 1,5 a 2,75
  # --un 83% mas-- y el +80% solo un 4%, o sea cargar el peso en los
  # peldanos que casi nunca se alcanzan. La forma de la escalera se respeta.
  #
  # EL PRECIO DE ESO, dicho claro y en numeros: el primer peldano ahora cobra
  # el 10% de un +25%, o sea un +2,5% de la posicion -- 0,66 $ con una compra
  # de 0,12 SOL. El stop cuesta -18%, que son 4,75 $. Antes hacian falta tres
  # ganadores de primer peldano para pagar un perdedor; ahora hacen falta
  # SIETE.
  #
  # Lo que de verdad protege no es ese cobro, es `stop_a_entrada_tras_tp`: en
  # cuanto salta el primer peldano el stop sube al precio de compra, asi que
  # lo que sigue dentro ya no puede perder dinero (salvo hueco de precio). Ese
  # efecto NO cambia con este reparto -- salta igual de pronto, porque el
  # gatillo es el +25%, no cuanto se venda alli.
  #
  # Y lo que se gana: si la moneda pasa del +80%, ahora hay mas posicion
  # dentro para cobrarla. El punto en que se recupera la compra sigue siendo
  # el tercer peldano.
  #
  # TODO LO QUE SE VENDE ES FRACCION DE LA COMPRA ORIGINAL, no de lo que
  # queda dentro. El tercer peldano nacio de "al +80% vende la MITAD DE LO
  # QUE QUEDA": a esa altura quedaba el 55% y la mitad era 27,5. Tras este
  # reparto ya no es la mitad exacta (32,7 de un 65% restante), y es correcto:
  # manda lo pedido ahora.
  take_profit_percentage: 0.30
  take_profit_sell_percentage: 0.20
  tp2_gain: 0.50
  tp2_sell: 0.199
  tp3_gain: 0.80
  tp3_sell: 0.182
  # DE AQUI EN ADELANTE, EL RESTO REPARTIDO HASTA x20. Queda el 27,5% de la
  # compra; se deja corriendo el 2% de siempre y los otros 25,5 se reparten
  # en siete peldanos, de mas a menos: llegar a x20 es mucho menos probable
  # que llegar a x2,5, asi que el trozo gordo se cobra pronto.
  #
  # OJO AL FORMATO: de aqui para abajo la ganancia es MULTIPLO MENOS UNO.
  # 1.50 es x2,5 -- no un +150% suelto que se pueda confundir con los de
  # arriba. 19.00 es x20.
  tp4_gain: 1.50   # x2,5
  tp4_sell: 0.101
  tp5_gain: 2.30   # x3,3
  tp5_sell: 0.085
  tp6_gain: 4.00   # x5
  tp6_sell: 0.069
  # PELDANOS LEJANOS. Antes llegaban a x50 y x100; ahora la escalera termina
  # en x20 porque es lo pedido. Consecuencia, dicha en claro: una moneda que
  # pase de x20 ya no tiene peldanos por encima -- lo unico que sigue dentro
  # es el 2% que se vende a mano.
  #
  # Estos SI pueden dispararse: `max_hold_time` esta a 0, o sea que una
  # posicion ya no se cierra por reloj. Si alguien vuelve a ponerle un
  # reloj corto, estos peldanos dejan de tener sentido (hay un test que
  # avisa: test_los_peldanos_altos_tienen_tiempo_de_llegar).
  tp_extra:
    - gain: 6.00     # x7
      sell: 0.056
    - gain: 9.00     # x10
      sell: 0.040
    - gain: 14.00    # x15
      sell: 0.024
    - gain: 19.00    # x20
      sell: 0.024
  # 28% (23-sep, pedido). Historial: 18% -> 28%.
  #
  # SOLO MANDA HASTA EL PRIMER PELDANO. En cuanto la moneda toca el TP1
  # (+30%), el suelo se sube a precio de compra +5% (`margen_stop_tras_tp`)
  # y este numero deja de usarse en esa posicion. O sea que el 28% es lo que
  # se arriesga ANTES de que la moneda demuestre nada.
  #
  # Que se gana y que se pierde: un stop mas ancho aguanta los tirones
  # normales de una memecoin recien nacida, que con el 18% cerraban en rojo
  # posiciones que luego subian. A cambio, cuando la moneda va de verdad a
  # cero, se pierde un 28% en vez de un 18%.
  stop_loss_percentage: 0.28
  # EL STOP SE LLEVA LA POSICION ENTERA, moonbag incluido.
  #
  # Antes dejaba el 2% corriendo en una moneda que se estaba cayendo a cero:
  # por eso un stop de -18% podia acabar en -20%. El moonbag tiene sentido
  # cuando la moneda VA BIEN y se deja correr; cuando salta el stop, lo que
  # queda no es una apuesta, es una bolsa hundiendose.
  #
  # OJO, esto NO toca el moonbag de las que ganan: si la moneda recorre la
  # escalera, el 2% sigue reservado para venderlo a mano. Solo desaparece
  # cuando salta el stop.
  #
  # Ademas encaja con la renta: vendida la posicion entera la cuenta de token
  # queda a cero, y `cleanup.mode: after_sell` la cierra y recupera sus
  # ~0,00204 SOL. Con el 2% dentro no se puede cerrar.
  vender_todo_en_stop: true
  stop_a_entrada_tras_tp: true
  # AL TOCAR UN ESCALON, EL SUELO SE VA UN 12% POR ENCIMA del
  # escalon anterior (del precio de compra, en el primero). Pedido:
  # "si toca tp1 vamos a subir stop loss a precio de compra +12%
  # asegurando asi ganancias, lo mismo para los demas escalones".
  #
  # CON ESTO, TOCAR +25% YA ASEGURA +12% sin haber vendido nada.
  #
  # LO QUE OBLIGA, y por eso el TP2 subio de +48% a +50%: el suelo
  # tiene que quedar por DEBAJO del escalon que acaba de tocarse. Con
  # el margen al 12%, dos escalones seguidos tienen que distar mas de
  # un 12%. Con el TP2 en +40% el suelo caia en +40% exacto y la
  # posicion se cerraba sola en el instante de cumplir su objetivo.
  #
  # EL COLCHON MAS APRETADO queda en 6,7% (escalones 2 y 3): eso es lo
  # que puede caer la moneda tras tocarlos antes de que cierre. En una
  # memecoin son segundos, asi que cobrar el TP2 o el TP3 y salir sera
  # lo normal. Es la consecuencia del 12%, no un fallo. Para aflojar,
  # bajar este numero.
  # BAJADO DEL 12% AL 5% (23-sep, pedido: "ten mas paciencia con las
  # monedas"). Es cuanto se sube el suelo por encima del peldano anterior
  # cada vez que se cobra uno.
  #
  # POR QUE APRETABA TANTO. El suelo tras un peldano es el ANTERIOR mas este
  # margen, asi que cuanto mas alto, menos aire queda entre el suelo y el
  # peldano que se acaba de tocar. Con el 12% y el TP1 en +30%, el colchon
  # tras el TP2 era del 2,9%: un respiro normal de memecoin cerraba la
  # posicion entera justo despues de cobrar.
  #
  # QUE SE PIERDE: tras tocar el TP1 el suelo queda en compra +5% en vez de
  # +12%, o sea que se asegura menos. Sigue siendo verde: la operacion no
  # puede acabar en perdida una vez tocado el primer peldano.
  margen_stop_tras_tp: 0.05
  stop_al_tp_tras_tp: false
  trailing_stop_percentage: 0
  anti_rug_ratio: 2.0
  anti_rug_seg: 4
  anti_rug_min_sol: 3
  # SIN MOVIMIENTO: a los 3 minutos se mira UNA vez. Si no ha hecho al menos
  # un +2%, la moneda esta muerta (una con volumen de verdad se mueve) y se
  # vende entera. Si a esa altura va por encima, se la deja y ya mandan los TP.
  # 8 MINUTOS (23-sep, antes 3). Mas paciencia: tres minutos es muy poco para
  # que una moneda arranque, y cerrar ahi era renunciar a las que tardan.
  venta_muerta_seg: 480
  venta_muerta_gain: 0.02
  # POR DEBAJO DE LA COMPRA 3 MINUTOS SEGUIDOS: fuera, moonbag incluido. El
  # contador se reinicia en cuanto recupera el precio de entrada, asi que
  # exige 180 segundos SIN levantar cabeza, no 180 sueltos.
  # 10 MINUTOS SEGUIDOS bajo la compra (23-sep, antes 3). El contador se
  # reinicia en cuanto recupera la entrada, asi que exige diez minutos SIN
  # levantar cabeza. Quien corta las que se hunden de verdad es el stop loss,
  # no este reloj.
  venta_bajo_entrada_seg: 600
  # SIN RELOJ. 0 = una posicion no se cierra por tiempo. Lo que la saca son
  # las reglas que miran a la MONEDA, que ya cubren el caso de la muerta:
  #   - venta_muerta_seg: a los 8 min, si no ha hecho ni +2%, fuera
  #   - venta_bajo_entrada_seg: 10 min seguidos bajo la compra, fuera
  #   - stop loss, y stop a la entrada tras el primer TP
  # La que sobrevive a todo eso es una que subio y se mantuvo: justo la que
  # no hay que cortar por reloj. Sin esto, los peldanos de x10 a x100 no se
  # disparaban nunca.
  max_hold_time: 0
  # Tope duro de vigilancia de UNA posicion, para que una moneda invendible
  # (un rug) no retenga un hueco para siempre. Es independiente del de
  # arriba a proposito: estaba atado a el, y poner max_hold_time a 0 hacia
  # que el bot abandonase cada posicion a los 8 MINUTOS.
  abandonar_tras_seg: 86400
  final_target_mc: 0
  # MODO ESTUDIO: NO SE COMPRA NADA NUEVO.
  #
  # El bot escucha, filtra, decide y APUNTA cada compra que habria hecho --con
  # su importe y su fuente-- pero no firma ninguna. Es lo que hace falta para
  # estudiar sin arriesgar: al cabo de un dia se sabe cuantas oportunidades da
  # cada fuente, y luego se puede comprobar que habria pasado con cada una.
  #
  # POR QUE ESTO Y NO PARAR EL BOT. Parar el servicio deja las posiciones que
  # YA estan abiertas sin stop loss y sin escalera: el dinero que ya esta
  # dentro se queda a ciegas. Con esta bandera el bot sigue vigilandolas y
  # vendiendolas normalmente; lo unico que no hace es abrir nuevas.
  #
  # Las compras apuntadas van a trades/trades.log con action
  # "compra_en_pausa", asi que no se confunden con las de verdad.
  #
  # Poner false para volver a comprar.
  pausar_compras: false
  # Cada cuanto avisa por Telegram de POR QUE no esta comprando, si no compra
  # nada en ese rato. Si compra, no manda nada: un aviso que sale siempre deja
  # de leerse. 0 lo apaga.
  resumen_descartes_seg: 300
  price_check_interval: 1
  # PRECIO DEL STREAM. El bot ya esta suscrito a todas las operaciones de
  # pump.fun, y cada una publica las reservas virtuales que quedan despues:
  # o sea, el precio exacto en el instante en que se forma. Hasta ahora eso
  # se tiraba y se le preguntaba al nodo una vez por segundo.
  #
  # Que cambia: el take profit y el stop loss reaccionan EN LA OPERACION, no
  # hasta un segundo despues. Y se dejan de gastar 5 peticiones por segundo
  # del nodo (una por posicion abierta).
  #
  # Los 8 segundos NO son "cada cuanto caduca el precio" -- en una bonding
  # curve el precio no se mueve si nadie opera, asi que uno de hace 20
  # segundos sin operaciones de por medio sigue siendo el precio. Son el
  # seguro por si el stream se cae: un websocket cortado no avisa, deja de
  # mandar eventos, y desde dentro eso se ve igual que "no hay operaciones".
  # Pasados esos segundos se vuelve a preguntar al nodo, que es lento pero
  # no miente. 0 = apagado, comportamiento de siempre.
  precio_stream_seg: 8
  # Cada cuanto da una vuelta el monitor cuando el stream esta encendido.
  # No cuesta peticiones: al nodo se le sigue preguntando cada
  # `price_check_interval`, pase lo que pase.
  tick_stream_seg: 0.25
  extreme_fast_mode: false
  min_reserve_sol: 0.03
  # POLVO. Por debajo de este valor una posicion deja de gestionarse: suelta
  # su plaza de las 5 y se deja de consultar su precio cada segundo.
  #
  # El motivo es economico, no de limpieza: vender cuesta comision de
  # prioridad mas la renta de la cuenta de token, asi que por debajo de un
  # dolar la venta se lleva mas de lo que recupera. El stop loss y los take
  # profit no tienen nada que defender ahi, y mientras tanto esa bolsa
  # bloquea una plaza y gasta una de las 15 consultas por segundo del nodo.
  #
  # La bolsa NO se vende ni se pierde: se queda en la wallet y la recoge la
  # limpieza de cuentas. 0 desactiva la regla.
  valor_minimo_posicion_usd: 1.0
  # PORCENTAJE DEL SALDO: 15% (23-sep, pedido). Historial: 0,25 unas horas el
  # 19-sep -> apagado -> 0,15.
  #
  # MANDA ESTE, no el importe fijo de arriba: con cualquier valor mayor que
  # cero, el porcentaje SUSTITUYE al importe fijo dentro del cerrojo de gasto.
  # Los dos no pueden mandar a la vez.
  #
  # ES SOBRE EL SALDO LIBRE, no sobre el total: se descuentan la reserva
  # minima y lo ya comprometido por las posiciones abiertas. Por eso con cinco
  # plazas no se compromete el 75% de la cartera -- cada compra es el 15% de
  # lo que queda, asi que van menguando solas.
  #
  # OJO CON EL SUELO. A partir de cierto saldo el 15% se queda tan pequeno que
  # los costes fijos --la renta de la cuenta de token y la comision de
  # prioridad, que no bajan con el tamano-- se comen la operacion. Con un
  # saldo de 0,2 SOL el 15% son 0,03, que ya es territorio de nacer perdiendo.
  # Si pasa a menudo, lo que hay que poner es `compra_minima_sol`.
  fraccion_saldo: 0.15
  # SIN TOPE DURO (19-sep, pedido por Manu). 0 = no se recorta nada.
  #
  # QUE SE PIERDE: era el ultimo freno contra un fallo de calculo. El 12-ago la
  # cadena registro compras de 0,25 y 0,30 SOL con `buy_amount: 0.15`
  # configurado, y nunca se supo por que; este tope es lo que se puso entonces
  # para que no volviera a pasar.
  #
  # QUE SIGUE PROTEGIENDO: el guardian del saldo. Antes de firmar, el bot lee
  # el saldo REAL y exige que quepa la compra mas el slippage mas las
  # comisiones, dejando intacta la reserva de 0,03. Eso no se puede saltar, asi
  # que un fallo no puede vaciar la cartera -- como mucho gastaria de mas
  # dentro de lo que hay.
  tope_compra_sol: 0
  # SI NO LLEGA EL SALDO, SE COMPRA CON EL 75% DE LO QUE QUEDE en vez de
  # saltarse la moneda. Pedido el 19-sep.
  #
  # NO es lo mismo que `fraccion_saldo`, y confundirlas cuesta dinero:
  # aquella compra SIEMPRE ese porcentaje del saldo, asi que con la wallet
  # llena compraria muchisimo mas de los 0,12. Esta solo entra cuando la
  # compra normal no cabe.
  #
  # El 75% se toma de lo que queda LIBRE, que ya es el saldo menos la
  # reserva de 0,03 y menos lo comprometido por las posiciones que se
  # estan abriendo. El 25% que se deja es lo que cubre el slippage y las
  # comisiones.
  fraccion_si_no_llega: 0.75
  # SIN SUELO DE COMPRA (19-sep, pedido por Manu). 0 = compra con lo que haya.
  #
  # QUE SE PIERDE, en numeros: la comision de prioridad y la renta de la cuenta
  # de token NO bajan con el tamano de la compra. Con la comision de compra en
  # ~0,00098 SOL, una compra de 0,005 SOL se deja el 20% en entrar y otro tanto
  # en salir: nace perdiendo casi la mitad y ni un x2 la recupera.
  #
  # Con esto a 0 el bot ya no se para por saldo bajo. Antes, con el 25%, por
  # debajo de 0,11 SOL se quedaba quieto; ahora comprara igual, mas pequeno.
  compra_minima_sol: 0

compute_units:
  buy: 140000
  sell: 120000

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  # LA UNIDAD SON MICROLAMPORTS POR UNIDAD DE COMPUTO, no SOL. El coste real
  # depende de las CU de cada operacion (bloque `compute_units` mas arriba):
  #
  #   coste_SOL = fixed_amount * compute_units / 1e15
  #
  # Con 140.000 CU (comprar):  7.000.000 -> ~0,00098 SOL  (~0,22 $)
  # Con 120.000 CU (vender):   1.000.000 -> ~0,00012 SOL  (~0,03 $)
  #
  # El comentario anterior decia "fixed_amount / 1e10" y daba el numero
  # aproximado, pero escondia que depende de las CU.
  #
  # POR QUE COMPRAR Y VENDER NO PAGAN LO MISMO. Una posicion se compra UNA vez
  # y se vende hasta DIEZ, una por peldano de la escalera. Poner la comision
  # rapida en las dos significaria pagarla once veces: ~0,0084 SOL solo en
  # ventas, el 7% de una posicion de 0,12 SOL. Comprar tarde cuesta mucho mas
  # que vender un bloque tarde, asi que la prisa se paga donde hace falta.
  fixed_amount: 1000000
  # LA DE COMPRAR (19-sep, pedida por Manu: ~0,001 SOL). Si se quita esta
  # linea, comprar y vender vuelven a pagar lo mismo.
  #
  # OJO SI SE TOCA: esta comision va por `priority_fee_override`, que NO pasa
  # por el calculo normal y por tanto NO lo recortaria el `hard_cap`. El bot lo
  # recorta a mano al arrancar para que el tope siga siendo un tope, pero eso
  # significa que subir esto sin subir el `hard_cap` no hace nada.
  fixed_amount_compra: 7000000
  extra_percentage: 0.0
  # EL TOPE. Estaba en 1.000.000, el mismo valor que `fixed_amount`, asi que
  # cualquier intento de subir la comision se recortaba solo y en silencio
  # (con un `logger.warning` enterrado como unica pista).
  hard_cap: 10000000

retries:
  max_attempts: 2
  wait_after_creation: 0
  wait_after_buy: 0
  wait_before_new_token: 0

# TELEGRAM SILENCIADO (19-sep, pedido por Manu: "parate telegram de momento").
#
# `false` = no se manda NADA, avisos de caida incluidos. La lista vacia `[]` NO
# vale para esto: significa "todos", que es contraintuitivo y por eso existe el
# `false`.
#
# LO QUE SE PIERDE MIENTRAS ESTE ASI, dicho claro:
#   - el parte cada 5 min con el embudo (cuantas monedas se vieron, cuantas
#     llegaron al corte, por que se cayeron las demas). Es lo unico que se lee
#     desde el movil para saber si la estrategia encuentra algo.
#   - los avisos de compra y de venta.
#   - el aviso de que el bot se ha caido.
#   - el aviso de fallo de programacion.
#
# Todo eso sigue yendo al log; lo que se apaga es el mensajero. Para volver a
# encenderlo: borrar esta linea, o ponerla a `true`.
avisos_telegram: false

filters:
  listener_type: logs
  # Antiguedad EN LA COLA interna, no de la moneda. Con compra instantanea
  # una senal que lleva parada mas de 2 min ya no vale la pena.
  max_token_age: 120
  max_buy_age: 0
  min_buy_age: 0
  # SOLO MONEDAS DE PUMP.FUN NORMALES (19-sep, pedido por Manu). En false el
  # bot descarta las que van en modo mayhem.
  #
  # IDA Y VUELTA DE ESTA LINEA, para que no se vuelva a mover sin querer:
  #   false -> siempre
  #   true  -> el 19-sep, al repasar filtros: estaba descartando monedas en
  #            silencio sin que nadie lo hubiera pedido, con la estrategia de
  #            "solo dos condiciones".
  #   false -> el mismo dia, pedido en claro: "solo moneda de pumpfun normal".
  #
  # Lo pedido manda: el repaso de filtros buscaba que nada descartara A
  # ESPALDAS de Manu, no que se comprara de todo.
  allow_mayhem: false
  require_mayhem: false
  marry_mode: false
  yolo_mode: true
  paper_trade: false
  # NO SE MIDEN DEVS. Pedido el 19-sep: "que no mida devs, solo si una
  # moneda nueva llega a los 99 holders, nada mas".
  #
  # En false corrian dos listas que descartaban por el CREADOR y no por la
  # moneda: la blacklist manual y el auto-baneo por rugs (`rugs_para_bloquear`
  # a 1, o sea que un solo rug apuntado dejaba a ese dev fuera para
  # siempre). Ninguna de las dos es una de las dos condiciones.
  #
  # LO QUE CUESTA, dicho claro: un dev al que ya le has visto hundir una
  # moneda vuelve a ser comprable. Si su siguiente lanzamiento llega a 99
  # titulares en menos de cinco minutos, el bot entra igual.
  #
  # Las listas NO se borran: siguen en disco y vuelven poniendo esto en
  # false. El filtro de reputacion en vivo (`pumpfun_dev`) ya estaba
  # apagado, y `max_dev_hold_pct`/`dev_buy.min_sol` estan a 0.
  ignorar_listas_de_devs: true
  # Rechaza si UN titular tiene mas de esta fraccion del supply. Estaba en
  # 0.05 y era el filtro que mas compras tumbaba: ese 5% viene del sniper
  # viejo, que compraba monedas recien creadas donde un titular gordo a los
  # diez segundos es un insider. Esta estrategia compra lo contrario --
  # monedas con recorrido que alguien acaba de promocionar -- y ahi un
  # titular por encima del 5% es lo normal (compradores tempranos, el dev,
  # quien puso la liquidez del pool). 0.15 sigue cortando el caso de verdad
  # feo: una sola cartera con una septima parte del supply.
  max_holder_pct: 0
  min_holders: 0
  min_curve_sol: 0
  min_entry_mc: 0
  max_entry_mc: 0
  min_volumen_sol: 0
  max_volumen_sol: 0
  min_presion_ratio: 0
  presion_seg: 0
  min_buys: 0
  min_ops: 0
  min_titulares: 0
  redes_originales: false
  min_holders_gmgn: 0
  senal_gmgn: []
  no_repeat_name_min: 0
  max_dev_hold_pct: 0
  holder_bypass_ratio: 0
  dev_buy:
    min_sol: 0
  pumpfun_dev:
    enabled: false

  buy_on_dex_paid:
    enabled: false
    # 3s. Cada vuelta cuesta ahora 2 llamadas (los dos feeds), y cada feed
    # tiene su propio cubo de 60/min, asi que 20 vueltas por minuto caben de
    # sobra. Bajarlo mas no gana nada: por debajo de ~2s el cuello pasa a ser
    # la red, y sobre todo el retraso con que DexScreener publica los pagos,
    # que son MINUTOS y no dependen de nosotros.
    poll_interval: 3
    heartbeat_interval: 300
    # Antiguedad maxima del pago o el boost. 0 = no filtra: el feed que se
    # consulta ya es el de "ultimos", asi que la frescura la garantizan el
    # propio feed y el registro de lo ya visto.
    max_age_minutes: 0
    # Entradas del feed que se miran en cada vuelta. Estaba fijo en 10 y se
    # veia 1 senal cada 2 horas: en una ventana tan estrecha una moneda entra
    # y sale entre dos sondeos sin llegar a verse.
    candidatos_por_vuelta: 30
    # 0 = la edad de la moneda no filtra. Una moneda vieja que acaba de
    # recibir un pago o un boost sigue trayendo volumen, y esa es la senal.
    # El pago SI debe ser reciente: eso lo sigue midiendo max_age_minutes.
    max_token_age_minutes: 0
    # Comprar tambien las que YA MIGRARON de la curva a PumpSwap. Quien paga
    # DexScreener suele hacerlo cuando la moneda ya tiene traccion, y para
    # entonces muchas han salido de la curva: descartarlas tira buena parte
    # de la senal. Estas se compran y se venden por el pool (via Jupiter).
    #
    # OJO: en una migrada NO hay curva, asi que el anti-rug en vivo y
    # min_curve_sol no la protegen. Solo queda el stop y el max_hold_time.
    incluir_migradas: true
    # Comprar tambien monedas que NUNCA fueron de pump.fun (Raydium, otros
    # lanzadores). Se entra y se sale por Jupiter igual que con las migradas.
    #
    # OJO, aqui se pierde MAS que con una migrada de pump.fun: no hay creador
    # ni historial de dev que mirar, el supply no es el fijo de pump.fun (asi
    # que max_holder_pct puede dar numeros raros), y aparecen cosas que en
    # pump.fun no pueden pasar: autoridad de congelacion (te bloquean la
    # venta), comision por transferencia, supply mintable.
    #
    # Por eso al encenderlo se activa RugCheck y se exige liquidez bloqueada.
    # Sin informe de RugCheck, la moneda se descarta.
    incluir_cualquier_origen: true
    min_lp_locked_pct: 50
    # REGIMEN APARTE para las de fuera de pump.fun. No se les puede aplicar
    # el mismo rasero: alli el supply no es el fijo de pump.fun, no hay curva
    # ni creador que mirar, y aparecen cosas que en pump.fun no pueden pasar
    # (autoridad de congelacion, comision por transferencia, supply mintable).
    #
    # Se prueban con la correa corta, sin tocar a las de casa:
    #   - un titular por encima del 5% del supply la descarta (las de
    #     pump.fun siguen con su 15%, que alli es lo normal)
    #   - como mucho 3 compras
    #   - a las 2 perdidas se dejan de comprar, y las de pump.fun siguen
    #   - se arriesgan 2/3 del importe normal
    otros_max_holder_pct: 0.05
    #   - market cap minimo de 6.000 $: sin curva ni creador que mirar, un
    #     market cap ridiculo es la senal mas clara de que no hay nadie detras
    otros_min_market_cap: 6000
    otros_factor_importe: 1.0
    # PREMIO POR BOOSTS, para CUALQUIER origen. Pagar 30 boosts es un
    # compromiso real con la moneda, venga de pump.fun, de PumpSwap o de
    # Raydium. Se multiplica con el factor de origen: una de fuera con
    # boosts sube, pero sigue por debajo de una de casa con los mismos.
    #
    # OJO: `tope_compra_sol` recorta despues, asi que en las de pump.fun
    # este premio empuja hasta el tope y ahi se queda.
    boost_extra_umbral: 0
    boost_extra_factor: 1.0
    otros_max_compras: 3
    otros_parar_tras_perdidas: 2
    # IMPORTES, en SOL cerrados (estan en TRAMOS_IMPORTE, en el codigo):
    #
    #                      pump.fun/PumpSwap   Raydium y otros
    #   hasta 50 boosts          0,25               0,18
    #   mas de 50 boosts         0,30               0,20
    #
    # El descuento por procedencia ya va en la tabla, asi que
    # otros_factor_importe se queda en 1: aplicarlo otra vez descontaria dos
    # veces. Y boost_extra_umbral pasa a 0 porque los tramos ya suben el
    # importe con los boosts; tenerlo encima seria contar lo mismo dos veces.
    normal_buy_amount: 0.07

  # DEXTools DEXTboard. La API v2 NO tiene endpoint de "quien pago NITRO":
  # sus 19 endpoints son blockchain/exchange/pool/token/rankings. Lo que si
  # se puede leer es el EFECTO del pago -- un pack NITRO (200 pts/199 $ hasta
  # 5000 pts/3.999 $, boost de 24 h) compra posicion en el DEXTboard, y el
  # DEXTboard es /ranking/solana/hotpools.
  #
  # Dispara al ENTRAR en el ranking, no por estar en el: estar dentro es un
  # estado que dura horas, entrar es un suceso. La foto del arranque se
  # registra sin comprar.
  #
  # Necesita DEXTOOLS_API_KEY y DEXTOOLS_API_TIER en el .env. El plan va DENTRO
  # de la URL (/trial/v2, /standard/v2...), asi que una clave puesta contra
  # el plan equivocado devuelve 401 y la fuente se queda muda.
  dextools_hotpools:
    enabled: false
    poll_interval: 15
    heartbeat_interval: 300
    limit: 30
    # El puesto es lo mas parecido a "cuanto se han gastado" que esta API
    # deja leer: subir mas alto cuesta mas NITRO. Tres escalones, igual que
    # DexScreener (por boosts) y Telegram (por Nitro); esta fuente nacio con
    # dos y saltaba de golpe de 0,21 a 0,28 sin paso intermedio.
    #   puesto 1-10  -> promocionado
    #   puesto 11-20 -> medio
    #   puesto 21-30 -> normal
    promoted_rank: 10
    medium_rank: 20
    normal_buy_amount: 0.07
    medium_buy_amount: 0.07
    promoted_buy_amount: 0.07
    incluir_migradas: true
    # A diferencia de la fuente de DexScreener, aqui el bloqueo de liquidez
    # lo comprueba la propia API de DEXTools (/locks y /audit), no RugCheck.
    incluir_cualquier_origen: false
    min_lp_locked_pct: 50

  # Birdeye: dispara cuando una moneda ENTRA en la lista de tendencias
  # (no por estar en ella). La foto del arranque se registra sin comprar.
  # Necesita BIRDEYE_API_KEY en el .env; sin clave la fuente no arranca y
  # el heartbeat lo avisa.
  #
  # DESACTIVADA a proposito. Tendencia es senal de ATENCION, no de que
  # nadie haya pagado: no es el equivalente al paid de DexScreener ni al
  # Nitro de DEXTools. Lo que Birdeye cobra es su Token Info Update
  # Service (200-300 $, verificacion en 2-7 dias habiles), que no tiene
  # endpoint de "quien acaba de pagar" y ademas llega dias tarde: inutil
  # para una moneda de pump.fun. Encima la mayoria de las tendencias ya
  # migraron fuera de la curva y se descartan solas.
  # Para probarla igualmente: enabled: true. El codigo esta listo.
  birdeye_trending:
    enabled: false
    poll_interval: 30
    heartbeat_interval: 300
    limit: 20
    buy_amount: 0.07
    # Suelos a 0 para la primera muestra: en papel interesa medirlo todo y
    # filtrar despues con los datos. Subelos cuando results.jsonl tenga
    # muestra suficiente.
    min_liquidity_usd: 0
    min_volume_h24: 0

  # ====================================================================
  # CURVA CASI LLENA (pump.fun, sin depender de que nadie pague nada)
  # ====================================================================
  # La idea: cuando a una curva de pump.fun le queda un 4% para llenarse,
  # esta a punto de migrar a PumpSwap, y la migracion es cuando entra la
  # gente que no mira pump.fun. Aqui no hace falta que nadie haya pagado
  # DexScreener ni que salga en ningun canal: el dato es de la cadena.
  #
  # LO QUE CUESTA: cero llamadas al nodo para VIGILAR. Cada operacion de
  # pump.fun publica en su log las reservas de la curva, y el bot ya lee
  # ese stream entero. Solo se consulta al nodo cuando una moneda llega
  # al umbral, o sea unas pocas veces al dia.
  # ------------------------------------------------------------------
  # PRESION COMPRADORA — la unica fuente activa desde el 18-sep-2026.
  #
  # DE DONDE SALE EL NUMERO. Se midieron 27.241 monedas apuntando sus senales
  # a los 20 segundos de vida y siguiendolas 5 minutos. De todo lo probado, lo
  # que mas predijo un pump fue el numero de COMPRADORES DISTINTOS en una
  # ventana corta:
  #     de base            llegan al +25%   14,4%
  #     con >=3                             27,4%   (+13,0 puntos)
  #     con >=12                            25,8%   (+11,4 puntos)
  #
  # POR QUE 12 Y NO 3, QUE ACIERTA MAS. Por el RITMO. Con >=3 caen unas 3
  # monedas por minuto y con 5 plazas el bot se llena en dos minutos con las
  # PRIMERAS que pasen, no con las mejores: a partir de ahi elige el reloj y
  # no el filtro. Con >=12 caen unas 0,7 por minuto, que es el ritmo al que
  # las cinco plazas de verdad eligen. Se pierden 1,6 puntos de acierto y se
  # gana poder elegir.
  #
  # AVISO QUE NO HAY QUE OLVIDAR: con la escalera actual la cuenta sale
  # NEGATIVA incluso con este filtro (el TP1 cobra +5% de la posicion contra
  # un stop de -18%). Se arranca igual por decision de Manu y con 0,07 SOL
  # por operacion, que es lo que lo hace asumible mientras se mide de verdad.
  presion:
    enabled: false
    # Compradores DISTINTOS que tienen que entrar en la ventana.
    #
    # HISTORIA DE ESTE NUMERO, porque ha cambiado tres veces:
    #   12 -> se eligio por el RITMO (con 5 plazas, 3 monedas por minuto
    #         llenan el bot en dos minutos con las PRIMERAS que pasen)
    #    3 -> se bajo el 18-sep tras cinco minutos sin una sola compra
    #    8 -> pedido por Manu el 19-sep
    #
    # LO QUE DICEN LOS DATOS, sobre 27.241 monedas medidas: el 8 es el que
    # PEOR acierta de los tres (24,5%, contra 27,4% del 3 y 25,8% del 12).
    # Queda escrito aqui para que el dia que se revise no haya que volver a
    # medirlo: si se quiere acertar mas, el 3; si se quiere elegir mejor con
    # las 5 plazas, el 12.
    min_compradores_ola: 8
    ventana: 5.0
    buy_amount: 0.07
    # Por encima de este avance no se entra: eso lo cubre `curva_96`.
    max_avance_curva: 0.95
    # ANTI-BUNDLE. Sin esto esta fuente seria un iman de pump and dump: un
    # bundle ES "muchas carteras comprando a la vez", que es justo lo que
    # busca. La diferencia es CUANDO -- las del bundle entran en el bloque de
    # creacion. Si no se vio nacer la moneda, no se compra.
    max_carteras_primer_bloque: 3
    max_sol_primer_bloque: 2.0
    max_bundle_pct: 0.5
    # MODO FLEXIBLE (18-sep). En true el bot arrancaba CIEGO: solo podia
    # comprar monedas nacidas despues del arranque, porque de las que ya
    # existian no tiene los contadores del bloque de creacion. Eso es lo mas
    # seguro y resulto ser lo mas lento -- cinco minutos sin una sola compra.
    #
    # En false se compran tambien las que no se vio nacer. Lo que se pierde
    # hay que tenerlo escrito: de esas NO se puede saber si el bloque de
    # creacion estaba cargado de carteras, que es la firma del bundle. Todo el
    # peso pasa al tope de concentracion en cadena de la linea siguiente, que
    # va mas apretado para ellas.
    exigir_ver_creacion: false
    max_bundle_pct_sin_historia: 0.35
    # TOPE DE UN SOLO TITULAR, propio de esta fuente. El global es 0,15 y esta
    # pensado para monedas RECIEN NACIDAS, donde nadie ha tenido tiempo de
    # acumular. Esta fuente compra a media vida: alli un titular con mas del
    # 15% es lo normal, y ese tope las descartaba TODAS -- por eso el bot
    # estaba encendido, en real y sin comprar nada.
    #
    # Afloja una proteccion de verdad: con el 30% en una sola mano, esa mano
    # puede hundir la moneda cuando quiera. Es el precio de comprar a media
    # vida, y por eso el parte de descartes de Telegram va antes que esto: para
    # poder ver si de verdad era este el filtro.
    max_holder_pct: 0.30
    max_holder_pct_sin_historia: 0.25
    heartbeat_interval: 300

  # ESTRATEGIA ACTIVA: 23 TITULARES Y MENOS DE 20 MINUTOS.
  #
  # Lo pedido, literal: "que me compre cuando haya 99 holders en una moneda y
  # que tenga menos de cinco minutos de creacion, solo esas dos condiciones,
  # no quiero mas condiciones".
  #
  # LO QUE SE PIERDE, y tiene que estar escrito: esta fuente NO mira bundles.
  # Un bundle se monta con muchas carteras comprando a la vez que nace la
  # moneda, asi que cumple LAS DOS condiciones a la perfeccion -- muchos
  # titulares y recien creada. Es justo lo que se llevaba meses evitando. El
  # freno sigue en el repo (`max_carteras_primer_bloque` en `presion`,
  # apagada) y vuelve con una linea el dia que se quiera.
  #
  # Por eso el tope global `max_holder_pct` esta a 0 mas arriba: era la unica
  # condicion de mas que quedaba en el camino y habria descartado monedas sin
  # que ninguna de las dos reglas lo pidiera.
  holders:
    enabled: true
    # Carteras DISTINTAS que han comprado y no han soltado, contadas del
    # stream (no de un indexador: eso tardaria segundos y a esta edad ni
    # conoce la mitad de las monedas).
    min_holders: 23
    # SIN CORTE DE EDAD (22-sep, pedido: "3 y 4 pon simplemente presion
    # compradora"). Historial: 5 min -> 20 min -> sin limite.
    #
    # 0 NO significa "cero minutos": significa que no se mira la edad. Y al
    # apagarlo se deja de exigir tambien haber visto NACER la moneda, porque
    # eso nunca fue un filtro de calidad -- era la unica forma de saber la
    # edad. Era ademas el filtro mas duro de todos: descartaba todas las
    # monedas vivas cada vez que se reiniciaba el bot.
    max_edad_seg: 0
    # NO COGER UN DIP. Pedido el 19-sep. Las dos condiciones de
    # arriba miran cuanta gente hay y cuando nacio la moneda; estas
    # dos miran si en ESTE INSTANTE la moneda sube o se cae.
    #
    # Operaciones seguidas que tienen que ser COMPRAS justo antes de
    # entrar. No es lo mismo que el saldo de abajo: ese puede salir
    # bien mientras alguien va soltando por detras. Esto exige que
    # NADIE haya vendido en las ultimas. Medido: las monedas sin
    # ventas recientes hacian x2 el 41% de las veces, contra el 17%
    # de base. 0 = no se mira.
    # APAGADO el 22-sep, pedido. 0 = no se mira. Lo que queda cuidando de no
    # entrar en una caida es la presion compradora de aqui abajo.
    ultimas_compras: 0
    # Ventana en la que se compara el dinero que ENTRA contra el que
    # SALE. Tiene que entrar mas. 0 = no se mira.
    #
    # Tres segundos y no mas: en una ventana larga una compra gorda
    # de hace medio minuto tapa que ahora mismo esta cayendo, que es
    # justo lo que se quiere detectar.
    presion_seg: 3.0
    # NO COMPRAR EL ULTIMO ESCALON DE UNA VELA VERDE (23-sep, pedido).
    #
    # EL CASO QUE LO TRAJO: el bot entro en CATO a 26K de market cap, justo
    # despues de que la moneda subiera de 7,5K a 25K en medio minuto. Medio
    # minuto despues valia 12,4K. Comprar detras de una subida vertical es
    # comprar el techo: la gente que la empujo ya esta dentro, y lo siguiente
    # que hace es vender.
    #
    # NO ES LO MISMO QUE LA PRESION DE ARRIBA, y por eso hacen falta las dos:
    # la presion mira si AHORA entra mas dinero del que sale, y en plena vela
    # verde la presion es inmejorable -- justo en el peor momento para entrar.
    # Esto mira el PRECIO, que es lo que ya ha pasado.
    #
    # 1.0 = se descarta si ha DOBLADO en los ultimos 10 segundos. Es el numero
    # a mover si se ve que descarta de mas (sale en el parte como "detrás de
    # una vela verde"). 0 = no se mira.
    subida_seg: 10.0
    max_subida: 1.0
    # SIN IMPORTE PROPIO (19-sep: "elimina lo del 0.12, solo el
    # porcentaje"). Sin esta clave la fuente no manda importe y decide
    # el 25% del saldo. Si se le pusiera un numero aqui, ese numero
    # pisaria al global... y aun asi el porcentaje lo volveria a pisar
    # a el dentro del cerrojo de gasto. O sea: poner algo aqui no
    # serviria de nada y confundiria al leerlo.
    # A CERO: manda el 15% del saldo (`fraccion_saldo`). Ver el comentario del
    # `buy_amount` global: o importe fijo o porcentaje, nunca los dos.
    buy_amount: 0
    heartbeat_interval: 300

  curva_96:
    enabled: false
    # Punto de la curva en que se compra (0,95 = 95% vendido).
    #
    # Cuanto mas bajo, antes se entra: queda mas curva por llenar, asi que
    # hay mas recorrido si la moneda migra, pero tambien mas monedas que se
    # quedan a medias y nunca llegan. Del 96 al 95 se dobla la ventana (de un
    # 3,5% de curva a un 4,5%), asi que deberian entrar bastantes mas.
    #
    # Si se quiere bajar mas: a 0,92 quedaria un 8% de curva por llenar, que
    # es mas del doble de recorrido que a 96 -- y bastantes mas monedas que
    # no lo consiguen. Conviene mirar los resultados del 95 antes de bajarlo.
    umbral: 0.95
    # Pasado esto la moneda ya esta migrando y la curva deja de operar:
    # comprar ahi es tirar el dinero en comisiones.
    tope: 0.995
    buy_amount: 0.07
    # PRUEBA ACOTADA: 3 compras y, si dos salen mal, se para sola. Estos
    # frenos son SUYOS: no gastan el cupo de las demas fuentes ni al reves.
    max_compras: 3
    parar_tras_perdidas: 2

    # --- Nada de bundles de pump and dump -------------------------------
    # Un bundle se monta en el bloque de creacion: varias carteras del
    # mismo dueno comprando a la vez que nace la moneda, para tener el
    # token a precio cero y soltarlo sobre quien entre despues. Eso se ve
    # en el log de la cadena, sin preguntarle a ningun indexador.
    #
    # Carteras distintas comprando en el MISMO bloque de creacion. Un dev
    # que se compra su parte es 1; seis carteras a la vez no es casualidad.
    max_carteras_primer_bloque: 3
    # SOL cargados en ese primer bloque. Un dev-buy normal va de 0,1 a 1.
    max_sol_primer_bloque: 2.0
    # Compradores distintos en toda su vida. Una curva al 96% que solo
    # tocaron cuatro carteras no es demanda, es un grupo empujando.
    min_compradores: 30
    # Freno EN CADENA, este no depende de haber visto nacer la moneda: si
    # los mayores titulares concentran mas de esto del supply, es un
    # bundle aunque el bloque de creacion pareciera limpio. Va mas alto
    # que el tope general a proposito: al 96% la curva ya solto casi todo
    # el supply, asi que los primeros titulares pesan mucho mas que en una
    # moneda recien nacida.
    max_bundle_pct: 0.5
    # EL MISMO TOPE, PERO PARA LAS QUE NO SE VIO NACER. Va mas apretado a
    # proposito: en esas los tres avisos del bloque de creacion no existen y
    # este se queda casi solo, asi que tiene que pedir mas para compensar.
    max_bundle_pct_sin_historia: 0.35
    # Si el bot arranco DESPUES de que naciera la moneda, no se puede saber
    # quien compro en su bloque de creacion, que es donde se monta un bundle.
    #
    # EN false (lo pedido: ser mas flexible). Se compran tambien esas. Lo que
    # se pierde es real y conviene tenerlo escrito:
    #     - cuantas carteras compraron en el bloque de creacion
    #     - cuanto SOL se cargo ahi
    # Lo que sigue mirando:
    #     - compradores distintos vistos (min_compradores), que funciona con
    #       historia parcial y se queda corto, nunca de mas
    #     - concentracion de los mayores titulares EN CADENA, con el tope
    #       apretado de arriba
    #
    # Con true solo compraria las que nacen con el bot ya en marcha, y tras
    # cada reinicio estaria un rato sin comprar por aqui.
    exigir_ver_creacion: false
    heartbeat_interval: 300

  telegram_calls:
    # ENCENDIDA el 21-sep, pedido: "anade de nuevo los grupos de telegram y
    # mantenemos la estrategia holder". Las DOS fuentes corren a la vez: el
    # trader arranca una tarea por fuente encendida y las junta.
    #
    # NO CONFUNDIR CON LOS AVISOS. Esto son los canales de los que el bot LEE
    # senales de compra. Que el bot TE MANDE mensajes es `avisos_telegram`,
    # mas arriba, y sigue en false: "no quiero avisos, solo quiero que se
    # compre y se venda".
    enabled: true
    session_name: moontok_watcher
    # A CERO los tres, igual que el `buy_amount` global: desde el 23-sep manda
    # el 15% del saldo. TIENEN QUE COINCIDIR con el global: el importe de la
    # SENAL pisa al de arriba, asi que un numero distinto aqui dejaria el de
    # arriba sin efecto. Ya paso una vez.
    normal_buy_amount: 0
    nitro_buy_amount: 0
    promoted_buy_amount: 0
    promotion_threshold: 500
    # Dos tipos de canal mezclados, y conviene saberlo al leer resultados:
    #
    #   dextools_nitro, cryptolistings -> hay un PAGO detras (Nitro, listing
    #     de MoonTok). Alguien se ha gastado dinero en la moneda.
    #   Wagbocooks, LegendsAlphas, SolanaInsiderTerminal -> son CALLS.
    #     Alguien opina, sin pago detras.
    #
    # LegendsAlphas estuvo fuera por eso: "ensucia la muestra" al mezclarse
    # con las de pago. Esa objecion ya no aplica igual, porque desde el
    # 14-sep cada compra apunta de QUE CANAL vino (`origen` en trades.log) y
    # `deploy/resumen_dia.py` los separa. Ahora se puede ver si un canal de
    # calls gana o pierde en vez de discutirlo: si pierde, se quita.
    #
    # DEXTNewPairsBot sigue fuera.
    #
    # SolanaInsiderTerminal entro el 21-sep, pedido. Es de los de CALLS, asi
    # que se lee junto a Wagbocooks y LegendsAlphas al mirar el resumen.
    #
    # Y LO QUE NO MIRA NINGUN CANAL: una compra que venga de aqui NO pasa por
    # las condiciones de titulares --ni 23 carteras, ni edad, ni presion
    # compradora--. Cualquier direccion que acabe en `pump` y que alguien
    # pegue se compra si la curva se puede leer y la moneda no ha migrado.
    # Ademas las cinco plazas de `max_posiciones` son COMPARTIDAS, asi que un
    # canal movido puede ocupar huecos que queria titulares.
    #
    # OJO: los nombres tienen que ser el @usuario exacto del canal y tu
    # cuenta tiene que estar dentro. Un nombre que Telegram no resuelva se
    # descarta con un aviso en el log y los demas siguen (antes tumbaba la
    # fuente entera, Nitro incluido).
    channels:
      - dextools_nitro
      - cryptolistings
      - Wagbocooks
      - LegendsAlphas
      - SolanaInsiderTerminal
    # Solo monedas de pump.fun normales, que es lo pedido.
    suffixes:
      - pump

  # Explicitly excluded acquisition modes. This bot only consumes the
  # DexScreener paid/boost feed and the approved MoonTok/DEXTools channels.
  discord_calls:
    enabled: false
  gmgn_signals:
    enabled: false

  dexscreener:
    enabled: true
    enforce: true
    # false: una consulta lenta o fallida NO bloquea la compra. Con todos los
    # criterios de abajo a cero este filtro no comprueba nada, asi que en true
    # era una puerta sin condiciones que solo podia cerrarse -- y con 30
    # candidatos por vuelta tirando de la misma API, pasarse de los 6s de
    # timeout es facil. Si algun dia se le pone un criterio real (liquidez
    # minima, market cap), volver a ponerlo en true.
    block_on_error: false
    chain: solana
    require_listed: false
    require_dex_paid: false
    min_boosts: 0
    min_liquidity_usd: 0
    min_market_cap: 0
    max_market_cap: 0
    timeout_seconds: 6

callouts:
  enabled: true
  publish: false
  outbox: trades/pumpfun_callout_outbox.jsonl

cleanup:
  # RECUPERAR LA RENTA. Cada cuenta de token de Solana retiene ~0,00204 SOL
  # de deposito, y al cerrarla te la devuelven entera a la wallet. Estaba en
  # `post_session`, que solo corre al terminar la sesion: en un bot que no
  # para, eso es casi nunca, y cada moneda vendida dejaba su cuenta abierta
  # con esos 0,002 SOL dentro. Con 50 monedas son 0,1 SOL parados.
  #
  # `after_sell` la cierra en cuanto la posicion sale ENTERA. No bloquea la
  # escalera: corre despues de que el monitor haya terminado.
  mode: after_sell
  force_close_with_burn: false
  with_priority_fee: false

node:
  # CONSULTAS POR SEGUNDO. Es un tope NUESTRO, no de Helius: cuando se agota,
  # el bot se espera a si mismo y desde fuera parece que el nodo va lento.
  #
  # 45 con el primer plan de pago de Helius (19-sep), que da 50. Se dejan 5 de
  # margen a proposito: pasarse significa que el nodo conteste 429, y un 429
  # hace esperar al bot -- justo lo contrario de lo que se busca.
  #
  # ANTES ESTABA EN 15, y estrangulaba: 5 posiciones pidiendo precio cada
  # segundo son 5, mas las compras, las confirmaciones y los filtros. Con el
  # presupuesto agotado lo que se retrasa es el STOP LOSS.
  #
  # BAJADO A 25 EL 22-SEP, y con un motivo muy concreto: el nodo estaba
  # contestando 429 ("demasiadas peticiones") hasta en el saludo del
  # websocket, y el bot llevaba DOS DIAS sin recibir una sola operacion de la
  # cadena. 45 sobre un plan de 50 deja cinco de margen sobre el papel, pero el
  # limite de Helius no es un grifo liso: hay rafagas --confirmar una compra,
  # cinco posiciones pidiendo precio a la vez-- que se comen ese margen en un
  # instante, y basta con pasarse un segundo para que empiece el 429.
  #
  # 25 deja la mitad del plan libre. Se entra algo mas despacio, pero un bot
  # que entra despacio compra; uno bloqueado por 429 no compra nada.
  #
  # Si se cambia de plan, cambiar esto. En el log sale una linea por minuto,
  # SOLO cuando de verdad se ha esperado, que dice cuanto ha frenado este tope.
  max_rps: 25
